# Placeholder linter configuration. Project-wide Go standards are defined in CP02;
# this exists so CI has something real to run from CP01 onward.
run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
