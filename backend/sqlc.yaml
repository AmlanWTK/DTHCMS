# sqlc generates type-safe Go from the SQL that will actually run.
#
# The schema it reads is the migration set itself, so the generated types cannot drift
# from the database: a column renamed in a migration and not in a query is a compile
# error, not a runtime one at the moment a clinician saves a form.
#
# Queries live beside the module that owns them (internal/<module>/queries), because a
# single shared query directory is how one module ends up reading another module's
# tables — the thing architecture.json exists to prevent.
version: '2'

sql:
  - engine: postgresql
    schema: migrations
    # Explicitly listed rather than a recursive glob. Each entry is added in the
    # checkpoint that creates the module, which makes "which modules talk to the
    # database" a reviewable list rather than a property of the directory tree.
    queries:
      - internal/platform/queries
      - internal/auth/queries # CP15
      - internal/audit/queries # CP22
      - internal/eventstore/queries # CP23
      - internal/projection/queries # CP25
      - internal/patient/queries # CP28
      - internal/consent/queries # CP36
      - internal/visit/queries # CP38
      - internal/clinical/queries # CP42
    strict_function_checks: true
    gen:
      go:
        package: dbgen
        out: internal/platform/dbgen
        sql_package: pgx/v5

        # Nullable columns become pointers rather than sql.Null* wrappers: a clinical
        # value that is absent must be distinguishable from one that is zero, and
        # *float64 makes that impossible to ignore at the call site.
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: false

        overrides:
          - db_type: 'date'
            go_type: 'time.Time'
          - db_type: 'uuid'
            go_type: 'github.com/google/uuid.UUID'
          - db_type: 'uuid'
            nullable: true
            go_type: 'github.com/google/uuid.NullUUID'
          - db_type: 'timestamptz'
            go_type: 'time.Time'
          - db_type: 'timestamptz'
            nullable: true
            go_type:
              import: 'time'
              type: 'Time'
              pointer: true
            # The structured form is the only one that yields *time.Time. Measured with
            # sqlc 1.27.0, not reasoned about — every shorthand does something else:
            #
            #   go_type: '*time.Time'  ->  **time.Time   (the star is kept AND a pointer
            #                                             is added; this was the CP06 bug)
            #   go_type: 'time.Time'   ->  time.Time     (no pointer at all: a NULL would
            #                                             scan as the zero time, silently)
            #   no override            ->  pgtype.Timestamptz (a .Valid flag every call
            #                                             site has to remember to check)
            #
            # emit_pointers_for_null_types does not touch overridden types in any of these
            # cases; it only governs sqlc's own default mappings. The pointer has to be
            # asked for here, by name.
            #
            # Nothing in the schema was a nullable timestamp until CP15, so the original
            # mistake cost nothing while it sat here — and would first have been met while
            # writing `**s.RevokedAt`, which is where it would have been worked around
            # rather than fixed.
