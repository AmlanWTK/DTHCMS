version: 2

# One pull request per ecosystem per month, not one per dependency. Fifteen open
# dependabot branches is not a security posture, it is noise that hides the one bump
# that matters. Grouping keeps the branch list short enough to read at a glance.
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(deps)'
    groups:
      backend:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(deps)'
    groups:
      javascript:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
