name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real PostgreSQL, because the guarantees CP06 makes about the event ledger are
    # properties of PostgreSQL's privilege system. A mock would only confirm that the
    # mock was written to agree with the test.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dthcms
          POSTGRES_PASSWORD: dthcms_local_only
          POSTGRES_DB: dthcms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dthcms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DTHCMS_TEST_POSTGRES_URL: postgres://dthcms:dthcms_local_only@127.0.0.1:5432/postgres?sslmode=disable
      # No collector in CI. The telemetry tests use an in-memory exporter and assert on
      # spans that were really produced, so they need no backend; leaving this off also
      # exercises the fail-open path, since nothing here is listening on 4318.
      DTHCMS_OTEL_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        # v1.64 or newer: earlier releases are built with Go 1.23 and their type checker
        # rejects the //go:build go1.24 files in golang.org/x/net and x/sys that the
        # OpenTelemetry dependency tree brings in.
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: backend
      - name: Build
        run: go build ./...
      - name: Architecture and PHI guardrails
        run: go run ./tools/dthclint all
      - name: Migrations apply to an empty database
        env:
          DTHCMS_ENV: test
          DTHCMS_POSTGRES_MIGRATION_URL: postgres://dthcms:dthcms_local_only@127.0.0.1:5432/dthcms?sslmode=disable
        run: |
          go run ./cmd/migrate up
          go run ./cmd/migrate verify
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  sqlc:
    name: Generated database code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.27.0'
      - name: Generated code is current
        working-directory: backend
        run: |
          if ! sqlc diff; then
            echo ''
            echo 'The committed sqlc output does not match the schema and queries.'
            echo 'Run `make sqlc` and commit the result.'
            exit 1
          fi

  frontend:
    name: Web, mobile and packages (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm run format:check
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      # Compiles the station app's Android bundle through Metro — no emulator, no
      # signing, just proof that every screen, font and token import actually resolves.
      # This is what caught NativeWind's transitive jsx-runtime not resolving under
      # pnpm's strict linking.
      - name: Mobile bundle compiles
        run: pnpm --filter @dthcms/mobile run bundle:check

  e2e:
    name: Web shell (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A separate job because it needs a browser and a production build, which is also
      # why it is not part of `pnpm run verify`. It earns the minutes: the Content
      # Security Policy blocking every call to the API was a defect no test without a
      # browser could see, and it reached CP10's review only because Lighthouse was run
      # by hand.
      - name: Install Chromium
        run: pnpm --filter @dthcms/web run e2e:install
      - name: End-to-end
        run: pnpm --filter @dthcms/web run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  eas-build:
    name: Station app APK (EAS)
    runs-on: ubuntu-latest
    # CP11 acceptance criterion 5: CI produces an installable artefact. Gated on the
    # EXPO_TOKEN secret existing, so the pipeline is committed and dormant until the
    # Expo account is created — the day the secret is added, this turns on with no
    # further change. A job that failed daily for want of an account would train
    # everyone to ignore red.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Check for the Expo token
        id: token
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not configured; skipping the EAS build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.token.outputs.present == 'true'
      - name: Build the APK
        if: steps.token.outputs.present == 'true'
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm run tokens
          pnpm dlx eas-cli build --platform android --profile preview --non-interactive --no-wait

  custody:
    name: Blueprint custody
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the ratified blueprint has not been altered
        run: python scripts/check_custody.py
      # The Makefile and everything under .github/ are carried to a developer's machine
      # as literal text inside install-ci-files.ps1, because the desktop file bridge
      # refuses to write them. If that script falls behind, the CI somebody installs is
      # not the CI this repository describes.
      - name: Verify the CI installer is not stale
        run: python scripts/generate-install-ci-files.py --check
