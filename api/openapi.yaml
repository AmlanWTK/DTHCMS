# DTHCMS — the contract of record.
#
# Every route the API serves appears here, and a Go test (backend/internal/platform/httpx
# /conformance_test.go) fails the build if the router and this document disagree in either
# direction. That is the whole point of the file: drift becomes a build failure rather
# than an integration bug discovered by a station operator.
#
# The TypeScript client in packages/api-client is generated from this document. It is
# never hand-edited; CI regenerates it and fails if the result differs from what is
# committed.
#
# Conventions — pagination, idempotency, versioning, filtering — are documented with
# worked examples in docs/api-conventions.md. The reusable pieces they need are declared
# under components below, before the endpoints that will use them exist. That is
# deliberate: the first list endpoint at CP29 should reach for an existing convention
# rather than invent one.

openapi: 3.1.0

# The default for every operation that does not say otherwise: an access token, arriving by
# either transport. Operations that are public, or that use the refresh credential, override
# this with their own `security`.
security:
  - sessionToken: []
  - sessionCookie: []

info:
  title: DTHCMS API
  version: 0.1.0
  summary: Digital Diabetes, Thyroid & Hormone Clinic Management System
  description: |
    The HTTP contract between the DTHCMS backend and its three client surfaces — the
    station application, the web application, and the public verification page.

    ## What is here at CP12

    The operational endpoints only. `/healthz`, `/readyz` and `/version` are the three
    routes the service actually serves today; clinical routes arrive with the modules
    that own them, each adding its own paths to this document as part of its checkpoint.

    What CP12 establishes is not the endpoint list but the **shape everything later must
    take**: one error envelope, one pagination style, one idempotency mechanism, one
    versioning rule. A convention agreed once here costs nothing; the same convention
    retrofitted across twelve clinical stations is a rewrite.

    ## Versioning

    Clinical routes live under a URL-prefixed `/v1`. Within a version, changes are
    **additive only** — a new optional field, a new endpoint, a new enum member that
    clients may ignore. Anything that would break a client in the field (removing a
    field, narrowing a type, changing a status code, making an optional field required)
    requires `/v2`.

    This rule is stricter than it looks, and deliberately so. A station tablet may be
    running a build that is weeks old and has been offline for a day; the server cannot
    assume every client has updated. Deprecation is marked with `deprecated: true` and a
    `Deprecation` response header, and the field keeps working until the version is
    retired.

    The operational endpoints sit **outside** `/v1` on purpose: an orchestrator probing
    readiness has no credentials and no interest in API versions.

    ## Authentication (CP16)

    One access token, two transports. The station app holds the token and sends it as
    `Authorization: Bearer`; the web application never holds it — the same token arrives
    in an `httpOnly` cookie the browser attaches and script cannot read (ADR-0010). Either
    is accepted anywhere the default security applies.

    **Every request that changes state must carry `X-Requested-With: DTHCMS`.** This is
    the cross-site request forgery guard: a form on another site cannot set the header,
    and a script on another site cannot send it without a CORS preflight the API refuses.
    It applies to every client, bearer or cookie, and to sign-in itself — a request without
    it is refused with 403 before anything is looked at. Reads (`GET`, `HEAD`) do not need
    it.

    Access tokens live fifteen minutes. A 401 on an authenticated call means the token has
    expired or the session was ended; the client calls `/v1/auth/refresh` once — the
    browser sends the refresh cookie by itself — and retries. A 401 from refresh means
    sign in again.

    ## Errors

    Every non-2xx response — without exception — is an `Error` envelope. Clients branch
    on the machine-readable `code`, never on the message text. Both language variants
    are always present, because the interface may be in either when the error is shown,
    and half the clinic's staff work in Bangla.

    ## Authentication

    Implemented at CP16. Sign in at `/v1/auth/login`, then send the access token as
    `Authorization: Bearer <token>` on every request. It is opaque — 32 random bytes, not
    a signed claim set — and the server holds only its digest (ADR-0011).

    The token lasts fifteen minutes. `/v1/auth/refresh` exchanges the refresh cookie for a
    new pair; the refresh token rotates on every use, and presenting a spent one revokes
    every session descended from that login.

    The refresh credential is an httpOnly cookie rather than part of the response body
    (ADR-0010), and it is the only credential the browser attaches by itself. Everything
    that touches data carries its token explicitly, so nothing is authenticated by
    accident.

    Device verification arrives at CP18, authorisation at CP20 and rate limiting at CP49;
    those links in the chain are still pass-throughs.
  contact:
    name: DTHCMS engineering
    url: https://github.com/AmlanWTK/DTHCMS
  license:
    name: Proprietary — DTHC
    identifier: LicenseRef-DTHC-Proprietary

servers:
  - url: http://localhost:8080
    description: Local development (the CP04 docker-compose stack)

tags:
  - name: Authentication
    description: |
      Signing in, staying signed in, and stopping. Login and refresh are the only endpoints
      under `/v1` a caller without a session may reach — the rest of the chain cannot ask for
      what these exist to issue.
  - name: Corrections
    description: |
      The flagging workflow (CP62, §4.3, [R-04]) — the 140/150 case. A physician says a value looks
      wrong; the request is routed to **whoever typed it**, because the point of the mechanism is
      that the person who made the mistake learns of it. Correcting writes a new observation
      replacing the old one and recomputes everything derived from it; the original is never
      altered and stays queryable. A supervisor may answer instead, and that is a different event,
      because an operator's quality record must not read a supervisor's fix as though they had put
      it right themselves.
  - name: Nutrition
    description: |
      Station 7's 24-hour recall (CP59, §12.1).

      **Two assistants may build one recall at the same time, from two devices, and neither has to
      wait.** That is criterion 2 and [R-01]/[R-02], and the way it is achieved is worth stating:
      there is no assessment document to lock, merge or overwrite. A recall is a *set of entries*
      against a patient and a date, each written once by one named person and never edited — so two
      operators cannot collide, because they never write the same row. The conflict is designed out
      rather than resolved, which is the only version of concurrent editing that is correct at four
      in the afternoon with a queue waiting. The one real collision, the same food entered twice by
      two people who did not see each other, is a *duplicate*: the whole day comes back on every
      write so each sees the other's items, and a duplicate is taken back with a reason and a name.

      **Portions are household measures.** A patient says "two cups", not "three hundred grams". A
      screen that asked for grams would ask the operator to convert in their head in front of a
      patient, and the number reaching the record would be the operator's arithmetic rather than
      the patient's answer. So the entry carries the measure and the count, and the weight is the
      food table's business — both are stored, because the answer as given is the evidence and the
      grams are an interpretation of it.

      **The food table is a content dependency and says so.** Every row names where its figures came
      from and `approved` is false on all of it: the plan calls for a national nutrition institute
      table, and what ships is a starter list of what this clinic actually sees so that station 7
      runs on day one and the nutritionist has something concrete to correct.
  - name: Exercise
    description: |
      Station 8's exercise assessment and plan (CP60, §3 step 8, §12.1).

      **Contraindicated exercises are excluded, not warned about, and the exclusion happens on the
      server.** There is no endpoint that returns the library for a patient. A screen that received
      everything and hid part of it would be a warning wearing a different colour: the data would be
      on the device, one bug or one "show all" affordance away from being offered, and an operator's
      tap would be the only thing between a patient with an insensate foot and a jumping routine. So
      the permitted list is computed from the contraindications actually recorded, and the excluded
      rows never leave the server.

      What is sent instead is a **count and the reasons**: "three options are not shown because of
      severe neuropathy". That is transparency about the filter rather than an offer — a physician
      looking at a short list needs to know it is short on purpose, and a clinician who disagrees
      with an exclusion needs a sentence to disagree with rather than a silence.

      **A plan freezes the assessment it was filtered against.** A patient whose foot ulcer heals
      gets a new assessment, not an edited one, and last month's plan stays readable against last
      month's findings — which is the only way "why was she given stair climbing in June" has an
      answer at all.

      **Targets are two numbers**, times a week and minutes a session. §12.1's exercise-outcome
      analysis needs adherence comparable across visits from the first patient, and "walk more" is
      unanalysable. A database invariant refuses a target that is not countable.

      **The library and the contraindication mapping are rows, not code.** Both are open clinical
      decisions; what ships is a working set with `approved` false on every exercise, so that
      station 8 runs on day one and there is something concrete to correct. Every mapping carries
      the reason for the pair, in both languages, because a rule a clinician can read is one they
      can argue with.
  - name: Sync
    description: |
      The offline guarantee's server half (CP65, §15.2, §7.2).

      **A Wi-Fi drop must never lose a station entry.** The device records into its own encrypted
      store and sends when it can; this is what receives that, and everything here follows from the
      three things that go wrong when a phone has been out of signal for three hours.

      **A batch is not atomic, on purpose.** One bad event must not block the other forty-nine, so
      each is appended on its own — a rejected event has nothing to roll back, because the reason it
      was rejected is that it never got written. The honest consequence is that a dropped connection
      leaves some events landed and some not, which is exactly what client-generated `event_id`
      exists for: resend the whole batch and the landed ones come back `DUPLICATE`.

      **A late event is not a different kind of record.** `occurred_at` is the device's and is
      preserved exactly; `recorded_at` is the server's. A blood pressure taken at 08:40 and synced
      at 11:00 is a fact about 08:40 that the record learned about at 11:00, and collapsing the two
      would put a morning of measurements in the wrong order on every timeline. `source` is set to
      `MOBILE_OFFLINE_SYNC` by the server whatever the client claims.

      **A device revoked while it was offline is the hard case, and it has no automatic answer.**
      Accepting its forty real blood pressures defeats the revocation; dropping them loses a
      morning's work silently, which is worse, because the operator believes it is recorded. So they
      are held in full and a physician decides — released with their original timestamp and the
      original operator carried in the metadata, or refused by name and with a reason. Nothing in
      the quarantine is ever deleted.
  - name: Assessments
    description: |
      Station 3's lifestyle questionnaires and the composite risk score (CP58, §3 step 3, §12).

      **Raw item responses are stored, never only totals.** §12's cohorting is done on behaviour,
      and a total of 14 on a scale cannot be re-analysed, re-scored under a corrected formula, or
      compared against a study that weighted the items differently. Stored items are data; a stored
      total is a number somebody has to trust — so the total on every response here is computed
      from the items on the way out, and there is no column holding one.

      **D-26 is visible rather than hidden.** Several validated instruments are copyrighted and it
      has not been decided which this clinic may run. The copyrighted candidates are in the
      catalogue with `usable: false` and the sentence saying what has to be confirmed, so a
      clinician who expected to find PHQ-9 reads why it is absent instead of meeting a gap. A
      database invariant refuses their wording until somebody records a licence.

      **The composite score is a proposal and says so.** Its formula version is
      `0.1.0-proposed`, and the suffix is load-bearing: a score computed today must be
      identifiable forever as one computed before anybody agreed to the arithmetic. It is written
      as an ordinary derived observation (`LIFESTYLE_RISK`), so it inherits the correction cascade,
      the timeline and the research extract. **A domain that was not assessed is left out of the
      mean, never counted as zero** — the alternative flatters the patient who answered nothing
      and penalises the operator who ran the whole questionnaire.
  - name: Quality
    description: |
      An operator's own correction record, and the patterns across a team (CP63, §4.3). This is
      what makes the correction workflow worth running: §4.3's stated purpose is that *recurring
      patterns per operator surface so targeted retraining happens*.

      The plan also states the risk in its own words — *a metric that feels punitive damages data
      honesty; staff hide errors instead of correcting them* — and the shape of this API is that
      risk taken seriously. **An operator reads their own record with a session and nothing
      else**, because somebody who must be granted a permission to see their own error count will
      assume the count is being kept from them. **A rate is never returned without its
      denominator.** Rejected requests are reported separately and never counted as errors.
      **Every threshold is a proposal until a clinician approves it**, and every response says so.

      Reading somebody else's record needs `quality.read.team` — deliberately not
      `hr.performance.read`, which HR holds; ADR-0029 has the argument.
  - name: Directory
    description: |
      The names behind the ids every clinical value carries (CP61, §4.2). Staff, devices and
      stations, in both languages, with nothing sensitive in it — no contact details, no
      credentials, no role grants. One small request per session, cached by the client, so a
      screen can render "Shirin Akter, clinical counsellor, station 3" from a value that carries
      three uuids. Deactivated staff and retired devices stay listed, because attribution on last
      March's value names whoever took it and much of what a reviewer asks about is somebody who
      has since left.
  - name: Devices
    description: |
      The clinic's enrolled tablets and phones (CP18, D-46). An administrator issues an
      enrolment code; the device generates an Ed25519 keypair, keeps the private half, and
      presents the code with the public half. From then on it signs every request with four
      `X-Device-*` headers, and the session it opens is bound to it. A device is never
      deleted — it is suspended, revoked or reported lost — because an event written from it
      still names it.
  - name: Administration
    description: |
      The administrator console (CP21): staff accounts, their roles, their sessions and
      their credentials. Reads need `user.read`. Every write needs its permission **and** a
      step-up token — `user.manage` for accounts and roles, `credential.reset` for
      passwords, authenticators and sessions — so a session left open on a desk cannot
      invite a colleague or reset a password. Every write is audited with actor, target
      and reason (CP22).
  - name: Audit
    description: |
      The security audit log (CP22): an append-only, hash-chained record of sign-ins, role
      changes, credential resets, exports and break-glass access, each rendered as a
      sentence in English and Bengali. Reading needs `audit.read`. An export is a signed
      PDF (Ed25519 over SHA-256; the public key is published at `/v1/audit/signing-key`).
      Break-glass — emergency access with a typed justification — needs a clinical role
      and a `break_glass` step-up, and raises an alert every administrator's console shows
      until one acknowledges it.
  - name: Patients
    description: |
      The person the clinic knows (CP28, CP29). Registering one writes the patient, their
      sealed identifiers, their anonymised research row and `PATIENT_REGISTERED` in a single
      transaction — all of it or none of it.

      Two things are worth knowing before calling this. The date of birth is mandatory and
      carries `dob_precision` and `dob_source`, because a percentile computed from a guessed
      age is a clinical number that looks like a measurement; a patient who knows only their
      birth year is recorded as 1 January with `dob_precision: year`, which is honest rather
      than refused. And `event_id` is the client's — a tablet that sends a registration,
      loses the reply and sends it again must create one patient, and the ledger's uniqueness
      on `event_id` is what makes that true a week later as much as a second later.

      Identity numbers are hashed under a deployment pepper and sealed with the key ring.
      They never appear in a response, a log or an event; a screen shows the mask.

  - name: Queue
    description: |
      Where every patient is, and what is next (CP39, §5.2, §5.5, §14.2).

      The whole module turns on one sentence: **no patient is ever assigned to two operators at
      the same station.** Two operators pressing "call next" in the same second is the ordinary
      case, not the edge case — a station with two chairs does it all morning — and it is a
      race no amount of care in a handler wins. The claim selects one waiting row under
      `FOR UPDATE SKIP LOCKED`, so the second caller skips the locked row and gets the next
      patient, which is what they wanted.

      Priority jumps the queue and always says why. Waiting is measured from the moment the
      patient joined *this* queue, not from when the visit opened: a patient who waited two
      minutes for anthropometry after an hour in the building waited two minutes for
      anthropometry.

      The station sequence per visit type is **data**, not code — the sequences are an
      operational decision, and one in Go is one that needs a deployment to change.

  - name: Alerts
    description: |
      Values that mean somebody has to act now (CP50, §3 step 5, §4.4).

      There are four bands a number can be outside, and only the last of them makes a phone
      ring. The registry says what can be stored at all; plausibility says whether it is
      probably a typing error; the reference range says whether it is ordinary; a
      **critical value** says a patient is in danger. Conflating the third with the fourth is
      how a clinic learns to ignore both.

      An alert is raised **inside the transaction that stores the value**, so there is no
      window in which a dangerous number is in the record and nothing is coming. It is then
      pushed to the consultant, who has a window to acknowledge it before the chain escalates.
      Whether it reached a live screen at all is recorded — and when it did not, the operator
      who typed the value is told to go and find somebody, which is the escalation path that
      still works in a building with no Wi-Fi.

      Every threshold and every escalation window is **proposed** until D-27 approves it. The
      mechanism is not: it is built, tested, and changes rows rather than code.

  - name: Observations
    description: |
      Every measured clinical value, in one shape (CP42, §6, §11).

      Ten stations record values. Ten bespoke tables would make the timeline, the research
      extract and the FHIR mapping ten times harder, and would guarantee that the eleventh
      station invented an eleventh shape. So there is one write endpoint, one read model, and
      a **code registry** that says what each kind of value is: its category (one of the seven
      §6 names), its shape, the dimension of its unit, its plausibility band, and which
      permission recording it needs.

      **A unit-bearing value cannot be stored without its unit.** That is not a validation
      somebody remembers to run — it is a trigger on the read model and a standing database
      invariant, so a projection rebuild and a hand-written UPDATE hit it too. A weight of 154
      with no unit is 154 kg or 154 lb depending on who reads it, and a dose computed from it
      is wrong by a factor of 2.2.

      Both values are stored: the **canonical** one, for arithmetic, and the one that was
      **entered**, exactly as typed. Showing a value back in the unit it was entered in is
      therefore a read rather than a round trip.

      Nothing is deleted. A value that was wrong is `CORRECTED`; one that was right and has
      been re-measured is `SUPERSEDED`. Two different facts, and a report that conflated them
      would count re-measurements as an error rate.

  - name: Visits
    description: |
      The patient's journey through the clinic (CP38, §3, §11.1, §14.2).

      A **visit** is one journey: it opens when the patient arrives, passes through stations,
      and closes when the physician is done, carrying §11.1's memory — the complaint, the
      diagnoses, the plan and the next review interval in days.

      An **encounter** is one station touch, with a start, an end and a person. They cost
      almost nothing to record and make §14.2's bottleneck analysis a query rather than a
      project: "the counselling station is where mornings go" becomes a fact somebody can act
      on rather than an impression somebody argues about.

      Three rules are held by the database rather than by a handler, because each is one
      careless caller away from being violated and none of them announce themselves: the
      state machine (`open→closed`, `open→abandoned`, `closed→open`, `abandoned→open`, and
      nothing else); one open visit per patient; one open encounter per station per visit.

      Each action has its own permission. Reusing `patient.write.demographics` to open a visit
      would mean a physician closing one needs the permission to rewrite a name.

  - name: Consent
    description: |
      What a patient has agreed to, and what that permits (CP36, §15.1, §11.2, §12; D-02).

      **Layered.** Five consents — care, communication, research, AI processing, outreach —
      each independently grantable and revocable. A patient who wants treatment but not an
      SMS at seven in the morning is expressing a preference a single "I consent" box cannot
      record and cannot answer for later.

      **Versioned.** Every record carries the template version, the language shown and the
      digest of the exact text. "The patient consented to research" is not an answer anybody
      can act on in 2031; "was shown research consent v3 in Bangla on 14 September 2026 and
      gave a thumbprint, witnessed by REG-04" is. A template that has been consented against
      can never be edited.

      **Enforced at the point of use, not merely recorded.** Research is enforced by database
      privilege: the research role has no access to the subject table at all and reads a view
      that filters on live consent, so a non-consenting subject cannot be queried even by
      somebody writing their own SQL. Communication and AI processing go through a gate whose
      answer is invalidated by every write.

      **The wording is not here yet.** D-02 is a legal decision. Until the text is approved
      and loaded, `/v1/consent-templates` is empty and taking a consent answers `503`.

  - name: Counseling
    description: |
      The checklist a counsellor works through, authored by a physician rather than by a release
      (CP55, §5.1, [R-07]).

      **Versioning is the whole checkpoint.** §5.1 asks for templates configurable "without code
      changes", which is the easy half. The hard half is that a completed session retains the
      version it used. Without that, editing the diabetes template next March silently rewrites
      what every counsellor was asked to cover last October, and a record saying "all seven
      ticked" becomes a claim about a checklist that did not exist at the time — six months of
      counselling audit quietly unreadable, with nothing looking wrong.

      So a published version is **frozen**, by a database trigger rather than by an interface
      remembering. Editing means drafting a new version. That is more work for the author and it
      is the right trade: a typo fixed in a new version is honest, and one fixed in place is a
      small lie told to every past session.

      **Publishing is not saving.** Saving a draft is cheap and reversible; publishing puts a
      checklist on every phone on the floor within seconds and retires whatever was there before.
      Separate endpoint, separate permission, separate step-up, and audited.

      **Both languages, before publishing.** Half this clinic counsels in Bangla, and an item in
      one language is an item half the counsellors cannot read to a patient. Drafts may be
      half-written — that is what writing looks like — but a publish is refused.

      **The content is open.** D-53: the seven diabetes items are transcribed from §5.1 and are
      the launch minimum, not a clinical author's list; their Bengali and their guidance text are
      the engineer's. `approved_at` is null and every response reports it.

  - name: Allergies
    description: |
      §3 step 4's checkpoint: the hard stop (CP54, [R-01]).

      **No patient advances past the history station without allergy status.** Not a warning,
      not a nudge — a refusal, and one that no client can get past.

      **Where the gate lives.** Criterion 4 says it cannot be bypassed by any client, and a
      check in an application holds only for the paths somebody remembered. So the gate is a
      trigger on the queue table itself: a patient cannot be put in the queue for any station
      after the history station unless somebody has recorded their allergy status. The support
      script meets it, the second client meets it, and so does the one written after everybody
      who read the plan has left. These endpoints do not enforce it — they let a station satisfy
      it in five seconds, and let a screen say why the next button is not available yet.

      **Three ways to satisfy it, and no override.** One or more allergies recorded; "no known
      allergies" asserted; or "unable to assess", with the reason. The third exists precisely so
      there is no fourth. The unconscious patient and the child with no attendant are real, and
      the usual answer is an override button — but a gate with a way past it is a gate people
      learn the shape of, and the plan already names the risk: operators asserting NKA
      reflexively to clear it. `UNABLE_TO_ASSESS` is allergy status — somebody looked, somebody
      is named — and it is emphatically not a claim that there are none.

      **"No known allergies" is never a default.** There is no column in this system that means
      it by being empty. It is an event, with an actor, in the ledger — which is criterion 2,
      made structural rather than remembered.

      **Reading is not blinded.** `patient.read.allergies` reaches the pharmacist and the
      prescription educator, roles §4.4 blinds to diagnoses, because an allergy has to reach the
      person handing over the medicine. Blinding them would mean the last person who could catch
      the mistake is the one who cannot see the warning.

      Nothing is deleted. An allergy somebody withdrew is one somebody disagreed with, and the
      change history keeps both halves — because the next clinician needs to know that a
      colleague once believed it.

  - name: History
    description: |
      What the patient brings with them (CP53, §3 station 4, §11.1).

      Six kinds — complaints, other conditions, family history, operations, current medicines,
      vaccinations — and one shape for all of them, because they differ in their fields and not
      in their nature.

      **A history item is not an observation.** An observation is a point measurement: one
      code, one value, one moment, and it never changes. A history item has an identity that
      outlives the visit — a complaint that started three weeks ago is still there next month,
      and a patient is either still on metformin or has stopped. ADR-0028 has the argument.

      **Prior history is confirmed, never carried.** A system that rolled last month's history
      into this month's would eventually assert, in a signed clinical document, that a patient
      is on a drug they stopped in March, and nobody could say who claimed it, because nobody
      did. So there is no carry-forward write: the list comes back with the date each item was
      last confirmed, and confirming is one request per item with a person behind it. There is
      deliberately no batch — a "confirm all" button produces one action from a person and
      twenty assertions in the record.

      **Every item is coded, or says why it is not.** Complaints and comorbidities come from
      CP52's catalogue, and each kind draws on the one it should: the clinic's own dictionary
      for complaints and medicines, ICD for conditions and family history. An item may carry no
      coding when the catalogue has nothing for what the patient described — that is an escape
      hatch rather than a loophole, because every one of them is counted, and a growing count
      means the catalogue is wrong rather than the officers.

      **Four acts, four events.** Recorded, confirmed, amended, removed. Each names its actor,
      and none of them can un-happen. Removing is not resolving: "she had this and no longer
      does" is a clinical fact, and "this was never true" is a correction that takes a reason.

      Allergies are **not** here. They are their own thing because of the hard stop.

  - name: Terminology
    description: |
      The coded vocabulary a diagnosis or a complaint is recorded in (CP52, §8, §9.1, D-24).

      **Two systems, one shape.** ICD is the backbone — WHO publishes it under permissive
      terms — and the clinic's own `DTHC` dictionary holds the complaints ICD has no code for.
      Both are rows in the same tables, so a picker does not care which it is searching and a
      coding does not care which it came from.

      **Every coding carries its system and its version.** ICD-10's `E11.9` and ICD-11's
      `5A11` are not the same concept, and a diagnosis recorded in 2026 has to still mean in
      2032 what the person who recorded it meant. A client that names no version is answered
      with the resolved default *in the response*, so it has both halves in hand at the moment
      the clinician chooses rather than guessing later.

      **The ranking is one statement, and it says why.** Four tiers, in the order a clinician
      expects: the code typed literally; a clinic favourite whose words start with what was
      typed; anything else whose words start with it; then a trigram tier for misspellings.
      Every row carries the `tier` it matched and its `score`, because "why is that third" is
      the question every search gets asked, and a ranking nobody can inspect is a ranking
      nobody can tune.

      **SNOMED is described but unusable.** Its use requires an Affiliate licence and whether
      Bangladesh confers free use is D-24. It is registered as a system so that the mapping
      table can name it as a target before it holds a single row — and a standing database
      invariant refuses any content from a system marked unusable, because "we remembered not
      to" is not a control. Searching it answers `422`, not an empty list: "no results" sends
      a clinician looking for a better spelling, and this is not that.

      Nothing here is audited. There is no patient in a terminology search, and the audit
      trail is not a keystroke log.

  - name: Synthesis
    description: |
      The pre-consultation summary (CP71, §7.1, [R-05]). One page of narrative and a draft plan,
      assembled from the stations the patient has already passed and ready before they reach the
      consultation room.

      **The physician never has to ask for it.** The summary is requested automatically when every
      required station before the consultation has finished with the patient, inside that station
      touch's own transaction. The `POST` here is the button §7.1 gives the last assistant in the
      flow — a fallback for the morning the automatic trigger did not fire, not the normal path.

      **`GET` never answers 404 for a visit that exists.** D-15 is *"fail visible, never fail
      silent, never fail invented"*, and the failure it is really about is a screen that shows
      nothing. Every state is a 200 carrying a state name, a sentence in both languages, and the
      assembled clinical context — so a physician whose summary is queued, failed or was never
      requested reads the structured record with an explanation above it rather than an empty panel.

      **What the model was given is part of the answer.** `context` is the deterministic assembly:
      every number, date and finding the model was shown, each with a short reference the narrative
      cites. Nothing in the narrative should be traceable to anything else, and CP72's grounding
      validator will enforce exactly that.

      **The narrative is English only.** Clinical shorthand does not translate cleanly and a
      bilingual summary doubles the surface a hallucination can hide behind. Everything
      patient-facing in this system stays bilingual; this is a document one physician reads. The
      decision is recorded as awaiting confirmation.
  - name: Operations
    description: |
      Liveness, readiness and build information. Unauthenticated, unversioned, and
      never touching patient data — these are the endpoints an orchestrator and an
      on-call engineer need, and the first three things anyone checks in an incident.

paths:
  /v1/auth/login:
    post:
      operationId: login
      tags: [Authentication]
      summary: Sign in
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        Exchanges an employee code and password for a session.

        **Every failure returns the same 401 with the same message** — unknown code, wrong
        password, suspended account, throttled. That is deliberate, and it goes further than
        the response body: an unknown account still costs a password verification, the
        account's status is checked only *after* the password is verified, and the throttle
        delay is applied before the answer rather than after. A caller learns nothing from
        the message, from the timing, or from the difference between them.

        The real reason is recorded server-side, where an administrator can read it.

        Failed attempts slow down: two free, then one second doubling to a thirty-second cap,
        counted per employee code and per client address, whichever is worse. Never a
        lockout — employee codes are printed on rosters and called across a clinic floor, and
        locking one would hand anybody who knows it the ability to keep a clinician out of
        the system on the morning they need it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '202':
          description: |
            The password was right and a code is now owed. No session yet, no cookies. The
            `challenge` goes back with the code to `/v1/auth/login/second-factor` within five
            minutes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeResponse'
        '200':
          description: Signed in. The refresh cookie is set on this response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [Authentication]
      summary: Exchange the refresh credential for a new access token
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        Rotates both credentials. The old access token stops working the moment this returns.

        The refresh credential arrives by the transport the sign-in chose: the browser sends
        nothing but its `dthcms.refresh` cookie; the station app sends the token it stored,
        in the body. When both are present the body wins — a native HTTP library's cookie
        jar may hold a token the app has since rotated, and reading it first would present a
        spent token and revoke the family.

        **Presenting a refresh token that has already been exchanged revokes every session
        descended from that login.** A spent token arriving again means either a client
        retried after a dropped response, or somebody else holds a copy — the server cannot
        tell which, and only one of those readings is safe to act on. The response is the
        same 401 an expired token gets, so a replayed token teaches an attacker nothing about
        whether the replay was noticed.

        A rotated token keeps its predecessor's expiry rather than receiving a fresh one, so
        an actively used session still ends when the refresh window does. Otherwise "sign in
        again every fortnight" quietly becomes "never sign in again".
      security:
        - refreshCookie: []
        - {}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: |
            A new pair, delivered by the same transport the credential arrived by: the
            cookies are replaced on this response for the browser; the body carries
            `refresh_token` for the station app.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/me:
    get:
      operationId: currentUser
      tags: [Authentication]
      summary: Who am I, and what may I do?
      description: |
        The caller's identity, roles and permissions.

        Read live rather than carried in the token, which is the point of an opaque
        credential: a role revoked a minute ago is absent from the next response without
        anything being reissued.

        **The permission list is a courtesy, not a control.** It exists so an interface can
        hide what an operator cannot do. Enforcement is server-side and arrives at CP20; a
        screen that hides a button has not prevented anything.
      responses:
        '200':
          description: The authenticated user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/active-role:
    post:
      operationId: switchActiveRole
      tags: [Authentication]
      summary: Act as another role you hold
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        [R-02] — one operator, several stations, one phone, no logout. The blueprint states
        the staffing reality plainly: "the same assistant enters BP, then switches to
        anthropometry entry, from the same phone."

        **No new token is issued, deliberately.** Under ADR-0011 the session token is opaque
        and carries no authority: roles are read live on every request, which is what makes a
        grant revoked a minute ago absent from the next response. A token carrying the active
        role would put authority back inside a bearer string and keep a revoked role working
        until it expired.

        So the active role travels as `X-Active-Role` on every request, and the authorisation
        engine refuses one the caller does not hold. What this endpoint adds is the part with
        no other home: it confirms the role is held and returns that role's permissions and
        station, so the interface can redraw itself to one hat's worth of forms — and it
        **records the switch**, which no per-request header can do.

        A role the caller does not hold answers `403`. Deliberately not `404`: the roles a
        person holds are not a secret from them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role:
                  type: string
                  example: ANTHROPOMETRY
                from:
                  type: string
                  description: |
                    The role the interface believed was active, used only to make the audit
                    sentence readable. The server does not trust it.
      responses:
        '200':
          description: Now acting as that role.
          content:
            application/json:
              schema:
                type: object
                required: [role, grant]
                properties:
                  role: { type: string }
                  grant:
                    $ref: '#/components/schemas/RoleGrant'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/sessions:
    get:
      operationId: listSessions
      tags: [Authentication]
      summary: Where am I signed in?
      description: |
        Every live session this user holds, so they can recognise one and end it.

        Deliberately not an address. This is a screen a nurse reads to spot a device they no
        longer have; forensics lives in the attempt log, where the retention rules differ.
      responses:
        '200':
          description: Live sessions, most recently seen first.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/logout:
    post:
      operationId: logout
      tags: [Authentication]
      summary: Sign out of this device
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        Ends this session and the refresh tokens that could extend it.

        Both, because revoking the session alone would leave a refresh token able to mint a
        new one — a logout that logs nobody out.
      responses:
        '204':
          description: Signed out. The refresh cookie is cleared.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/logout-all:
    post:
      operationId: logoutEverywhere
      tags: [Authentication]
      summary: Sign out everywhere
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        Ends every live session this user holds, on every device.

        The button exists for the moment somebody believes their password is known, so it has
        to reach devices they no longer have — which is exactly the case a client-side logout
        cannot touch.
      responses:
        '200':
          description: How many sessions were ended.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEverywhereResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/login/second-factor:
    post:
      operationId: loginSecondFactor
      tags: [Authentication]
      summary: Finish a sign-in that stopped at the second factor
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        The second step of a sign-in for an enrolled account. `/v1/auth/login` answered
        `202` with a `challenge`; this exchanges that challenge and a proof — a six-digit
        code from the authenticator app, or a recovery code — for the session the password
        earned. Delivery is by the transport asked for, exactly as at `/v1/auth/login`.

        A challenge lives five minutes and dies after five wrong codes, whatever the clock
        says. A wrong code is one `401`, the same one a wrong password gets, and is counted
        by the same throttle. A recovery code works once; the response's `user.second_factor.recovery_codes_left`
        says how many remain.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecondFactorLoginRequest'
      responses:
        '200':
          description: A session, delivered by the transport asked for.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/second-factor:
    get:
      operationId: secondFactorStatus
      tags: [Authentication]
      summary: Where this account stands with its second factor
      description: |
        Whether a second factor is required for this person's roles, whether one is
        enrolled, whether an enrolment is half-finished, and how many recovery codes are
        left. The same object `/v1/auth/me` carries as `second_factor`; here on its own so a
        settings screen can refresh it without re-reading the whole identity.
      responses:
        '200':
          description: The state of the second factor.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecondFactorStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/second-factor/enrol:
    post:
      operationId: secondFactorEnrol
      tags: [Authentication]
      summary: Start enrolling an authenticator app
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        Mints a fresh seed and returns it twice: as an `otpauth://` URI for a QR code, and as
        base32 for typing by hand. **Both are the secret.** The client shows them once and
        keeps neither; the server keeps the seed only sealed (ADR-0012).

        The factor does not protect anything yet. It becomes active when
        `/v1/auth/second-factor/confirm` proves the app can produce a code. Calling this
        again before that replaces the seed; calling it once a factor is confirmed is
        refused with `409` — a working factor is disabled first, with a step-up, so the
        record shows one being taken down before another goes up.
      responses:
        '200':
          description: The seed, for the app.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/second-factor/confirm:
    post:
      operationId: secondFactorConfirm
      tags: [Authentication]
      summary: Prove the app has the seed, and receive the recovery codes
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        A code from the newly enrolled app. If it verifies, the factor is active from this
        moment — the next sign-in will ask for a code — and the response carries the ten
        recovery codes, **shown exactly once**. They are stored as digests; there is no way
        to see them again, only to replace the sheet.

        A code that does not match is `422` with a message on the `code` field, and the
        enrolment stays pending: the usual cause is the phone's clock, and the fix is to try
        the next code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRequest'
      responses:
        '200':
          description: The factor is active. Here are the recovery codes, once.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/second-factor/disable:
    post:
      operationId: secondFactorDisable
      tags: [Authentication]
      summary: Turn the second factor off
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/StepUpToken'
      description: |
        Privileged: needs a step-up token for the purpose `second_factor.disable`, minted by
        `/v1/auth/step-up` moments before. A session left open on a desk cannot quietly take
        the factor down. The recovery codes go with it.

        For a person who has lost their phone *and* their recovery codes, this endpoint is no
        use — they cannot step up. That path is the administrator's, at CP21.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableRequest'
      responses:
        '204':
          description: The factor is off.
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/second-factor/recovery-codes:
    post:
      operationId: secondFactorRecoveryCodes
      tags: [Authentication]
      summary: Replace the recovery codes
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/StepUpToken'
      description: |
        Privileged: needs a step-up token for the purpose `second_factor.recovery_codes`.
        Returns a fresh sheet of ten and revokes every code from the previous one, used or
        not — the sheet in the drawer stops working the moment a new one exists.
      responses:
        '200':
          description: The new recovery codes, once.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodesResponse'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/auth/step-up:
    post:
      operationId: stepUp
      tags: [Authentication]
      summary: Confirm a second factor for one privileged action
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      description: |
        Exchanges a fresh code (or a recovery code) for a **step-up token**: good for five
        minutes, for this session, for the one `purpose` named, and for one use. It is sent
        as `X-Step-Up-Token` to the privileged endpoint, which consumes it.

        This is how a signed-in physician signs a prescription, an administrator changes a
        role, a researcher exports data, and anyone disables their own factor. A privileged
        endpoint called without one answers `403` with code `STEP_UP_REQUIRED`, which is the
        client's cue to open the prompt and try again.

        Purposes are a closed list. A purpose that is not declared is `400`, not a new
        purpose.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: A step-up token for the purpose.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/admin/roles:
    get:
      operationId: listAdminRoles
      tags: [Administration]
      summary: The role catalogue with each role's permissions
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      description: |
        For the effective-permission preview: what granting a role would add. Needs `user.read`.
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCatalogue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/admin/users:
    get:
      operationId: listAdminUsers
      tags: [Administration]
      summary: Every staff account of the facility
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [invited, active, suspended, deactivated]
      description: |
        With live roles, the permissions those confer, and the second factor's state.
        Needs `user.read`. `?status=` filters.
      responses:
        '200':
          description: OK.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: inviteUser
      tags: [Administration]
      summary: Create a staff account
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/StepUpToken'
      description: |
        Employee code, both names, roles, and — set in person at the desk — a password. With a
        password the account is `active` at once; without one it stays `invited` until a
        password is set. Needs `user.invite` and a `user.manage` step-up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '201':
          description: The account.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/StepUpRequired'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
