        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/consents/{type}/revoke:
    post:
      operationId: revokePatientConsent
      tags: [Consent]
      summary: Withdraw a consent
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [care, communication, research, ai_processing, outreach]
      description: |
        Needs `patient.consent.revoke`.

        A `POST` to a sub-resource rather than a `DELETE`, because **nothing is deleted**. The
        grant stays and a revocation is recorded beside it; both are needed to answer whether
        a message sent in March was lawful when it was sent.

        **Effective immediately.** The row that says "do not send" is written by the same
        transaction as the event saying so, so there is no interval in which the ledger and
        the enforcement disagree. §15.1's budget is one minute.

        A reason is optional, deliberately: a patient withdrawing consent does not owe anybody
        an explanation, and a mandatory field would be filled in with "revoked" by an operator
        standing in front of somebody who wants to leave.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRevokeRequest'
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [consent]
                properties:
                  consent:
                    $ref: '#/components/schemas/PatientConsent'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/visits:
    post:
      operationId: openVisit
      tags: [Visits]
      summary: A patient has arrived
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: |
        Needs `visit.open`. Opens a visit and assigns a visit code — `V-2026-0914-017`, the
        seventeenth patient of that morning — which a queue board can call out.

        **One open visit per patient**, held by a partial unique index rather than by a check
        in a handler: two would mean two queues for one person and two places for the
        physician's note to go. A second attempt answers `409` **with the visit they already
        have**, so the desk sends them to the queue rather than trying again.

        `event_id` is the client's, so a tablet that opened a visit, lost the reply and
        pressed again finds the same visit rather than opening a second one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
