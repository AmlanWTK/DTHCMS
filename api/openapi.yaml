        in a handler: two would mean two queues for one person and two places for the
        physician's note to go. A second attempt answers `409` **with the visit they already
        have**, so the desk sends them to the queue rather than trying again.

        `event_id` is the client's, so a tablet that opened a visit, lost the reply and
        pressed again finds the same visit rather than opening a second one.
