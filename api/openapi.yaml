  /healthz:
    get:
      operationId: getLiveness
      tags: [Operations]
      summary: Is the process alive?
      description: |
        Answers one question: is this process running and able to serve HTTP?

        It deliberately **never touches a dependency**. A failing database must not
        cause the orchestrator to kill and restart a perfectly healthy process — that
        turns one outage into two, and the restarted process fails exactly the same way.
        Dependency health is `/readyz`.
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              examples:
                alive:
                  summary: A healthy process
                  value:
                    status: ok
                    service: api
                    version: 0.1.0-dev

  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Can it serve requests?
      description: |
        Checks every declared dependency in parallel and reports which one is unhappy.

        Dependency failures are reported as a **status word, never as the underlying
        error text**: a connection error can contain a host, a user name or a password.
        The detail goes to the log, where it is access-controlled.

        A critical dependency being unavailable makes the service unready (503). A
        non-critical one degrades it but still reports 200 — the blob store being down
        stops document upload, not the clinic.
      security: []
      responses:
        '200':
          description: Ready to serve. Every critical dependency answered.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ready:
                  summary: Everything answering
                  value:
                    status: ok
                    service: api
                    version: 0.1.0-dev
                    checks:
                      postgres: ok
                      redis: ok
                      blobstore: ok
                degraded:
                  summary: A non-critical dependency is down — still ready
                  description: |
                    The blob store is not critical: document upload fails, the clinic
                    keeps running. Reporting this as unready would take the whole
                    service out for a feature most of a session never touches.
                  value:
                    status: ok
                    service: api
                    version: 0.1.0-dev
                    checks:
                      postgres: ok
                      redis: ok
                      blobstore: unavailable
        '503':
          description: |
            Not ready. At least one **critical** dependency did not answer. The response
            body names which, so the on-call engineer does not have to guess.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                unready:
                  summary: The database is unreachable
                  value:
                    status: unready
                    service: api
                    version: 0.1.0-dev
                    checks:
                      postgres: unavailable
                      redis: ok
                      blobstore: ok

  /version:
    get:
      operationId: getVersion
      tags: [Operations]
      summary: What exactly is running?
      description: |
        The build identity of the running binary: version, commit and build time.

        This is the first question in any incident, and the one that is hardest to
        answer from outside. Values are injected at build time through `ldflags`; a
        development build reports `0.1.0-dev` with `unknown` for commit and build time,
        which is itself the answer to "is this a real build?"
      security: []
      responses:
        '200':
          description: Build information for this binary.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              examples:
                release:
                  summary: A CI-built binary
                  value:
                    service: api
                    version: 0.1.0
                    commit: 4f2c1a9e8b3d5f7a1c2e4b6d8f0a2c4e6b8d0f2a
                    build_time: '2026-08-24T06:43:00Z'
                development:
                  summary: A local build
                  value:
                    service: api
                    version: 0.1.0-dev
                    commit: unknown
                    build_time: unknown

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        The staff access token, sent as `Authorization: Bearer <token>`.

        Opaque: 32 bytes of randomness, not a signed claim set. The server stores only its
        SHA-256 digest and looks that up on every request (ADR-0011) — which is what makes
        "a revoked session stops working within one request" true rather than aspirational,
        and what keeps a leak of the session table from yielding anything presentable.

        There is nothing to decode. A client that wants to know who it is, or what it may
        do, asks `/v1/auth/me`; a client that reads a token is reading a random string.

    sessionCookie:
      type: apiKey
      in: cookie
      name: dthcms.session
      description: |
        The same access token as `sessionToken`, in an httpOnly cookie on every path — the
        browser's transport. Set by `/v1/auth/login` and `/v1/auth/refresh`, cleared by
        `/v1/auth/logout` and `/v1/auth/logout-all`, and expiring with the token.

        Per ADR-0010 the web application holds no credential of its own: a token JavaScript
        can read is a token a cross-site scripting hole can take away. A cookie the browser
        attaches by itself is attached to requests the user did not intend, which is why every
        state-changing request also needs `X-Requested-With: DTHCMS` (see `RequestedWith`).

        When both the header and the cookie are present the header wins.

    refreshCookie:
      type: apiKey
      in: cookie
      name: dthcms.refresh
      description: |
        The refresh credential, in an httpOnly cookie scoped to `/v1/auth`.

        A cookie rather than a value in the response body, per ADR-0010: a credential in
        `localStorage` turns one cross-site scripting hole into stolen credentials that keep
        working from the attacker's own machine. This application renders patient names,
        free-text notes and OCR output from photographs of paper the clinic did not write —
        which is to say, text from outside.

        It is the only credential the browser attaches on its own, and it is scoped to the
        two endpoints that have any use for it. Everything that touches data carries its
        access token explicitly.

  headers:
    XRequestID:
      description: |
        The correlation ID for this request, echoed on **every** response including
        errors. A station operator reporting a problem can read it down the phone, and
        it ties together every log line, span and background job belonging to the one
        interaction.

        A client may supply its own on the way in (up to 64 characters); the server
        generates a UUIDv7 when it does not.
      schema:
        type: string
        maxLength: 64
      example: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Deprecation:
      description: |
        Present when the endpoint is deprecated. Carries the RFC 9745 date after which
        it may stop working. The endpoint keeps functioning until the API version is
        retired — a station tablet running a three-week-old build must not break because
        a deprecation landed on the server.
      schema:
        type: string
      example: '@1793404800'

    RetryAfter:
      description: Seconds to wait before retrying. Present on 429 and, where known, 503.
      schema:
        type: integer
        minimum: 0
      example: 30

  parameters:
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: |
        The cross-site request forgery guard. Must be exactly `DTHCMS` on every request that
        changes state, from every client. A request without it is refused with 403 before
        anything else is examined — including sign-in, since signing a victim into an
        attacker's account is also an attack.
      schema:
        type: string
        const: DTHCMS

    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      description: |
        A step-up token from `/v1/auth/step-up`, minted for this endpoint's purpose. Consumed
        by the request it authorises. Absent, expired, spent, or for another purpose or
        session: `403` with code `STEP_UP_REQUIRED`.
      schema:
        type: string

    ActiveRole:
      name: X-Active-Role
      in: header
      required: false
      description: |
        The role the caller is acting as for this request — the hat being worn [R-02].
        One of the role codes `/v1/auth/me` lists; a code the caller does not hold is
        refused. Absent, every held role applies together, and so does every rule that
        binds any of them (`docs/access-model.md` §4). The web application sends the role
        chosen in the switcher on every request.
      schema:
        type: string

    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The enrolled device's id. Part of the signed string.
      schema:
        type: string
        format: uuid

    DeviceTimestamp:
      name: X-Device-Timestamp
      in: header
      required: true
      description: |
        Seconds since the epoch by the device's clock. Must be within five minutes of the
        server's, or the request is refused before the signature is examined.
      schema:
        type: integer
        format: int64

    DeviceNonce:
      name: X-Device-Nonce
      in: header
      required: true
      description: |
        Sixteen random bytes, base64url without padding, fresh per request. Remembered for
        ten minutes; a repeat is refused as a replay.
      schema:
        type: string

    DeviceSignature:
      name: X-Device-Signature
      in: header
      required: true
      description: |
        Ed25519 over `METHOD\npath\ntimestamp\nnonce\nhex(sha256(body))\ndevice-id`,
        standard base64. `docs/identity.md` §9 has the scheme and the test vector shared
        with the station app.
      schema:
        type: string

    UserIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DeviceIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous page's `page.next_cursor`. Omit for the first
        page. The value is not parseable by clients and its encoding is not part of the
        contract — treat it as a token to hand back.
      schema:
        type: string
        maxLength: 512
      example: eyJhZnRlciI6IjAxOThjNGUyIn0

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum items to return. The server may return fewer — never assume a short page
        means the end; `page.has_more` is the only reliable signal.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    UpdatedSince:
      name: updated_since
      in: query
      required: false
      description: |
        Return only records changed at or after this instant. The standard filter for a
        station application catching up after a period offline.
      schema:
        type: string
        format: date-time
      example: '2026-08-24T06:00:00Z'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated UUIDv7 making a write safe to retry.

        Required on **every** state-changing request. A clinic's connection drops
        mid-save routinely, and the station application queues writes offline and
        replays them on reconnect. Without this header, one recorded blood-pressure
        reading becomes two rows in an append-only ledger — which, the ledger being
        append-only, is not something anybody can quietly tidy up afterwards.

        The server stores the outcome against the key and returns the **original
        response** for a repeat, rather than performing the work twice. The same key
        with a genuinely different body is a `409 CONFLICT`, not a silent overwrite.

        Keys are generated by the client *before* the request is queued, which is what
        makes an offline replay safe: the identifier travels with the event rather than
        being assigned on arrival.
      schema:
        type: string
        format: uuid
      example: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        A client-supplied correlation ID. Echoed back on the response. The server
        generates one when this is absent or longer than 64 characters.
      schema:
        type: string
        maxLength: 64

  schemas:
    Error:
      type: object
      title: Error
      description: |
        The one shape an error takes on the wire. Every non-2xx response is this
        envelope — there is no second error format anywhere in the API.
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      title: ErrorBody
      required: [code, kind, message, message_bn]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable, and the **only** thing a client may branch on.
            Message text is written for humans and will be reworded; codes will not.
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [VALIDATION_FAILED, NOT_FOUND, RATE_LIMITED]
        kind:
          $ref: '#/components/schemas/ErrorKind'
        message:
          type: string
          description: |
            English, shown to the user. Never contains internal detail — no query text,
            no file path, and no indication of whether a resource the caller may not see
            happens to exist.
        message_bn:
          type: string
          description: |
            Bangla, shown to the user. Always present, never a fallback to English:
            half the clinic's staff work in Bangla, and an error is exactly the moment
            a person needs their own language.
        fields:
          type: object
          description: |
            Per-field validation messages, keyed by field name. Present on
            `VALIDATION_FAILED`, absent otherwise.
          additionalProperties:
            type: string
          examples:
            - date_of_birth: A date of birth cannot be in the future.
        correlation_id:
          type: string
          description: |
            The request's correlation ID, repeated in the body so it survives being
            screenshotted — which is how errors are actually reported from a clinic.
          maxLength: 64
      examples:
        - code: VALIDATION_FAILED
          kind: validation
          message: Some values need correcting.
          message_bn: কিছু তথ্য সংশোধন করতে হবে।
          fields:
            date_of_birth: A date of birth cannot be in the future.
          correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    ErrorKind:
      type: string
      title: ErrorKind
      description: |
        What sort of error this is, and therefore how the interface should respond.

        The distinction is not cosmetic. A blocked safety rule needs an override path
        with a recorded reason; a database timeout needs a retry button. An interface
        that shows the same red box for both teaches staff to dismiss both.
      enum:
        - validation
        - auth
        - not_found
        - conflict
        - clinical
        - technical
      x-kind-meanings:
        validation: The request was malformed or failed a rule. The user can fix it.
        auth: Not authenticated, or not permitted. Never reveals which.
        not_found: The resource does not exist, or the caller may not know that it does.
        conflict: The request contradicts current state.
        clinical: A clinical rule blocked the action. May permit a recorded override.
        technical: The system failed. Not the user's fault, and retryable.

    PageInfo:
      type: object
      title: PageInfo
      description: |
        Cursor pagination. A list response is `{ "items": [...], "page": PageInfo }`.

        Cursors rather than page numbers because clinical lists change underneath the
        person reading them. A queue gains a patient while an operator is on page two;
        with offset pagination that shifts every subsequent row, so the operator sees
        one patient twice and never sees another at all. A cursor is a position in the
        data, not a count of rows skipped, so an insertion above it changes nothing.

        The cost is that there is no "jump to page 7" and no total count. Neither is
        something a station operator has ever needed; both are things a paging bug
        would happily provide.
      required: [has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: [string, 'null']
          description: |
            Pass as `cursor` to fetch the next page. `null` on the last page.
          maxLength: 512
        has_more:
          type: boolean
          description: |
            Whether another page exists. **The only reliable end-of-list signal** — a
            page shorter than `limit` does not mean the end.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [employee_code, password]
      properties:
        employee_code:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^[A-Z][A-Z0-9_-]{1,15}$'
          description: |
            The short identifier printed on the roster and spoken across the clinic floor.
            Unique within a facility, not globally.
          example: JD_04
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          description: |
            Verified with argon2id. The upper bound is not a statement about password
            strength; it stops a caller spending the server's memory by submitting a
            megabyte.
        transport:
          type: string
          enum: [cookie, bearer]
          default: cookie
          description: |
            How the credentials should be delivered.

            `cookie` — the browser. Both tokens are set as httpOnly cookies and the body
            carries the access token only for the station app's benefit; a browser has no
            use for it and does not keep it (ADR-0010).

            `bearer` — the station app. Both tokens come back in the body and **no cookies
            are set**: the app keeps the refresh token in the device Keystore and the access
            token in memory, and a cookie jar it does not control would re-send a
            rotated-away token and trip the reuse detector.

    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, expires_at, user]
      properties:
        access_token:
          type: string
          description: |
            Send as `Authorization: Bearer <token>`. Opaque — there is nothing to decode, and
            a client that tries is reading a random string.

            Keep it in memory. Not `localStorage`, not `sessionStorage`, not a cookie set by
            script (ADR-0010); an ESLint rule fails the web build on any of those.
          example: 8Kx2mQ7vN4pR1sT6wY9zA3bC5dE0fG8hJ2kL4mN6pQ8
        expires_at:
          type: string
          format: date-time
          description: |
            Fifteen minutes out. Refresh before it passes rather than waiting for a 401 — the
            refresh cookie is already in the browser.
        user:
          $ref: '#/components/schemas/CurrentUser'
        refresh_token:
          type: string
          description: |
            Present only for the `bearer` transport. Store it in secure storage, never in
            a preference store, and send it in the body of `/v1/auth/refresh`. Each use
            returns a replacement; the old one is spent, and presenting it again revokes the
            session and everything descended from it.
        refresh_expires_at:
          type: string
          format: date-time
          description: |
            Present only for the `bearer` transport. Fourteen days from sign-in, and not
            extended by refreshing — a session in daily use still ends when this passes.

    SecondFactorStatus:
      type: object
      additionalProperties: false
      required: [required, enrolled, pending, recovery_codes_left]
      properties:
        required:
          type: boolean
          description: One of the person's roles mandates a second factor (D-45).
        enrolled:
          type: boolean
          description: A seed is confirmed and not disabled. Sign-in asks for a code.
        pending:
          type: boolean
          description: A seed exists but the app has not yet proved it has it.
        recovery_codes_left:
          type: integer
          minimum: 0
        confirmed_at:
          type: string
          format: date-time

    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge, expires_at]
      properties:
        challenge:
          type: string
          description: Opaque. Goes back with the code. Says nothing about the account.
        expires_at:
          type: string
          format: date-time

    SecondFactorLoginRequest:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          description: Six digits from the authenticator app. Either this or `recovery_code`.
        recovery_code:
          type: string
          minLength: 16
          maxLength: 24
          description: |
            A recovery code, as printed (`XXXX-XXXX-XXXX-XXXX`). Case and dashes are forgiven.
            Works once.
        transport:
          type: string
          enum: [cookie, bearer]
          default: cookie

    EnrolmentResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: The seed, base32, for typing into an app by hand. Show once; keep nowhere.
        otpauth_uri:
          type: string
          description: The same seed as an `otpauth://totp/...` URI, for a QR code.

    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'

    RecoveryCodesResponse:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            example: K7QM-3XZP-A9BD-2NWE
          description: Shown once. Each works once. Store them as you would a key.

    DisableRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: Optional. Recorded in the security event.

    StepUpRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum:
            - second_factor.disable
            - second_factor.recovery_codes
            - prescription.sign
            - rbac.change
            - research.export
            - clinical.override
            - user.manage
            - credential.reset
            - break_glass
          description: What the token will be good for, and nothing else.
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
        recovery_code:
          type: string
          minLength: 16
          maxLength: 24

    StepUpResponse:
      type: object
      additionalProperties: false
      required: [step_up_token, purpose, expires_at]
      properties:
        step_up_token:
          type: string
          description: Send as `X-Step-Up-Token`. One session, one purpose, one use, five minutes.
        purpose:
          type: string
        expires_at:
          type: string
          format: date-time

    AdminUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          employee_code,
          name_en,
          name_bn,
          phone,
          email,
          status,
          status_reason,
          status_since,
          last_login_at,
          roles,
          permissions,
          second_factor,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        employee_code:
          type: string
        name_en:
          type: string
        name_bn:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
        status_reason:
          type: string
        status_since:
          type: string
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          description: The union across live roles — the effective-permission preview.
        second_factor:
          $ref: '#/components/schemas/SecondFactorStatus'
        created_at:
          type: string
          format: date-time

    AdminAccount:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          required: [sessions, grant_history]
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSummary'
            grant_history:
              type: array
              items:
                $ref: '#/components/schemas/GrantHistoryEntry'

    GrantHistoryEntry:
      type: object
      additionalProperties: false
      required: [role, granted_at, granted_by, revoked_at, revoked_by, revoke_reason]
      properties:
        role:
          type: string
        granted_at:
          type: string
          format: date-time
        granted_by:
          type: [string, 'null']
          format: uuid
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoked_by:
          type: [string, 'null']
          format: uuid
        revoke_reason:
          type: string

    AdminUserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'

    AuditSubject:
      type: object
      additionalProperties: false
      required: [id, code]
      properties:
        id:
          type: [string, 'null']
          format: uuid
        code:
          type: string
          description: Employee code as it was at the time; empty for an unknown account.

    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          seq,
          kind,
          label_en,
          label_bn,
          recorded_at,
          actor,
          actor_role,
          target,
          patient_id,
          device_id,
          reason,
          details,
          sentence_en,
          sentence_bn,
          hash,
        ]
      properties:
        seq:
          type: integer
          format: int64
        kind:
          type: string
        label_en:
          type: string
        label_bn:
          type: string
        recorded_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditSubject'
        actor_role:
          type: string
        target:
          oneOf:
            - $ref: '#/components/schemas/AuditSubject'
            - type: 'null'
        patient_id:
          type: [string, 'null']
          format: uuid
        device_id:
          type: [string, 'null']
          format: uuid
        reason:
          type: string
        details:
          type: object
          additionalProperties: true
        sentence_en:
          type: string
          description: The human sentence, English.
        sentence_bn:
          type: string
          description: The human sentence, Bengali.
        hash:
          type: string
          description: Hex SHA-256 of this row, chained to the previous.

    AuditEventPage:
      type: object
      additionalProperties: false
      required: [events, next_before]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_before:
          type: [integer, 'null']
          format: int64
          description: Pass as `before` for the next page; null when this was the last.

    AuditKindList:
      type: object
      additionalProperties: false
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, label_en, label_bn]
            properties:
              kind: { type: string }
              label_en: { type: string }
              label_bn: { type: string }

    ChainVerification:
      type: object
      additionalProperties: false
      required: [ok, checked, head_seq, broken_at, problem, strays]
      properties:
        ok:
          type: boolean
        checked:
          type: integer
          format: int64
        head_seq:
          type: integer
          format: int64
        broken_at:
          type: [integer, 'null']
          format: int64
          description: The first row that did not verify, when `ok` is false.
        problem:
          type: string
        strays:
          type: integer
          format: int64
          description: Rows in the default partition — zero unless monthly partitions were not created.

    SigningKey:
      type: object
      additionalProperties: false
      required: [key_id, algorithm, public_key]
      properties:
        key_id: { type: string }
        algorithm:
          type: string
          enum: [ed25519-sha256]
        public_key:
          type: string
          description: Base64 Ed25519 public key.

    AdminAlert:
      type: object
      additionalProperties: false
      required: [id, kind, severity, message_en, message_bn, reference, audit_seq, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        severity:
          type: string
          enum: [high, normal]
        message_en: { type: string }
        message_bn: { type: string }
        reference:
          type: object
          additionalProperties: true
        audit_seq:
          type: [integer, 'null']
          format: int64
        created_at:
          type: string
          format: date-time

    AdminAlertList:
      type: object
      additionalProperties: false
      required: [alerts]
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AdminAlert'

    BreakGlassRequest:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_ref, justification]
      properties:
        scope_kind:
          type: string
          enum: [patient, other]
        scope_ref:
          type: string
          description: The patient id, or what else is being reached.
        justification:
          type: string
          minLength: 20
        hours:
          type: integer
          minimum: 1
          maximum: 24
          description: How long; default four hours.

    BreakGlassAccess:
      type: object
      additionalProperties: false
      required:
        [
          id,
          user_id,
          active_role,
          scope_kind,
          scope_ref,
          justification,
          granted_at,
          expires_at,
          ended_at,
          end_reason,
          acknowledged_at,
          audit_seq,
        ]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        active_role: { type: string }
        scope_kind: { type: string }
        scope_ref: { type: string }
        justification: { type: string }
        granted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at:
          type: [string, 'null']
          format: date-time
        end_reason: { type: string }
        acknowledged_at:
          type: [string, 'null']
          format: date-time
        audit_seq:
          type: [integer, 'null']
          format: int64

    BreakGlassList:
      type: object
      additionalProperties: false
      required: [accesses]
      properties:
        accesses:
          type: array
          items:
            $ref: '#/components/schemas/BreakGlassAccess'

    RoleCatalogue:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'

    RoleDefinition:
      type: object
      additionalProperties: false
      required: [code, name_en, name_bn, is_clinical, station, permissions]
      properties:
        code:
          type: string
        name_en:
          type: string
        name_bn:
          type: string
        is_clinical:
          type: boolean
        station:
          type: string
          description: The role's station code, or empty.
        permissions:
          type: array
          items:
            type: string

    InviteRequest:
      type: object
      additionalProperties: false
      required: [employee_code, name_en, name_bn, roles]
      properties:
        employee_code:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{1,15}$'
        name_en:
          type: string
        name_bn:
          type: string
        phone:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Set in person. Omit to leave the account invited.

    StatusChangeRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, deactivated]
        reason:
          type: string

    GrantRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string

    PasswordRequest:
      type: object
      additionalProperties: false
      required: [password, reason]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
        reason:
          type: string
          minLength: 3

    SessionsEnded:
      type: object
      additionalProperties: false
      required: [sessions_ended]
      properties:
        sessions_ended:
          type: integer
          minimum: 0

    Device:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          kind,
          status,
          enrolled_at,
          model,
          os_version,
          app_version,
          last_seen_at,
          status_changed_at,
          status_reason,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: What the clinic calls it. Unique within the facility.
        kind:
          type: string
          enum: [tablet, phone, desktop]
        status:
          type: string
          enum: [pending, active, suspended, revoked, lost]
          description: |
            `pending` → `active` → (`suspended` ↔ `active`) → `revoked` | `lost`. The last
            two are terminal.
        enrolled_at:
          type: [string, 'null']
          format: date-time
        model:
          type: string
          description: What the device said about itself. Display only.
        os_version:
          type: string
        app_version:
          type: string
          description: Kept current by every signed request.
        last_seen_at:
          type: [string, 'null']
          format: date-time
        status_changed_at:
          type: string
          format: date-time
        status_reason:
          type: string
        created_at:
          type: string
          format: date-time

    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    DeviceIssueRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        kind:
          type: string
          enum: [tablet, phone, desktop]

    DeviceEnrolmentIssued:
      type: object
      additionalProperties: false
      required: [device, code, expires_at]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        code:
          type: string
          description: |
            The one-time enrolment code, `XXXXX-XXXXX`, shown here and never again. Case,
            spaces and dashes are forgiven when it is typed.
          example: K7Q2M-9XWRD
        expires_at:
          type: string
          format: date-time

    DeviceEnrolRequest:
      type: object
      additionalProperties: false
      required: [code, public_key]
      properties:
        code:
          type: string
        public_key:
          type: string
          description: The device's new Ed25519 public key — 32 bytes, standard base64.
        model:
          type: string
          maxLength: 80
        os_version:
          type: string
          maxLength: 40
        app_version:
          type: string
          maxLength: 40

    DeviceEnrolResponse:
      type: object
      additionalProperties: false
      required: [device, key_id]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        key_id:
          type: string
          format: uuid

    DeviceRotateKeyRequest:
      type: object
      additionalProperties: false
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The replacement Ed25519 public key, 32 bytes, standard base64.

    DeviceKeyResponse:
      type: object
      additionalProperties: false
      required: [key_id]
      properties:
        key_id:
          type: string
          format: uuid

    DeviceEvent:
      type: object
      additionalProperties: false
      required: [kind, actor_id, detail, at]
      properties:
        kind:
          type: string
          enum:
            [
              enrolment_issued,
              enrolment_failed,
              enrolled,
              key_rotated,
              suspended,
              reinstated,
              revoked,
              lost,
              signature_refused,
              session_bound,
            ]
        actor_id:
          type: [string, 'null']
          format: uuid
        detail:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time

    DeviceEventList:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/DeviceEvent'

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          description: |
            The stored refresh token, for the `bearer` transport. A browser omits the body
            entirely; its credential is the cookie.

    CurrentUser:
      type: object
      additionalProperties: false
      required:
        [id, employee_code, name_en, name_bn, status, roles, permissions, grants, second_factor]
      properties:
        id:
          type: string
          format: uuid
        employee_code:
          type: string
          example: JD_04
        name_en:
          type: string
          example: Amlan Roy
        name_bn:
          type: string
          example: অমলান রায়
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
          description: |
            Only `active` can reach this endpoint — the others cannot hold a live session —
            but the field is present so a client never has to infer it.
        roles:
          type: array
          items:
            type: string
            example: JUNIOR_DOCTOR
          description: |
            Role codes, not names. One person may hold several at once [R-02]: the same
            assistant enters a blood pressure and then switches to anthropometry.
        permissions:
          type: array
          items:
            type: string
            example: observation.write.vitals
          description: |
            The union across every live role, as `resource.action.scope`.

            For hiding what the operator cannot do. **Not a control** — every route,
            service and serialiser is guarded server-side by the same catalogue (CP20).
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
          description: |
            Which role confers which permissions, one entry per live role. An interface
            that scopes itself to one role [R-02] reads this entry's permissions and sends
            the role as `X-Active-Role`, so what it shows is what the server will allow.

        second_factor:
          $ref: '#/components/schemas/SecondFactorStatus'

    RoleGrant:
      type: object
      additionalProperties: false
      required: [role, permissions]
      properties:
        role:
          type: string
          example: PHYSICIAN
        permissions:
          type: array
          items:
            type: string

    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, user_agent, issued_at, last_seen_at, current]
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
          description: |
            Enough for a person to recognise a device. Truncated, and deliberately not an
            address.
        issued_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: |
            Written at most once a minute. Every authenticated request updating a row would
            make a read-mostly path the busiest write in the clinic.
        current:
          type: boolean
          description: |
            True for the session making this request, so the screen can say "this device"
            rather than inviting somebody to end the one they are reading it on.

    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'

    LogoutEverywhereResponse:
      type: object
      additionalProperties: false
      required: [ended]
      properties:
        ended:
          type: integer
          minimum: 0
          description: The number of sessions revoked, including the one that asked.

    LivenessResponse:
      type: object
      title: LivenessResponse
      required: [status, service, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: Which binary answered. One of api, worker, realtime, migrate.
          examples: [api]
        version:
          type: string
          examples: [0.1.0-dev]

    ReadinessResponse:
      type: object
      title: ReadinessResponse
      required: [status, service, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unready]
        service:
          type: string
          examples: [api]
        version:
          type: string
          examples: [0.1.0-dev]
        checks:
          type: object
          description: |
            One entry per declared dependency. A status word only — never the underlying
            error, which may carry a host, a user name or a password.
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          examples:
            - postgres: ok
              redis: ok
              blobstore: unavailable

    VersionResponse:
      type: object
      title: VersionResponse
      required: [service, version, commit, build_time]
      additionalProperties: false
      properties:
        service:
          type: string
          examples: [api]
        version:
          type: string
          examples: [0.1.0]
        commit:
          type: string
          description: The git commit this binary was built from, or `unknown` locally.
        build_time:
          type: string
          description: RFC 3339 build timestamp, or `unknown` locally.

  responses:
    BadRequest:
      description: The request could not be understood. `BAD_REQUEST`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              kind: validation
              message: The request could not be understood.
              message_bn: অনুরোধটি বোঝা যায়নি।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Unauthenticated:
      description: No valid session. `UNAUTHENTICATED`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              kind: auth
              message: Please sign in again.
              message_bn: অনুগ্রহ করে আবার সাইন ইন করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Forbidden:
      description: |
        The caller may not do this. `FORBIDDEN`.

        Deliberately **identical whether the resource is missing or merely forbidden**.
        Telling a caller that a patient exists but is out of reach is itself a
        disclosure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              kind: auth
              message: You do not have permission to do that.
              message_bn: এই কাজটি করার অনুমতি আপনার নেই।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    StepUpRequired:
      description: |
        The caller may do this, but must first confirm their second factor. `STEP_UP_REQUIRED`.

        Distinct from `FORBIDDEN` on purpose: the right response is to ask for a code, not to
        say no. Mint a token at `/v1/auth/step-up` for this endpoint's purpose and retry with
        `X-Step-Up-Token`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: STEP_UP_REQUIRED
              kind: auth
              message: Please confirm with your authenticator code to continue.
              message_bn: চালিয়ে যেতে আপনার অথেন্টিকেটর কোড দিয়ে নিশ্চিত করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    DeviceRequired:
      description: |
        The caller is signed in but this request did not come from an enrolled clinic
        device, and the action needs one. `DEVICE_REQUIRED`.

        Distinct from `FORBIDDEN`: the person may do this — from a tablet. A browser session
        gets this on every clinical write (D-46).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: DEVICE_REQUIRED
              kind: auth
              message: This action must be done from an enrolled clinic device.
              message_bn: এই কাজটি ক্লিনিকের নিবন্ধিত ডিভাইস থেকে করতে হবে।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    NotFound:
      description: No such resource, or none the caller may see. `NOT_FOUND`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              kind: not_found
              message: Not found.
              message_bn: পাওয়া যায়নি।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Conflict:
      description: |
        The request contradicts current state. `CONFLICT`.

        Also returned when an `Idempotency-Key` is reused with a different body.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              kind: conflict
              message: This conflicts with a change someone else made.
              message_bn: অন্য কেউ পরিবর্তন করায় দ্বন্দ্ব তৈরি হয়েছে।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    PayloadTooLarge:
      description: The request body exceeds the configured limit. `PAYLOAD_TOO_LARGE`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              kind: validation
              message: The request is too large.
              message_bn: অনুরোধটি অনেক বড়।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    ValidationFailed:
      description: |
        One or more values failed a rule. `VALIDATION_FAILED`, with `fields` naming
        each one.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              kind: validation
              message: Some values need correcting.
              message_bn: কিছু তথ্য সংশোধন করতে হবে।
              fields:
                date_of_birth: A date of birth cannot be in the future.
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    RateLimited:
      description: Too many requests. `RATE_LIMITED`. Implemented at CP49.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              kind: validation
              message: Too many requests. Please slow down.
              message_bn: অনেক বেশি অনুরোধ। একটু ধীরে চেষ্টা করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Internal:
      description: |
        The system failed. `INTERNAL`. The cause is logged against the correlation ID
        and never returned.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL
              kind: technical
              message: Something went wrong. The team has been notified.
              message_bn: কিছু একটা সমস্যা হয়েছে। বিষয়টি জানানো হয়েছে।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Unavailable:
      description: Temporarily unable to serve. `UNAVAILABLE`. Retryable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAVAILABLE
              kind: technical
              message: The service is temporarily unavailable. Please try again.
              message_bn: সেবাটি সাময়িকভাবে বন্ধ আছে। আবার চেষ্টা করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Timeout:
      description: The request took too long. `TIMEOUT`. Retryable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TIMEOUT
              kind: technical
              message: The request took too long. Please try again.
              message_bn: অনুরোধটি সম্পন্ন হতে বেশি সময় নিচ্ছে। আবার চেষ্টা করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d
