          in: path
          required: true
          schema: { type: string, pattern: '^STN_[A-Z_]+$' }
      description: |
        Needs `visit.read`. The live queue in the order it will be called: priority first,
        then arrival.
      responses:
        '200':
          description: The queue.
          content:
            application/json:
              schema:
                type: object
                required: [station_code, entries]
                properties:
                  station_code: { type: string }
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueEntry'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
