        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}:
    patch:
      operationId: correctPatient
      tags: [Patients]
      summary: Correct a demographic value
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/StepUpToken'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `patient.write.demographics`.

        **Never an overwrite.** A correction is an event carrying what the value was, what it
        is now, and why; the original stays in the ledger and is retrievable forever. Send
        only the fields being changed — a field absent from the body is one the operator is
        not touching, and a form that submits everything it rendered would otherwise make
        "what did they actually alter" unanswerable.

        **A high-impact field also needs a step-up.** The date of birth, its precision, the
        sex and the English name are values other things were computed from: a wrong date of
        birth changes every pediatric percentile ever produced for that patient, and those
        numbers have already been read and acted on. Send `X-Step-Up-Token` when changing one;
        a `403` with `STEP_UP_REQUIRED` is the server asking for it.

        The response's `invalidated` says what the correction affected, read from a register
        of which derived values depend on which fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientCorrectionRequest'
      responses:
        '200':
          description: Corrected.
          content:
            application/json:
              schema:
                type: object
                required: [patient, changes, high_impact, invalidated, event_id]
                properties:
                  patient:
                    $ref: '#/components/schemas/Patient'
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/FieldChange'
                  high_impact: { type: boolean }
                  invalidated:
                    type: array
                    items:
                      $ref: '#/components/schemas/DerivedDependency'
                  event_id: { type: string, format: uuid }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    get:
      operationId: getPatient
      tags: [Patients]
      summary: One patient
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `patient.read.demographics`. Scoped to the caller's facility.

        A patient at another facility, an unknown id and a malformed id all return the same
        `404`: an answer that distinguishes them is a way to learn which patients exist.

        Identity numbers come back masked. Revealing one in full is a separate, step-upped
        act with its own audit entry.
      responses:
        '200':
          description: The patient.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                required: [patient]
                properties:
                  patient:
                    $ref: '#/components/schemas/Patient'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

