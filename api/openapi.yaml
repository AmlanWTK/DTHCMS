  /v1/patients/{id}/consents/evidence-url:
    post:
      operationId: consentEvidenceUploadURL
      tags: [Consent]
      summary: Where to put the signature
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `patient.consent.record`. A pre-signed `PUT`, valid ten minutes, for the
        signature or thumbprint image. PNG only: a signature is line art, and JPEG artefacts
        around thin strokes are exactly what makes one arguable.

        The key is the server's. One a client could choose is one that could be pointed at
        somebody else's signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_type]
              properties:
                content_type: { type: string, enum: [image/png] }
      responses:
        '200':
          description: Upload here, then send the key back with the consent.
          content:
            application/json:
              schema:
                type: object
                required: [object_key, upload_url, expires_at]
                properties:
                  object_key: { type: string }
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
