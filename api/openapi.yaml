        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `visit.close`. Records §11.1's memory: the chief complaint, the diagnoses, the
        plan and the **next review interval in days** — a number rather than "in three months"
