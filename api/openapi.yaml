      description: |
        Needs `visit.read`. The visit, every station touch in order, and two numbers: how long
        the patient has been in the building, and how much of that was not at any station —
        which is what a patient experiences as waiting.

        Both are computed on read rather than stored, because both change while the visit is
        open and a stored total is a total that is wrong between updates.
      responses:
