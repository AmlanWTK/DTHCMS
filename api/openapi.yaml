  /healthz:
    get:
      operationId: getLiveness
      tags: [Operations]
      summary: Is the process alive?
      description: |
        Answers one question: is this process running and able to serve HTTP?

        It deliberately **never touches a dependency**. A failing database must not
        cause the orchestrator to kill and restart a perfectly healthy process — that
        turns one outage into two, and the restarted process fails exactly the same way.
        Dependency health is `/readyz`.
      security: []
      responses:
        '200':
          description: The process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
              examples:
                alive:
                  summary: A healthy process
                  value:
                    status: ok
                    service: api
                    version: 0.1.0-dev

  /readyz:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Can it serve requests?
      description: |
        Checks every declared dependency in parallel and reports which one is unhappy.

        Dependency failures are reported as a **status word, never as the underlying
        error text**: a connection error can contain a host, a user name or a password.
        The detail goes to the log, where it is access-controlled.

        A critical dependency being unavailable makes the service unready (503). A
        non-critical one degrades it but still reports 200 — the blob store being down
        stops document upload, not the clinic.
      security: []
      responses:
        '200':
          description: Ready to serve. Every critical dependency answered.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                ready:
                  summary: Everything answering
                  value:
                    status: ok
                    service: api
                    version: 0.1.0-dev
                    checks:
                      postgres: ok
                      redis: ok
                      blobstore: ok
                degraded:
                  summary: A non-critical dependency is down — still ready
                  description: |
                    The blob store is not critical: document upload fails, the clinic
                    keeps running. Reporting this as unready would take the whole
                    service out for a feature most of a session never touches.
                  value:
                    status: ok
                    service: api
                    version: 0.1.0-dev
                    checks:
                      postgres: ok
                      redis: ok
                      blobstore: unavailable
        '503':
          description: |
            Not ready. At least one **critical** dependency did not answer. The response
            body names which, so the on-call engineer does not have to guess.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                unready:
                  summary: The database is unreachable
                  value:
                    status: unready
                    service: api
                    version: 0.1.0-dev
                    checks:
                      postgres: unavailable
                      redis: ok
                      blobstore: ok

  /version:
    get:
      operationId: getVersion
      tags: [Operations]
      summary: What exactly is running?
      description: |
        The build identity of the running binary: version, commit and build time.

        This is the first question in any incident, and the one that is hardest to
        answer from outside. Values are injected at build time through `ldflags`; a
        development build reports `0.1.0-dev` with `unknown` for commit and build time,
        which is itself the answer to "is this a real build?"
      security: []
      responses:
        '200':
          description: Build information for this binary.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
              examples:
                release:
                  summary: A CI-built binary
                  value:
                    service: api
                    version: 0.1.0
                    commit: 4f2c1a9e8b3d5f7a1c2e4b6d8f0a2c4e6b8d0f2a
                    build_time: '2026-08-24T06:43:00Z'
                development:
                  summary: A local build
                  value:
                    service: api
                    version: 0.1.0-dev
                    commit: unknown
                    build_time: unknown

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: |
        The staff access token, sent as `Authorization: Bearer <token>`.

        Opaque: 32 bytes of randomness, not a signed claim set. The server stores only its
        SHA-256 digest and looks that up on every request (ADR-0011) — which is what makes
        "a revoked session stops working within one request" true rather than aspirational,
        and what keeps a leak of the session table from yielding anything presentable.

        There is nothing to decode. A client that wants to know who it is, or what it may
        do, asks `/v1/auth/me`; a client that reads a token is reading a random string.

    sessionCookie:
      type: apiKey
      in: cookie
      name: dthcms.session
      description: |
        The same access token as `sessionToken`, in an httpOnly cookie on every path — the
        browser's transport. Set by `/v1/auth/login` and `/v1/auth/refresh`, cleared by
        `/v1/auth/logout` and `/v1/auth/logout-all`, and expiring with the token.

        Per ADR-0010 the web application holds no credential of its own: a token JavaScript
        can read is a token a cross-site scripting hole can take away. A cookie the browser
        attaches by itself is attached to requests the user did not intend, which is why every
        state-changing request also needs `X-Requested-With: DTHCMS` (see `RequestedWith`).

        When both the header and the cookie are present the header wins.

    refreshCookie:
      type: apiKey
      in: cookie
      name: dthcms.refresh
      description: |
        The refresh credential, in an httpOnly cookie scoped to `/v1/auth`.

        A cookie rather than a value in the response body, per ADR-0010: a credential in
        `localStorage` turns one cross-site scripting hole into stolen credentials that keep
        working from the attacker's own machine. This application renders patient names,
        free-text notes and OCR output from photographs of paper the clinic did not write —
        which is to say, text from outside.

        It is the only credential the browser attaches on its own, and it is scoped to the
        two endpoints that have any use for it. Everything that touches data carries its
        access token explicitly.

  headers:
    XRequestID:
      description: |
        The correlation ID for this request, echoed on **every** response including
        errors. A station operator reporting a problem can read it down the phone, and
        it ties together every log line, span and background job belonging to the one
        interaction.

        A client may supply its own on the way in (up to 64 characters); the server
        generates a UUIDv7 when it does not.
      schema:
        type: string
        maxLength: 64
      example: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Deprecation:
      description: |
        Present when the endpoint is deprecated. Carries the RFC 9745 date after which
        it may stop working. The endpoint keeps functioning until the API version is
        retired — a station tablet running a three-week-old build must not break because
        a deprecation landed on the server.
      schema:
        type: string
      example: '@1793404800'

    IdempotencyReplayed:
      description: |
        `true` when this response was replayed from the store rather than produced by
        running the handler again — the request carried an `Idempotency-Key` the server
        had already answered. Absent otherwise.
      schema:
        type: string
        const: 'true'
      example: 'true'

    RetryAfter:
      description: Seconds to wait before retrying. Present on 429 and, where known, 503.
      schema:
        type: integer
        minimum: 0
      example: 30

  parameters:
    RequestedWith:
      name: X-Requested-With
      in: header
      required: true
      description: |
        The cross-site request forgery guard. Must be exactly `DTHCMS` on every request that
        changes state, from every client. A request without it is refused with 403 before
        anything else is examined — including sign-in, since signing a victim into an
        attacker's account is also an attack.
      schema:
        type: string
        const: DTHCMS

    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: true
      description: |
        A step-up token from `/v1/auth/step-up`, minted for this endpoint's purpose. Consumed
        by the request it authorises. Absent, expired, spent, or for another purpose or
        session: `403` with code `STEP_UP_REQUIRED`.
      schema:
        type: string

    ActiveRole:
      name: X-Active-Role
      in: header
      required: false
      description: |
        The role the caller is acting as for this request — the hat being worn [R-02].
        One of the role codes `/v1/auth/me` lists; a code the caller does not hold is
        refused. Absent, every held role applies together, and so does every rule that
        binds any of them (`docs/access-model.md` §4). The web application sends the role
        chosen in the switcher on every request.
      schema:
        type: string

    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: The enrolled device's id. Part of the signed string.
      schema:
        type: string
        format: uuid

    DeviceTimestamp:
      name: X-Device-Timestamp
      in: header
      required: true
      description: |
        Seconds since the epoch by the device's clock. Must be within five minutes of the
        server's, or the request is refused before the signature is examined.
      schema:
        type: integer
        format: int64

    DeviceNonce:
      name: X-Device-Nonce
      in: header
      required: true
      description: |
        Sixteen random bytes, base64url without padding, fresh per request. Remembered for
        ten minutes; a repeat is refused as a replay.
      schema:
        type: string

    DeviceSignature:
      name: X-Device-Signature
      in: header
      required: true
      description: |
        Ed25519 over `METHOD\npath\ntimestamp\nnonce\nhex(sha256(body))\ndevice-id`,
        standard base64. `docs/identity.md` §9 has the scheme and the test vector shared
        with the station app.
      schema:
        type: string

    UserIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    DeviceIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor from the previous page's `page.next_cursor`. Omit for the first
        page. The value is not parseable by clients and its encoding is not part of the
        contract — treat it as a token to hand back.
      schema:
        type: string
        maxLength: 512
      example: eyJhZnRlciI6IjAxOThjNGUyIn0

    Limit:
      name: limit
      in: query
      required: false
      description: |
        Maximum items to return. The server may return fewer — never assume a short page
        means the end; `page.has_more` is the only reliable signal.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    UpdatedSince:
      name: updated_since
      in: query
      required: false
      description: |
        Return only records changed at or after this instant. The standard filter for a
        station application catching up after a period offline.
      schema:
        type: string
        format: date-time
      example: '2026-08-24T06:00:00Z'

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A client-generated UUIDv7 identifying **one attempt** at this request, so that a
        retry is answered with the original response instead of performing the write a
        second time (CP24, blueprint §7.5 layer 2).

        Required on **every** state-changing request inside the authenticated surface. A
        clinic's connection drops mid-save routinely, and the station application queues
        writes offline and replays them on reconnect. Without this header, one recorded
        blood-pressure reading becomes two rows in an append-only ledger — which, the
        ledger being append-only, is not something anybody can quietly tidy up afterwards.

        **The contract.** Generate the key when the operator commits the action, and send
        that same key on every retry of that attempt — across a timeout, an app restart, a
        morning offline. A *new* action gets a *new* key: correcting a value is not a
        retry. The key travels with the queued write rather than being assigned on
        arrival, which is what makes an offline replay safe.

        - Same key, same request: the stored response, byte for byte, with
          `Idempotency-Replayed: true`.
        - Same key, still running: `409` `IDEMPOTENCY_IN_PROGRESS`. Wait and retry.
        - Same key, **different** request: `409` `IDEMPOTENCY_KEY_REUSED`. A client bug;
          answering it with the first request's response would be worse than refusing.

        Responses are kept for 24 hours. `401`, `403`, `429` and `5xx` are never stored:
        they describe the moment, not the outcome, and a client that retries after
        refreshing its token must not meet a cached refusal.

        Sign-in and refresh (`/v1/auth/…`) do not take a key. They sit outside the
        authenticated chain, and there is no caller yet to scope one to.
      schema:
        type: string
        format: uuid
        minLength: 8
        maxLength: 200
      example: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    RequestID:
      name: X-Request-ID
      in: header
      required: false
      description: |
        A client-supplied correlation ID. Echoed back on the response. The server
        generates one when this is absent or longer than 64 characters.
      schema:
        type: string
        maxLength: 64

  schemas:
    Error:
      type: object
      title: Error
      description: |
        The one shape an error takes on the wire. Every non-2xx response is this
        envelope — there is no second error format anywhere in the API.
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      title: ErrorBody
      required: [code, kind, message, message_bn]
      additionalProperties: false
      properties:
        code:
          type: string
          description: |
            Stable, machine-readable, and the **only** thing a client may branch on.
            Message text is written for humans and will be reworded; codes will not.
          pattern: '^[A-Z][A-Z0-9_]*$'
          examples: [VALIDATION_FAILED, NOT_FOUND, RATE_LIMITED]
        kind:
          $ref: '#/components/schemas/ErrorKind'
        message:
          type: string
          description: |
            English, shown to the user. Never contains internal detail — no query text,
            no file path, and no indication of whether a resource the caller may not see
            happens to exist.
        message_bn:
          type: string
          description: |
            Bangla, shown to the user. Always present, never a fallback to English:
            half the clinic's staff work in Bangla, and an error is exactly the moment
            a person needs their own language.
        fields:
          type: object
          description: |
            Per-field validation messages, keyed by field name. Present on
            `VALIDATION_FAILED`, absent otherwise.
          additionalProperties:
            type: string
          examples:
            - date_of_birth: A date of birth cannot be in the future.
        fields_bn:
          type: object
          description: |
            The same per-field messages in Bangla, under the same keys. Present wherever a
            clinic operator — rather than an administrator at a console — can trigger the
            error, which is everything a registration desk or a clinical station touches.

            A parallel object rather than a nested one per field because `fields` was already
            published and consumed; a client that reads only `fields` keeps working.
          additionalProperties:
            type: string
          examples:
            - date_of_birth: জন্ম তারিখ ভবিষ্যতের হতে পারে না।
        correlation_id:
          type: string
          description: |
            The request's correlation ID, repeated in the body so it survives being
            screenshotted — which is how errors are actually reported from a clinic.
          maxLength: 64
      examples:
        - code: VALIDATION_FAILED
          kind: validation
          message: Some values need correcting.
          message_bn: কিছু তথ্য সংশোধন করতে হবে।
          fields:
            date_of_birth: A date of birth cannot be in the future.
          fields_bn:
            date_of_birth: জন্ম তারিখ ভবিষ্যতের হতে পারে না।
          correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    ErrorKind:
      type: string
      title: ErrorKind
      description: |
        What sort of error this is, and therefore how the interface should respond.

        The distinction is not cosmetic. A blocked safety rule needs an override path
        with a recorded reason; a database timeout needs a retry button. An interface
        that shows the same red box for both teaches staff to dismiss both.
      enum:
        - validation
        - auth
        - not_found
        - conflict
        - clinical
        - technical
      x-kind-meanings:
        validation: The request was malformed or failed a rule. The user can fix it.
        auth: Not authenticated, or not permitted. Never reveals which.
        not_found: The resource does not exist, or the caller may not know that it does.
        conflict: The request contradicts current state.
        clinical: A clinical rule blocked the action. May permit a recorded override.
        technical: The system failed. Not the user's fault, and retryable.

    PageInfo:
      type: object
      title: PageInfo
      description: |
        Cursor pagination. A list response is `{ "items": [...], "page": PageInfo }`.

        Cursors rather than page numbers because clinical lists change underneath the
        person reading them. A queue gains a patient while an operator is on page two;
        with offset pagination that shifts every subsequent row, so the operator sees
        one patient twice and never sees another at all. A cursor is a position in the
        data, not a count of rows skipped, so an insertion above it changes nothing.

        The cost is that there is no "jump to page 7" and no total count. Neither is
        something a station operator has ever needed; both are things a paging bug
        would happily provide.
      required: [has_more]
      additionalProperties: false
      properties:
        next_cursor:
          type: [string, 'null']
          description: |
            Pass as `cursor` to fetch the next page. `null` on the last page.
          maxLength: 512
        has_more:
          type: boolean
          description: |
            Whether another page exists. **The only reliable end-of-list signal** — a
            page shorter than `limit` does not mean the end.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [employee_code, password]
      properties:
        employee_code:
          type: string
          minLength: 2
          maxLength: 16
          pattern: '^[A-Z][A-Z0-9_-]{1,15}$'
          description: |
            The short identifier printed on the roster and spoken across the clinic floor.
            Unique within a facility, not globally.
          example: JD_04
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
          description: |
            Verified with argon2id. The upper bound is not a statement about password
            strength; it stops a caller spending the server's memory by submitting a
            megabyte.
        transport:
          type: string
          enum: [cookie, bearer]
          default: cookie
          description: |
            How the credentials should be delivered.

            `cookie` — the browser. Both tokens are set as httpOnly cookies and the body
            carries the access token only for the station app's benefit; a browser has no
            use for it and does not keep it (ADR-0010).

            `bearer` — the station app. Both tokens come back in the body and **no cookies
            are set**: the app keeps the refresh token in the device Keystore and the access
            token in memory, and a cookie jar it does not control would re-send a
            rotated-away token and trip the reuse detector.

    SessionResponse:
      type: object
      additionalProperties: false
      required: [access_token, expires_at, user]
      properties:
        access_token:
          type: string
          description: |
            Send as `Authorization: Bearer <token>`. Opaque — there is nothing to decode, and
            a client that tries is reading a random string.

            Keep it in memory. Not `localStorage`, not `sessionStorage`, not a cookie set by
            script (ADR-0010); an ESLint rule fails the web build on any of those.
          example: 8Kx2mQ7vN4pR1sT6wY9zA3bC5dE0fG8hJ2kL4mN6pQ8
        expires_at:
          type: string
          format: date-time
          description: |
            Fifteen minutes out. Refresh before it passes rather than waiting for a 401 — the
            refresh cookie is already in the browser.
        user:
          $ref: '#/components/schemas/CurrentUser'
        refresh_token:
          type: string
          description: |
            Present only for the `bearer` transport. Store it in secure storage, never in
            a preference store, and send it in the body of `/v1/auth/refresh`. Each use
            returns a replacement; the old one is spent, and presenting it again revokes the
            session and everything descended from it.
        refresh_expires_at:
          type: string
          format: date-time
          description: |
            Present only for the `bearer` transport. Fourteen days from sign-in, and not
            extended by refreshing — a session in daily use still ends when this passes.

    SecondFactorStatus:
      type: object
      additionalProperties: false
      required: [required, enrolled, pending, recovery_codes_left]
      properties:
        required:
          type: boolean
          description: One of the person's roles mandates a second factor (D-45).
        enrolled:
          type: boolean
          description: A seed is confirmed and not disabled. Sign-in asks for a code.
        pending:
          type: boolean
          description: A seed exists but the app has not yet proved it has it.
        recovery_codes_left:
          type: integer
          minimum: 0
        confirmed_at:
          type: string
          format: date-time

    ChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge, expires_at]
      properties:
        challenge:
          type: string
          description: Opaque. Goes back with the code. Says nothing about the account.
        expires_at:
          type: string
          format: date-time

    SecondFactorLoginRequest:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge:
          type: string
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
          description: Six digits from the authenticator app. Either this or `recovery_code`.
        recovery_code:
          type: string
          minLength: 16
          maxLength: 24
          description: |
            A recovery code, as printed (`XXXX-XXXX-XXXX-XXXX`). Case and dashes are forgiven.
            Works once.
        transport:
          type: string
          enum: [cookie, bearer]
          default: cookie

    EnrolmentResponse:
      type: object
      additionalProperties: false
      required: [secret, otpauth_uri]
      properties:
        secret:
          type: string
          description: The seed, base32, for typing into an app by hand. Show once; keep nowhere.
        otpauth_uri:
          type: string
          description: The same seed as an `otpauth://totp/...` URI, for a QR code.

    CodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'

    RecoveryCodesResponse:
      type: object
      additionalProperties: false
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            example: K7QM-3XZP-A9BD-2NWE
          description: Shown once. Each works once. Store them as you would a key.

    DisableRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200
          description: Optional. Recorded in the security event.

    StepUpRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose:
          type: string
          enum:
            - second_factor.disable
            - second_factor.recovery_codes
            - prescription.sign
            - rbac.change
            - research.export
            - clinical.override
            - user.manage
            - credential.reset
            - break_glass
            - patient_merge
            - patient_correct_identity
            - counseling.publish
          description: What the token will be good for, and nothing else.
        code:
          type: string
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
        recovery_code:
          type: string
          minLength: 16
          maxLength: 24

    StepUpResponse:
      type: object
      additionalProperties: false
      required: [step_up_token, purpose, expires_at]
      properties:
        step_up_token:
          type: string
          description: Send as `X-Step-Up-Token`. One session, one purpose, one use, five minutes.
        purpose:
          type: string
        expires_at:
          type: string
          format: date-time

    AdminUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          employee_code,
          name_en,
          name_bn,
          phone,
          email,
          status,
          status_reason,
          status_since,
          last_login_at,
          roles,
          permissions,
          second_factor,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        employee_code:
          type: string
        name_en:
          type: string
        name_bn:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
        status_reason:
          type: string
        status_since:
          type: string
          format: date-time
        last_login_at:
          type: [string, 'null']
          format: date-time
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
          description: The union across live roles — the effective-permission preview.
        second_factor:
          $ref: '#/components/schemas/SecondFactorStatus'
        created_at:
          type: string
          format: date-time

    AdminAccount:
      allOf:
        - $ref: '#/components/schemas/AdminUser'
        - type: object
          required: [sessions, grant_history]
          properties:
            sessions:
              type: array
              items:
                $ref: '#/components/schemas/SessionSummary'
            grant_history:
              type: array
              items:
                $ref: '#/components/schemas/GrantHistoryEntry'

    GrantHistoryEntry:
      type: object
      additionalProperties: false
      required: [role, granted_at, granted_by, revoked_at, revoked_by, revoke_reason]
      properties:
        role:
          type: string
        granted_at:
          type: string
          format: date-time
        granted_by:
          type: [string, 'null']
          format: uuid
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoked_by:
          type: [string, 'null']
          format: uuid
        revoke_reason:
          type: string

    AdminUserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'

    AuditSubject:
      type: object
      additionalProperties: false
      required: [id, code]
      properties:
        id:
          type: [string, 'null']
          format: uuid
        code:
          type: string
          description: Employee code as it was at the time; empty for an unknown account.

    AuditEvent:
      type: object
      additionalProperties: false
      required:
        [
          seq,
          kind,
          label_en,
          label_bn,
          recorded_at,
          actor,
          actor_role,
          target,
          patient_id,
          device_id,
          reason,
          details,
          sentence_en,
          sentence_bn,
          hash,
        ]
      properties:
        seq:
          type: integer
          format: int64
        kind:
          type: string
        label_en:
          type: string
        label_bn:
          type: string
        recorded_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditSubject'
        actor_role:
          type: string
        target:
          oneOf:
            - $ref: '#/components/schemas/AuditSubject'
            - type: 'null'
        patient_id:
          type: [string, 'null']
          format: uuid
        device_id:
          type: [string, 'null']
          format: uuid
        reason:
          type: string
        details:
          type: object
          additionalProperties: true
        sentence_en:
          type: string
          description: The human sentence, English.
        sentence_bn:
          type: string
          description: The human sentence, Bengali.
        hash:
          type: string
          description: Hex SHA-256 of this row, chained to the previous.

    AuditEventPage:
      type: object
      additionalProperties: false
      required: [events, next_before]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_before:
          type: [integer, 'null']
          format: int64
          description: Pass as `before` for the next page; null when this was the last.

    AuditKindList:
      type: object
      additionalProperties: false
      required: [kinds]
      properties:
        kinds:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, label_en, label_bn]
            properties:
              kind: { type: string }
              label_en: { type: string }
              label_bn: { type: string }

    ChainVerification:
      type: object
      additionalProperties: false
      required: [ok, checked, head_seq, broken_at, problem, strays]
      properties:
        ok:
          type: boolean
        checked:
          type: integer
          format: int64
        head_seq:
          type: integer
          format: int64
        broken_at:
          type: [integer, 'null']
          format: int64
          description: The first row that did not verify, when `ok` is false.
        problem:
          type: string
        strays:
          type: integer
          format: int64
          description: Rows in the default partition — zero unless monthly partitions were not created.

    SigningKey:
      type: object
      additionalProperties: false
      required: [key_id, algorithm, public_key]
      properties:
        key_id: { type: string }
        algorithm:
          type: string
          enum: [ed25519-sha256]
        public_key:
          type: string
          description: Base64 Ed25519 public key.

    AdminAlert:
      type: object
      additionalProperties: false
      required: [id, kind, severity, message_en, message_bn, reference, audit_seq, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        severity:
          type: string
          enum: [high, normal]
        message_en: { type: string }
        message_bn: { type: string }
        reference:
          type: object
          additionalProperties: true
        audit_seq:
          type: [integer, 'null']
          format: int64
        created_at:
          type: string
          format: date-time

    AdminAlertList:
      type: object
      additionalProperties: false
      required: [alerts]
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AdminAlert'

    BreakGlassRequest:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_ref, justification]
      properties:
        scope_kind:
          type: string
          enum: [patient, other]
        scope_ref:
          type: string
          description: The patient id, or what else is being reached.
        justification:
          type: string
          minLength: 20
        hours:
          type: integer
          minimum: 1
          maximum: 24
          description: How long; default four hours.

    PatientRegistration:
      type: object
      additionalProperties: false
      required:
        [
          event_id,
          name_en,
          sex,
          birth_date,
          dob_precision,
          dob_source,
          phone_primary,
          consent_reference,
        ]
      description: |
        A registration as the desk fills it in. The required set is the **clinical minimum**,
        confirmed with the clinical lead: an English name, a sex, a date of birth with its
        precision and source, one mobile, and the consent record. Everything else is prompted
        and skippable, so a record can be completed while the patient walks to the next
        station rather than a queue being held for an income band nobody present knows.
      properties:
        event_id:
          type: string
          format: uuid
          description: |
            Client-generated, UUIDv7, and the idempotency key. Sending the same one twice
            registers one patient; the second call returns `200` and `duplicate: true`.
        name_en:
          type: string
          maxLength: 120
        name_bn:
          type: string
          maxLength: 120
        sex:
          type: string
          enum: [female, male, other]
          description: |
            Three values, because the clinical questions that use it — reference ranges,
            pregnancy, percentile curves — have three answers and not two.
        birth_date:
          type: string
          format: date
          description: |
            YYYY-MM-DD, on the clinic's calendar (Asia/Dhaka). Mandatory: pediatric
            percentile calculation depends on exact age. Not in the future, and nothing
            implying an age over 130.
        dob_precision:
          type: string
          enum: [day, month, year]
          description: |
            How much of the date is real. A patient who knows only their birth year is
            recorded as 1 January with `year` — honest, sortable, and filterable — rather
            than given an invented day that a percentile would treat as exact.
        dob_source:
          type: string
          enum:
            [
              birth_certificate,
              national_id,
              passport,
              immunisation_card,
              patient_stated,
              guardian_stated,
              estimated,
            ]
          description: |
            What established the date. A document source with less than `day` precision is
            refused: a birth certificate has a day on it, and the combination is almost
            always a transcription error.
        phone_primary:
          type: string
          description: |
            A Bangladeshi mobile. `01712345678`, `+8801712345678`, `8801712345678` and
            `1712345678` are one number; all are stored as `+8801712345678`.
        phone_secondary:
          type: string
          description: A landline or an overseas number, or empty.
        division: { type: string }
        district: { type: string }
        upazila: { type: string }
        address_line: { type: string }
        postcode: { type: string }
        emergency_name: { type: string }
        emergency_relation: { type: string }
        emergency_phone: { type: string }
        education_level:
          type: string
          enum:
            [none, primary, secondary, higher_secondary, graduate, postgraduate, madrasa, unknown]
        occupation_category:
          type: string
          enum:
            [
              agriculture,
              day_labour,
              factory_worker,
              service_private,
              service_government,
              business,
              homemaker,
              student,
              retired,
              unemployed,
              other,
              unknown,
            ]
        income_band:
          type: string
          enum: [under_10k, 10k_25k, 25k_50k, 50k_100k, over_100k, unknown]
          description: Monthly household income in BDT.
        household_size:
          type: integer
          minimum: 1
          maximum: 40
        residence_type:
          type: string
          enum: [urban, semi_urban, rural, unknown]
        medicine_payer:
          type: string
          enum: [self, family, employer, ngo, government, unknown]
          description: |
            Who pays for the patient's medicines. Absent means not captured; `unknown` means
            asked and not known — a household that cannot say is a different cohort from one
            that was never asked, and both are legitimate answers.
        identifiers:
          type: object
          description: |
            Identity numbers as typed or read by OCR, keyed by kind. Hashed under a
            deployment pepper and sealed with the key ring before they reach a column; never
            returned, never logged, and never written into an event.
          additionalProperties:
            type: string
          propertyNames:
            enum: [national_id, birth_certificate, passport, driving_licence, other]
        consent_reference:
          type: string
          description: |
            The consent record this registration was taken under. Required: a patient record
            with no consent behind it is one nothing may lawfully be done with.

    PatientSearchResult:
      type: object
      additionalProperties: false
      required:
        [
          patient_id,
          clinical_id,
          name_en,
          name_bn,
          sex,
          birth_date,
          dob_precision,
          age,
          phone_masked,
          district,
          upazila,
          status,
          registered_at,
          rank,
        ]
      properties:
        patient_id: { type: string, format: uuid }
        clinical_id: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        sex: { type: string, enum: [female, male, other] }
        birth_date: { type: string, format: date }
        dob_precision:
          type: string
          enum: [day, month, year]
          description: |
            Shown beside the age, always. An age derived from a year-precision date can be a
            year out either way, and a list that hides that invites a wrong identification.
        age: { type: integer }
        phone_masked:
          type: string
          description: The last four digits. A result list is the screen most often read over an operator's shoulder.
        district: { type: string }
        upazila: { type: string }
        status: { type: string, enum: [active, inactive, deceased, merged] }
        merged_into_id: { type: string, format: uuid }
        registered_at: { type: string, format: date-time }
        rank:
          type: number
          minimum: 0
          maximum: 1
          description: |
            How good the match is. 1 for a clinical id or a telephone number; lower for a
            name. A screen can say "exact" against the first and stay quiet against the rest.

    PatientSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          clinical_id,
          name_en,
          name_bn,
          sex,
          birth,
          phone_masked,
          district,
          upazila,
          identifiers,
          status,
          registered_at,
        ]
      properties:
        id: { type: string, format: uuid }
        clinical_id: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        sex: { type: string, enum: [female, male, other] }
        birth:
          type: object
          additionalProperties: false
          required: [date, precision, source, age]
          properties:
            date: { type: string, format: date }
            precision: { type: string, enum: [day, month, year] }
            source: { type: string }
            age: { type: integer }
        phone_masked: { type: string }
        district: { type: string }
        upazila: { type: string }
        identifiers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, masked]
            properties:
              kind: { type: string }
              masked: { type: string }
        status: { type: string, enum: [active, inactive, deceased, merged] }
        merged_into_id:
          type: string
          format: uuid
          description: Set when this record redirects. The summary already follows the chain; this says that it did.
        registered_at: { type: string, format: date-time }

    PhotoUploadTicket:
      type: object
      additionalProperties: false
      required: [object_key, upload_url, expires_at, max_bytes, content_types]
      properties:
        object_key:
          type: string
          description: The server's key. Send it back unchanged when attaching.
        upload_url:
          type: string
          description: A pre-signed PUT. Send the bytes here, not to this API.
        expires_at: { type: string, format: date-time }
        max_bytes:
          type: integer
          description: |
            Stated so a client can refuse a file before spending a clinic's uplink on it.
            The server refuses it again on attach.
        content_types:
          type: array
          items: { type: string }

    PatientPhotoAttach:
      type: object
      additionalProperties: false
      required: [event_id, object_key, content_type]
      properties:
        event_id: { type: string, format: uuid }
        object_key: { type: string }
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }

    PatientPhoto:
      type: object
      additionalProperties: false
      required: [object_key, content_type, byte_size, captured_at, url, url_expires_at]
      properties:
        object_key: { type: string }
        content_type: { type: string }
        byte_size:
          type: integer
          description: Read from the object, not taken from the request.
        captured_at: { type: string, format: date-time }
        url: { type: string }
        url_expires_at: { type: string, format: date-time }

    QueueEntry:
      type: object
      additionalProperties: false
      required:
        [
          id,
          visit_id,
          patient_id,
          station_code,
          position,
          status,
          priority,
          entered_at,
          waited_seconds,
        ]
      properties:
        id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        station_code: { type: string }
        position:
          type: integer
          description: |
            Where this station sits in the planned journey. For ordering and "what is next",
            not for enforcement — a patient sent back from QA has a position behind them.
        status:
          type: string
          enum: [waiting, called, in_service, done, skipped, rerouted]
        priority:
          type: integer
          minimum: 0
          maximum: 9
          description: 0 is ordinary. Higher jumps the queue, and needs a reason.
        priority_reason: { type: string }
        entered_at:
          type: string
          format: date-time
          description: |
            When the patient joined *this* queue. A waiting time is measured from here, not
            from when the visit opened.
        called_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        outcome:
          type: string
          enum: ['', served, skipped, rerouted, left]
        outcome_reason: { type: string }
        rerouted_to: { type: string }
        waited_seconds:
          type: integer
          description: Accurate to the second, and still growing for a patient who is still waiting.

    StationLoad:
      type: object
      additionalProperties: false
      required:
        [station_code, waiting, called, in_service, longest_wait_seconds, average_wait_seconds]
      properties:
        station_code: { type: string }
        waiting: { type: integer }
        called: { type: integer }
        in_service: { type: integer }
        longest_wait_seconds:
          type: integer
          description: The number a supervisor acts on. An average hides the person who has been there since nine.
        average_wait_seconds: { type: integer }

    TrafficBoard:
      type: object
      additionalProperties: false
      required:
        [day, generated_at, settings, stations, suggestions, waiting_total, in_building_total]
      properties:
        day: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        settings:
          $ref: '#/components/schemas/BoardSettings'
        stations:
          type: array
          items:
            $ref: '#/components/schemas/BoardStation'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/BoardSuggestion'
        waiting_total: { type: integer }
        in_building_total: { type: integer }

    BoardSettings:
      type: object
      additionalProperties: false
      required:
        [identify_by, busy_wait_seconds, busy_depth, bottleneck_wait_seconds, bottleneck_depth]
      properties:
        identify_by:
          type: string
          enum: [code, code_initials, code_clinical]
          description: |
            How a waiting patient is named on a screen strangers can read. `code` is the
            default and the safe one: a visit code means nothing to anyone not holding the
            card it is printed on.
        busy_wait_seconds: { type: integer }
        busy_depth: { type: integer }
        bottleneck_wait_seconds: { type: integer }
        bottleneck_depth: { type: integer }

    BoardStation:
      type: object
      additionalProperties: false
      required:
        [station_code, position, heat, waiting, called, in_service, longest_wait_seconds, entries]
      properties:
        station_code: { type: string }
        position:
          type: integer
          description: Where this station sits in the journey, so the board reads left to right the way staff walk.
        heat:
          type: string
          enum: [calm, busy, bottleneck]
          description: |
            Whichever of wait or depth trips first. Depth matters independently because nine
            people who all arrived in the last minute have no long wait yet and are already
            the problem.
        waiting: { type: integer }
        called: { type: integer }
        in_service: { type: integer }
        longest_wait_seconds: { type: integer }
        entries:
          type: array
          items:
            $ref: '#/components/schemas/BoardEntry'

    BoardEntry:
      type: object
      additionalProperties: false
      required:
        [entry_id, visit_id, label, status, priority, flagged, counseling_done, waited_seconds]
      properties:
        entry_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        label:
          type: string
          description: Already resolved against the facility's identification convention. Never a name.
        status:
          type: string
          enum: [waiting, called, in_service]
        priority: { type: integer, minimum: 0, maximum: 9 }
        flagged:
          type: boolean
          description: |
            That somebody is being seen first. Never why — "critical glucose, seen first" is a
            diagnosis read aloud to a waiting room.
        counseling_done: { type: boolean }
        waited_seconds: { type: integer }

    BoardSuggestion:
      type: object
      additionalProperties: false
      required: [entry_id, label, from, to, waited_seconds, from_waiting]
      properties:
        entry_id: { type: string, format: uuid }
        label: { type: string }
        from: { type: string }
        to: { type: string }
        waited_seconds: { type: integer }
        from_waiting:
          type: integer
          description: |
            How deep the station they would leave is. The **facts**, not a sentence: the board
            composes the sentence in the language it is being read in, from station names it
            already knows how to write. A pre-composed English string full of raw station
            codes is not something a supervisor reading Bangla can evaluate in one glance.

    BoardRerouteRequest:
      type: object
      additionalProperties: false
      required: [event_id, to, reason]
      properties:
        event_id: { type: string, format: uuid }
        to: { type: string, pattern: '^STN_[A-Z_]+$' }
        reason:
          type: string
          minLength: 5
          description: Where the patient is going is in `to`; this says why. Both are required.

    ObservationCode:
      type: object
      additionalProperties: false
      required: [code, category, value_type, display_en, display_bn, write_permission]
      properties:
        code: { type: string, example: BODY_WEIGHT }
        category:
          type: string
          enum: [ANTHRO, VITAL, EXAM, LAB, DERIVED, SCREENING, PRO]
        value_type:
          type: string
          enum: [numeric, text, boolean, coded, structured]
        dimension:
          type: string
          description: |
            Absent for a unitless code. Two units convert into each other if and only if they
            share a dimension, so a code without one takes no unit at all.
          example: mass
        loinc:
          type: string
          description: Empty where the code is not known. A guessed code is a mapping error that surfaces years later.
        display_en: { type: string }
        display_bn: { type: string }
        min_canonical:
          type: number
          description: |
            Plausibility in the canonical unit, not a reference interval — the band outside
            which a number is a typing error. Critical values are CP50.
        max_canonical: { type: number }
        write_permission: { type: string, example: observation.write.anthro }
        canonical_unit:
          type: string
          description: The unit values of this code are stored in.
          example: kg
        units:
          type: array
          description: Every unit a value of this code may be entered in.
          items:
            $ref: '#/components/schemas/MeasurementUnit'

    MeasurementUnit:
      type: object
      additionalProperties: false
      required: [code, dimension, is_canonical, display_en, display_bn, decimals]
      properties:
        code: { type: string, example: '[lb_av]' }
        dimension: { type: string, example: mass }
        is_canonical: { type: boolean }
        display_en: { type: string, example: lb }
        display_bn: { type: string }
        decimals:
          type: integer
          description: |
            How many decimals this unit is written with. A weight in kg is 69.9; the same
            weight in grams is not 69850.0. Precision is a property of the unit.

    Observation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          patient_id,
          code,
          category,
          value_type,
          effective_at,
          recorded_at,
          source,
          status,
          recorded_by,
          recorded_role,
        ]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid }
        code: { type: string }
        category:
          type: string
          enum: [ANTHRO, VITAL, EXAM, LAB, DERIVED, SCREENING, PRO]
        value_type:
          type: string
          enum: [numeric, text, boolean, coded, structured]
        value:
          type: number
          description: The canonical value, in `unit`. This is what arithmetic uses.
        unit: { type: string }
        entered_value:
          type: number
          description: |
            As typed. Reading a value back in the unit it was entered in is a read of this
            field, not a round trip — 154 lb comes back as 154 lb.
        entered_unit: { type: string }
        value_text: { type: string }
        value_bool: { type: boolean }
        value_code: { type: string }
        value_json: {}
        effective_at:
          type: string
          format: date-time
          description: When the value was true. `recorded_at` is when it was written down; a reading taken at 09:05 and entered at 09:20 has both.
        recorded_at: { type: string, format: date-time }
        source:
          type: string
          enum: [STATION, OCR, FIELD, DEVICE, PATIENT]
          description: |
            What kind of evidence this is. A number a patient reported at home and a number an
            operator measured on a calibrated scale are different evidence.
        status:
          type: string
          enum: [ACTIVE, CORRECTED, SUPERSEDED]
        replaced_by: { type: string, format: uuid }
        recorded_by: { type: string, format: uuid }
        recorded_role: { type: string }
        station_code: { type: string }
        device_id:
          type: string
          format: uuid
          description: |
            Which tablet or phone typed it (CP61). Absent for a record written on the web, which
            is an honest absence rather than a gap — resolve the name through `GET /v1/directory`.
        note:
          type: string
          description: What the operator typed with the value — the cuff size, which arm, "patient could not stand".
        implausible_confirmed:
          type: boolean
          description: |
            The operator was warned this value was outside its plausible band and said it was right
            anyway (CP46). On the record rather than only in the ledger, so that "which rules are
            staff overriding every day" is one query — a rule overridden twenty times a week is a
            rule that is wrong.
        implausible_reason: { type: string }
        formula:
          type: string
          description: For a DERIVED value, which equation produced it. Empty for a measurement.
          example: egfr_ckd_epi_2021
        formula_version:
          type: string
          description: |
            That equation's version at computation time. CKD-EPI has already changed once; a
            value without this cannot be interpreted later.
          example: '2021.1'
        inputs:
          type: object
          additionalProperties:
            type: number
          description: |
            What the formula was given, in canonical units. What it *actually saw* — a later
            correction to an input does not change what this value was computed from.

    ObservationRequest:
      type: object
      additionalProperties: false
      required: [event_id, patient_id, code]
      properties:
        event_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid }
        code: { type: string, example: BODY_WEIGHT }
        value:
          type: number
          description: For a numeric code. `unit` is then required.
        unit:
          type: string
          description: |
            The unit the value was **entered** in, not the canonical one. Required for a
            unit-bearing code and refused for a unitless one.
          example: '[lb_av]'
        value_text: { type: string }
        value_bool: { type: boolean }
        value_code: { type: string }
        value_json: {}
        effective_at:
          type: string
          format: date-time
          description: When the value was true. Defaults to now.
        source:
          type: string
          enum: [STATION, OCR, FIELD, DEVICE, PATIENT]
          description: |
            Omitted means `STATION`, which is what a tablet at a station is. Not declared as a
            schema `default`, because a generated client reads that as a field it must send.
        note: { type: string }
        replaces:
          type: string
          format: uuid
          description: The observation this one replaces. Nothing is deleted.
        replaced_status:
          type: string
          enum: [CORRECTED, SUPERSEDED]
          description: |
            Omitted means `CORRECTED`.
            `CORRECTED` — it was wrong. `SUPERSEDED` — it was right and has been re-measured.
            Two different facts; conflating them turns re-measurements into an error rate.
        confirmed:
          type: boolean
          description: |
            The operator was warned this value is outside its plausible band and says it is
            right. Passes the soft band and the delta checks; the absolute band is checked
            first and nothing passes that. Recorded on the observation and in the ledger, so
            that a rule staff override every day can be found and retuned.
        confirmed_reason:
          type: string
          description: What they said when they confirmed it. Recorded with the value.

    ObservationBatchRequest:
      type: object
      additionalProperties: false
      required: [event_id, patient_id, observations]
      properties:
        event_id:
          type: string
          format: uuid
          description: |
            The batch's own id. Each observation still carries its own; this one seeds the
            ledger ids of the **derived** values, which the client cannot supply because it
            does not know in advance which derivations will succeed. Sending the same batch
            id twice therefore writes one BMI, not two.
        patient_id:
          type: string
          format: uuid
          description: |
            Said once. Every value in the batch is for this patient — a batch that could span
            two is a batch where one mis-set field puts somebody's weight on another person's
            chart, inside a transaction that makes it look deliberate.
        visit_id: { type: string, format: uuid }
        observations:
          type: array
          minItems: 1
          maxItems: 20
          description: |
            The measured values, in the order the screen collected them. Same shape as a
            single write, minus the patient — which the batch says once. The ceiling is a
            station form, not a bulk import.
          items:
            $ref: '#/components/schemas/BatchObservation'
        derive:
          type: array
          description: |
            Values the server computes once the measurements have landed. Never numbers: a
            client-supplied derived value would make the client authoritative about a
            clinical number.
          items:
            type: string
            enum: [BMI, WHR, BSA, BMR, IBW, EGFR, PACK_YEARS, FOOT_RISK_LEFT, FOOT_RISK_RIGHT]

    BatchObservation:
      type: object
      additionalProperties: false
      required: [event_id, code]
      description: |
        One value inside a batch. Identical to `ObservationRequest` except that it carries no
        `patient_id`: the batch names the patient once, and a per-item patient would be a
        field a client can get wrong in one of six places.
      properties:
        event_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        encounter_id: { type: string, format: uuid }
        code: { type: string, example: BODY_WEIGHT }
        value:
          type: number
          description: For a numeric code. `unit` is then required.
        unit:
          type: string
          description: |
            The unit the value was **entered** in, not the canonical one. Required for a
            unit-bearing code and refused for a unitless one.
          example: '[lb_av]'
        value_text: { type: string }
        value_bool: { type: boolean }
        value_code: { type: string }
        value_json: {}
        effective_at:
          type: string
          format: date-time
          description: When the value was true. Defaults to now.
        source:
          type: string
          enum: [STATION, OCR, FIELD, DEVICE, PATIENT]
          description: Omitted means `STATION`, which is what a tablet at a station is.
        note: { type: string }
        replaces: { type: string, format: uuid }
        replaced_status:
          type: string
          enum: [CORRECTED, SUPERSEDED]
          description: Omitted means `CORRECTED`.
        confirmed:
          type: boolean
          description: |
            The operator was warned this value is outside its plausible band and says it is
            right. Passes the soft band and the delta checks; the absolute band is checked
            first and nothing passes that.
        confirmed_reason:
          type: string
          description: What they said when they confirmed it. Recorded with the value.

    GrowthPercentile:
      type: object
      required:
        [
          indicator,
          code,
          value,
          unit,
          age_days,
          age_months,
          z,
          percentile,
          standard,
          standard_version,
        ]
      properties:
        indicator: { type: string, enum: [HFA, WFA, BFA] }
        code: { type: string, example: BODY_HEIGHT }
        value: { type: number }
        unit: { type: string }
        age_days:
          type: integer
          description: Exact, from the validated date of birth. Not rounded to years.
        age_months: { type: number }
        z:
          type: number
          description: |
            Reported beside the percentile because they answer different questions. A parent
            understands a percentile; a change over time is measured in z-scores, and beyond
            about the 99th percentile the percentile stops discriminating while the z-score
            keeps going.
        percentile: { type: number }
        standard: { type: string, example: CDC_2000 }
        standard_version: { type: string, example: '2000.1' }
        l: { type: number }
        m: { type: number }
        s:
          type: number
          description: The parameters used, so a clinician can reproduce the number by hand.
        effective_at: { type: string, format: date-time }

    GrowthPoint:
      allOf:
        - $ref: '#/components/schemas/GrowthPercentile'
        - type: object
          properties:
            velocity_per_year:
              type: number
              description: Change since the previous point of the same indicator, per year.
            velocity_unit: { type: string, example: cm/year }
            standard_changed:
              type: boolean
              description: |
                The reference switched here — the 5.0-year boundary. Draw it; do not compare
                across it.

    Growth:
      type: object
      required: [patient_id, sex, age_days, applicable]
      properties:
        patient_id: { type: string, format: uuid }
        sex: { type: string }
        age_days: { type: integer }
        applicable:
          type: boolean
          description: False when no reference covers this patient. `note` says why.
        note:
          type: string
          enum: [no_reference_for_sex, too_old_for_a_growth_reference, nothing_measured_yet]
        current:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/GrowthPercentile'
        history:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/GrowthPoint'

    WeightStatus:
      type: object
      required: [class, percent_of_95th, bmi_at_95th, standard]
      properties:
        class:
          type: string
          enum: [underweight, healthy, overweight, obese, obese_class_2, obese_class_3]
          description: "[R-06]: obesity at the 95th percentile. The classes above it are CDC's severity convention."
        percent_of_95th: { type: number }
        bmi_at_95th: { type: number }
        standard: { type: string }

    GrowthCurveSet:
      type: object
      required: [indicator, sex, unit, standards, curves]
      properties:
        indicator: { type: string, enum: [HFA, WFA, BFA] }
        sex: { type: string, enum: [male, female] }
        unit: { type: string }
        standards:
          type: array
          items:
            type: object
            required: [code, version, min_age_months, max_age_months, name_en, name_bn]
            properties:
              code: { type: string }
              version: { type: string }
              min_age_months: { type: number }
              max_age_months: { type: number }
              name_en: { type: string }
              name_bn: { type: string }
        curves:
          type: array
          items:
            type: object
            required: [percentile, points]
            properties:
              percentile: { type: number }
              points:
                type: array
                description: '[age in months, value], oldest first.'
                items:
                  type: array
                  items: { type: number }
                  minItems: 2
                  maxItems: 2

    CriticalValueRule:
      type: object
      required: [id, code, approved]
      description: |
        One threshold. `sex`, `min_age_years` and `max_age_years` narrow who it applies to;
        absent means anyone. `low` and `high` are in the code's **canonical** unit and are
        strict — a value *below* `low` or *above* `high` is critical. Either may be absent:
        oxygen saturation has a floor and no ceiling.
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: SPO2 }
        sex: { type: string, enum: [male, female] }
        min_age_years: { type: number }
        max_age_years: { type: number }
        low: { type: number, example: 92 }
        high: { type: number }
        action_en:
          type: string
          description: |
            What to do, in the operator's language. Not a template assembled in code: the
            sentence for a hypoglycaemia is not the sentence for a hypertensive emergency, and
            the useful half of an alert is what to do next.
        action_bn: { type: string }
        approved:
          type: boolean
          description: |
            Whether the clinical lead has signed this threshold off. False on every seeded
            row until D-27 lands.

    EscalationStep:
      type: object
      required: [step, after_seconds, approved]
      properties:
        step: { type: integer, example: 2 }
        after_seconds:
          type: integer
          description: Seconds after the alert was raised. Step 1 is 0.
          example: 120
        notify_role:
          type: string
          description: |
            The role told at this step. **Absent on the last step**, which notifies nobody and
            instead tells the operator who entered the value to find somebody in person.
          example: JUNIOR_DOCTOR
        note_en: { type: string }
        note_bn: { type: string }
        approved: { type: boolean }

    CriticalAlert:
      type: object
      required:
        [
          id,
          patient_id,
          observation_id,
          code,
          value,
          breached,
          threshold,
          raised_at,
          raised_by,
          status,
          escalation_step,
          delivered,
          recipients,
        ]
      description: |
        One critical value, from the moment it was raised to whoever answered it.

        The value and the action text are **copies**, not references. An observation can be
        corrected an hour later; the alert must still read as what the consultant was actually
        told at the time, and a rule edited next month must not rewrite what somebody was
        shown last week.
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        observation_id: { type: string, format: uuid }
        code: { type: string, example: SPO2 }
        display_en:
          type: string
          description: |
            The code's name from the registry, joined server-side. An alert that says
            "SPO2 88" makes whoever reads it look the code up, and the moment it matters is
            not a moment for lookups.
          example: Oxygen saturation
        display_bn: { type: string, example: অক্সিজেন সম্পৃক্তি }
        value: { type: number, example: 88 }
        unit: { type: string, example: '%' }
        breached:
          type: string
          enum: [low, high]
          description: |
            Which end. Both a screen and a reviewer need it: 3.0 mmol/L is as urgent as 25.0
            and the two mean opposite things.
        threshold: { type: number, example: 92 }
        action_en: { type: string }
        action_bn: { type: string }
        raised_at: { type: string, format: date-time }
        raised_by: { type: string, format: uuid }
        raised_role: { type: string }
        station_code: { type: string, example: STN_EXAMINATION }
        status:
          type: string
          enum: [OPEN, ACKNOWLEDGED]
        acknowledged_by: { type: string, format: uuid }
        acknowledged_at: { type: string, format: date-time }
        acknowledgement:
          type: string
          description: What the clinician said they were doing about it.
        escalation_step:
          type: integer
          description: How far down the chain it has travelled. 1 the moment it is raised.
        escalated_at: { type: string, format: date-time }
        delivered:
          type: boolean
          description: |
            Whether the alert reached at least one live screen. False is not a failure to
            record — the alert is in the ledger either way — it is the fact that makes the
            instruction to escalate verbally honest rather than decorative.
        recipients:
          type: integer
          description: How many people with `alert.read` had a live screen when it was raised.
        delivery_error: { type: string }

    ObservationAnswer:
      type: object
      required: [code, value_code, display_en, display_bn, ordering, is_normal]
      description: One option a coded observation may take.
      properties:
        code: { type: string, example: DP_PULSE_LEFT }
        value_code: { type: string, example: diminished }
        display_en: { type: string, example: Diminished }
        display_bn: { type: string, example: ক্ষীণ }
        ordering:
          type: integer
          description: Clinical order, not alphabetical. Lower is nearer to normal.
        is_normal:
          type: boolean
          description: |
            The answer that means nothing abnormal. A screen may pre-select it; a report may
            count everything else as a finding.

    CounselingRoom:
      type: object
      required: [room, display_en, display_bn, ordering]
      description: One of the physical rooms counselling walks through (§5.2).
      properties:
        room:
          type: string
          enum: [COUNSELING_ROOM, NUTRITION_ROOM, INSULIN_CORNER]
        display_en: { type: string, example: Insulin corner }
        display_bn: { type: string, example: ইনসুলিন কর্নার }
        station_code:
          type: string
          description: |
            The queue this room belongs to, where it has one. The insulin corner is part of the
            counselling station rather than a station of its own.
        ordering: { type: integer, description: The configured sequence. }

    CounselingItem:
      type: object
      required: [item_code, ordering, text_en, text_bn, mandatory, room]
      description: One thing a counsellor covers.
      properties:
        item_code:
          type: string
          description: |
            Stable across versions, because it is what a tick references. Rewording an item
            keeps its history; renaming its code does not.
          example: INSULIN_TECHNIQUE
        ordering: { type: integer }
        text_en: { type: string }
        text_bn: { type: string }
        guidance_en:
          type: string
          description: |
            What to actually say, where the item needs it. §5.4 is the reason it exists: the
            physician spot-questions the patient afterwards, and two counsellors who covered
            "injection sites" differently make that check useless.
        guidance_bn: { type: string }
        mandatory:
          type: boolean
          description: |
            What §5.5's gate reads. Which items are mandatory is a clinical decision, so it is a
            column and not a hardcoded list.
        room: { type: string }
        room_en: { type: string }
        room_bn: { type: string }
        room_step: { type: integer }
        room_station:
          type: string
          description: |
            The queue that room belongs to. On the item because a phone needs it to know whether
            the item in front of it belongs to the room the operator is standing in — the insulin
            corner is part of the counselling station, and without this every client fetches the
            room catalogue a second time to learn that.
          example: STN_COUNSELING

    CounselingItemDraft:
      type: object
      required: [item_code, text_en, text_bn, room]
      properties:
        item_code: { type: string }
        ordering:
          type: integer
          description: Omit and the array's own order is used.
        text_en: { type: string }
        text_bn: { type: string }
        guidance_en: { type: string }
        guidance_bn: { type: string }
        mandatory: { type: boolean }
        room: { type: string }

    CounselingVersion:
      type: object
      required: [template_id, version, status, created_at]
      description: |
        One revision. `DRAFT` is editable; `PUBLISHED` is frozen and is what a new session gets;
        `RETIRED` was published, is no longer offered, and stays readable because sessions
        reference it.

        Status moves DRAFT → PUBLISHED → RETIRED and nowhere else. There is no un-publishing: it
        would leave sessions pointing at a version the floor can no longer see, which is worse
        than retiring, because retired still reads.
      properties:
        template_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, PUBLISHED, RETIRED] }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
        published_at: { type: string, format: date-time }
        published_by: { type: string, format: uuid }
        published_source:
          type: string
          enum: [USER, MIGRATION]
          description: |
            Whether a person published this version or a migration did. The seeded diabetes
            template says `MIGRATION` and carries no `published_by` — because no person
            published it, and an invented user id would be the only attribution in this system
            naming somebody who did not do the thing.
        retired_at: { type: string, format: date-time }
        approved_at:
          type: string
          format: date-time
          description: |
            Null until a clinician signs off on the content. **D-53 is open**: the seeded
            diabetes items are transcribed from §5.1 and are the launch minimum, not a clinical
            author's list. Reported rather than hidden, so nothing presents a proposal as settled.
        approved_by: { type: string, format: uuid }
        items:
          type: array
          items:
            $ref: '#/components/schemas/CounselingItem'

    CounselingTemplate:
      type: object
      required: [id, code, title_en, title_bn, latest_version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: DIABETES }
        title_en: { type: string }
        title_bn: { type: string }
        retired: { type: boolean }
        published_version:
          type: integer
          description: What a new session gets. Absent when nothing is published yet.
        published_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time }
        latest_version: { type: integer }
        draft_count: { type: integer }

    CounselingSession:
      type: object
      required:
        [
          id,
          patient_id,
          visit_id,
          template_id,
          template_version,
          started_at,
          started_by,
          outstanding,
        ]
      description: |
        One walk through one checklist, for one visit (CP56, §5.3).

        `template_version` is on the session rather than looked up, which is where CP55's criterion 2
        actually lives: a checklist republished mid-session does not change what this patient was
        asked about.
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        template_version: { type: integer, minimum: 1 }
        template_code: { type: string }
        title_en: { type: string }
        title_bn: { type: string }
        started_at: { type: string, format: date-time }
        started_by: { type: string, format: uuid }
        started_role: { type: string }
        started_by_code: { type: string }
        started_by_name_en: { type: string }
        started_by_name_bn: { type: string }
        completed_by_code: { type: string }
        completed_by_name_en: { type: string }
        completed_by_name_bn: { type: string }
        approved_at:
          type: string
          format: date-time
          description: |
            When a clinician signed off on the content this session is walking. Null while it is a
            proposal (**D-53**), and carried here so a panel can say so without a second read of
            the version.
        completed_at:
          type: string
          format: date-time
          description: |
            Set when a counsellor says they are finished — never by arithmetic. A session that closed
            itself the moment the last mandatory item was ticked would take the counsellor's judgement
            out of the one place §5.4 relies on it.
        completed_by: { type: string, format: uuid }
        items:
          type: array
          description: The frozen list this session is walking. Present when one session is read.
          items:
            $ref: '#/components/schemas/CounselingItem'
        ticks:
          type: array
          description: |
            Every tick made on this session, withdrawn ones included — "ticked at 11:02 and taken back
            at 11:04" is an answer to "what was covered", not the absence of one.
          items:
            $ref: '#/components/schemas/CounselingTick'
        outstanding:
          type: array
          description: |
            The mandatory item codes with no live tick, in the order they are walked. From the same
            database function CP57's gate reads — a second implementation of "what is still missing" is
            how a phone shows a green tick while a gate refuses the patient in front of it.

            **Always present**, on the index as well as on a single session. With it sometimes
            omitted, "everything is covered" and "this row was not asked" would be the same empty
            answer, and a screen would have to guess which.
          items: { type: string }

    CounselingTick:
      type: object
      required: [item_code, ticked_at, ticked_by, undo_count]
      description: One item covered, by one person, at one time (CP56 criterion 1).
      properties:
        item_code: { type: string }
        ticked_at: { type: string, format: date-time }
        ticked_by: { type: string, format: uuid }
        ticked_role: { type: string }
        device_id:
          type: string
          format: uuid
          description: Which phone the tick was made on (CP61). Resolve the name through `GET /v1/directory`.
        station_code:
          type: string
          description: Which room's queue the counsellor was standing in.
        ticked_by_code:
          type: string
          description: |
            The staff code, and the names below it. **This is what makes §5.4 workable**: the role
            tells a counsellor from a nutritionist, and does not tell two counsellors apart — and
            "who taught you this" is a question about a person. Joined from the staff record
            rather than copied onto the tick, so somebody who changes their name reads correctly
            on last year's work.
        ticked_by_name_en: { type: string }
        ticked_by_name_bn: { type: string }
        undone_by_code: { type: string }
        undone_by_name_en: { type: string }
        undone_by_name_bn: { type: string }
        note:
          type: string
          description: §5.3's optional per-item note, for the physician who sees this patient next.
        undone_at:
          type: string
          format: date-time
          description: Set when the tick was taken back. The row is kept; a delete would leave nothing to review.
        undone_by: { type: string, format: uuid }
        undone_reason:
          type: string
          description: Required to un-tick (criterion 3). An un-tick with no reason is indistinguishable from a mis-tap.
        undo_count:
          type: integer
          description: |
            How often this item has been taken back, remembered across re-ticks. "Ticked and un-ticked
            three times" is exactly what a quality review is looking for.

    CounselingChecklist:
      type: object
      required: [template_id, template_code, title_en, title_bn, version, complete]
      description: One checklist this visit calls for, and whether it is already being walked.
      properties:
        template_id: { type: string, format: uuid }
        template_code: { type: string }
        title_en: { type: string }
        title_bn: { type: string }
        version:
          type: integer
          description: What a session started now would walk.
        priority:
          type: integer
          description: |
            The assignment rule's. Reported rather than applied silently: a counsellor looking at
            two checklists deserves to know which the clinic considers the main one.
        matched_system: { type: string }
        matched_version: { type: string }
        matched_code:
          type: string
          description: The condition that called for this checklist.
        session_id:
          type: string
          format: uuid
          description: The session already open for this visit and checklist. The phone resumes it.
        complete: { type: boolean }

    CounselingGate:
      type: object
      required: [visit_id, blocked, overridden, missing]
      description: What the counselling checkpoint says about one visit (CP57, §5.5).
      properties:
        visit_id: { type: string, format: uuid }
        blocked:
          type: boolean
          description: What the queue will do. False when nothing is missing **or** when an override stands.
        overridden:
          type: boolean
          description: |
            Why it will not block. Distinct from `blocked` because a screen that drew the two the
            same way would be telling a physician the counselling was done.
        missing:
          type: array
          items:
            $ref: '#/components/schemas/CounselingMissingItem'
        override:
          $ref: '#/components/schemas/CounselingGateOverride'

    CounselingMissingItem:
      type: object
      required: [template_id, template_code, item_code, room, text_en, text_bn]
      description: One mandatory item nobody has covered.
      properties:
        template_id: { type: string, format: uuid }
        template_code: { type: string }
        title_en:
          type: string
          description: |
            The checklist's own words, so a refusal reads as "Diabetes counselling" rather than
            DIABETES on a phone that holds nothing else.
        title_bn: { type: string }
        session_id:
          type: string
          format: uuid
          description: |
            Absent when nobody opened this checklist at all — the difference between "go back and
            finish it" and "nobody has started this", which are two different rooms.
        item_code: { type: string }
        room: { type: string }
        room_en:
          type: string
          description: |
            The room's own names and its place in the walk, carried here so a client rendering one
            refusal does not fetch the room catalogue to learn what INSULIN_CORNER reads as.
        room_bn: { type: string }
        room_step: { type: integer }
        room_station:
          type: string
          description: |
            The station that room belongs to, so a phone can mark the operator's own room on a
            refusal without fetching the room catalogue for one boolean.
        text_en: { type: string }
        text_bn: { type: string }

    CounselingGateOverride:
      type: object
      required: [id, visit_id, patient_id, granted_at, granted_by, reason, missing_at_grant]
      description: A patient let past the counselling gate, by a named person, with a reason.
      properties:
        id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        granted_at: { type: string, format: date-time }
        granted_by: { type: string, format: uuid }
        granted_role: { type: string }
        granted_by_code: { type: string }
        granted_by_name_en: { type: string }
        granted_by_name_bn: { type: string }
        reason: { type: string }
        missing_at_grant:
          type: array
          description: |
            What was outstanding **when it was granted**, not what is outstanding now. Items
            covered afterwards would otherwise make the record say the override was for nothing.
          items: { type: string }

    Directory:
      type: object
      required: [staff, devices, stations, as_of]
      description: Everything a client needs to render an attribution in words (CP61).
      properties:
        staff:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryPerson'
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryDevice'
        stations:
          type: array
          items:
            $ref: '#/components/schemas/DirectoryStation'
        as_of:
          type: string
          format: date-time
          description: |
            When this was read. A client caching the directory can say how old its answer is
            rather than presenting a stale list as current.

    DirectoryPerson:
      type: object
      required: [id, code, name_en, name_bn, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: C001 }
        name_en: { type: string }
        name_bn: { type: string }
        status:
          type: string
          description: |
            active, suspended or deactivated. Reported so a screen can say "no longer at the
            clinic" rather than presenting a departed colleague as somebody to go and ask.

    DirectoryDevice:
      type: object
      required: [id, name, kind, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Station 3 tablet }
        kind: { type: string }
        status: { type: string }

    DirectoryStation:
      type: object
      required: [code, name_en, name_bn, sequence]
      properties:
        code: { type: string, example: STN_COUNSELING }
        name_en: { type: string }
        name_bn: { type: string }
        sequence: { type: integer }

    CorrectionReason:
      type: object
      required: [code, display_en, display_bn, transcription, ordering]
      description: One of the ways a value can be wrong (CP62).
      properties:
        code: { type: string, example: TRANSCRIPTION }
        display_en: { type: string }
        display_bn: { type: string }
        transcription:
          type: boolean
          description: |
            Whether this reason means the operator typed something other than what they read.
            CP63's pattern detection is specifically about repeated transcription errors, and a
            flag on the reason is what makes that a query rather than a guess at somebody's note.
        ordering: { type: integer }

    Food:
      type: object
      required:
        [
          code,
          name_en,
          name_bn,
          group_code,
          kcal_per_100g,
          protein_per_100g,
          carb_per_100g,
          fat_per_100g,
          source,
          approved,
        ]
      properties:
        code: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        group_code:
          type: string
          enum:
            [
              GRAIN,
              PULSE,
              VEGETABLE,
              FRUIT,
              FISH,
              MEAT,
              EGG,
              DAIRY,
              OIL,
              SWEET,
              DRINK,
              SNACK,
              OTHER,
            ]
        kcal_per_100g: { type: number }
        protein_per_100g: { type: number }
        carb_per_100g: { type: number }
        fat_per_100g: { type: number }
        source:
          type: string
          description: Where the figures came from, on every row — a composition table assembled from three sources and remembered as one is a table nobody can check.
        approved:
          type: boolean
          description: False on everything seeded. The plan names the food table as a content dependency needing a national source; this is what stops a starter list being mistaken for the clinic's agreed table.
        approved_at: { type: string, format: date-time }
        portions:
          type: array
          items: { $ref: '#/components/schemas/FoodPortion' }

    FoodPortion:
      type: object
      description: What one household measure of one food weighs.
      required: [measure_code, measure_en, measure_bn, grams, universal]
      properties:
        measure_code: { type: string }
        measure_en: { type: string }
        measure_bn: { type: string }
        grams: { type: number }
        note_en:
          type: string
          description: How big — "one medium ruti", "a small teacup". A measure without a size is a measure two operators use differently.
        note_bn: { type: string }
        universal:
          type: boolean
          description: True only for grams. A teaspoon is a teaspoon; a "piece" of ruti and a "piece" of fish are different weights.
        max_quantity:
          type: integer
          description: The most of this measure one entry may carry, so a screen offering a portion also knows what it may accept against it.

    Meal:
      type: object
      description: One of the day's meals, with its name. They were bare enum codes until every client had to invent the Bangla for MID_MORNING.
      required: [code, name_en, name_bn, ordering]
      properties:
        code:
          type: string
          enum: [BREAKFAST, MID_MORNING, LUNCH, AFTERNOON, DINNER, BEDTIME, OTHER]
        name_en: { type: string }
        name_bn: { type: string }
        ordering: { type: integer }

    FoodMeasure:
      type: object
      required: [code, name_en, name_bn, universal, max_quantity, ordering]
      properties:
        code: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        universal: { type: boolean }
        max_quantity:
          type: integer
          description: |
            The most of this measure one entry may carry. On the measure rather than as a pair of
            payload-level numbers keyed by a string: a hundred cups is nobody's lunch and two
            hundred grams is an ordinary plate of rice, and a client discriminating those by
            comparing a code against "GRAM" would be right until the second universal measure was
            seeded.
        ordering: { type: integer }

    DietEntry:
      type: object
      description: |
        One thing the patient said they ate. Written once by one named person and never edited —
        which is why two assistants building one recall cannot collide.
      required:
        [
          id,
          patient_id,
          recall_date,
          meal,
          food_code,
          food_en,
          food_bn,
          quantity,
          measure_code,
          measure_en,
          measure_bn,
          grams,
          kcal,
          protein,
          carb,
          fat,
          recorded_at,
          recorded_by,
        ]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        recall_date: { type: string, format: date }
        meal:
          type: string
          enum: [BREAKFAST, MID_MORNING, LUNCH, AFTERNOON, DINNER, BEDTIME, OTHER]
        eaten_at_hour: { type: integer, minimum: 0, maximum: 23 }
        food_code: { type: string }
        food_en: { type: string }
        food_bn: { type: string }
        quantity:
          type: number
          description: The answer as given — "two cups" is 2. Kept exactly, because it is the evidence; the grams are an interpretation of it.
        measure_code: { type: string }
        measure_en: { type: string }
        measure_bn: { type: string }
        grams:
          type: number
          description: What the table says that weighs. Stored beside the quantity so a corrected portion table can be re-derived against.
        kcal: { type: number }
        protein: { type: number }
        carb: { type: number }
        fat: { type: number }
        note: { type: string }
        recorded_at: { type: string, format: date-time }
        recorded_by: { type: string, format: uuid }
        recorded_role: { type: string }
        recorded_by_code: { type: string }
        recorded_by_name_en: { type: string }
        recorded_by_name_bn: { type: string }
        station_code: { type: string }
        device_id: { type: string, format: uuid }
        source: { type: string }
        withdrawn_at: { type: string, format: date-time }
        withdrawn_by: { type: string, format: uuid }
        withdrawn_reason: { type: string }
        withdrawn_by_code: { type: string }
        withdrawn_by_name_en: { type: string }
        withdrawn_by_name_bn: { type: string }

    DietTotals:
      type: object
      required: [kcal, protein, carb, fat, entries, contributors]
      properties:
        kcal: { type: number }
        protein: { type: number }
        carb: { type: number }
        fat: { type: number }
        entries: { type: integer }
        contributors:
          type: integer
          description: How many people recorded part of this recall. On the payload because a recall two assistants built is the thing [R-01] asked for, and a screen that could not show it would make the feature invisible to the people using it.

    DietRecall:
      type: object
      required: [patient_id, recall_date, entries, totals]
      properties:
        patient_id: { type: string, format: uuid }
        recall_date: { type: string, format: date }
        entries:
          type: array
          items: { $ref: '#/components/schemas/DietEntry' }
        totals: { $ref: '#/components/schemas/DietTotals' }

    Contraindication:
      type: object
      description: |
        One thing that can stop somebody exercising, with the question the station actually asks.
      required: [code, name_en, name_bn, question_en, question_bn, ordering]
      properties:
        code: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        question_en:
          type: string
          description: What the operator is asked. A checkbox saying "neuropathy" gets ticked for tingling toes; one naming the monofilament test does not.
        question_bn: { type: string }
        from_observation:
          type: string
          description: Where the record may already hold the answer, so a station can pre-fill rather than ask twice. Absent when only a person can say.
        ordering: { type: integer }

    Exercise:
      type: object
      description: |
        One row of the library, as it is offered and as it is printed. Only ever returned inside
        `ExerciseOptions` or a plan — there is no route that returns these unfiltered for a patient.
      required:
        [
          code,
          name_en,
          name_bn,
          how_en,
          how_bn,
          kind,
          intensity,
          impact,
          needs_equipment,
          can_do_at_home,
          approved,
          ordering,
        ]
      properties:
        code: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        how_en:
          type: string
          description: What the patient is told to do. This is what gets printed and handed to them.
        how_bn:
          type: string
          description: The same instruction in Bangla. A database invariant refuses a library row that reads in only one language, because a sheet printed in Bangla is no use with an English instruction on it.
        kind:
          type: string
          enum: [AEROBIC, RESISTANCE, FLEXIBILITY, BALANCE]
        intensity:
          type: string
          enum: [LOW, MODERATE, VIGOROUS]
        impact:
          type: string
          enum: [NONE, LOW, HIGH]
          description: Whether it jars the feet. The property §3 step 8's own example turns on — no high-impact cardio in severe neuropathy.
        needs_equipment: { type: boolean }
        can_do_at_home: { type: boolean }
        approved:
          type: boolean
          description: False on everything seeded. The library content is an open clinical decision, and this is what stops a starter list being mistaken for the clinic's agreed one.
        approved_at: { type: string, format: date-time }
        ordering: { type: integer }

    ExerciseExclusion:
      type: object
      description: |
        One reason the offered list is shorter than the library. Named by **condition**, never by
        exercise: the excluded exercises are not sent, which is the whole point.
      required: [code, name_en, name_bn, status, excluded]
      properties:
        code: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        status:
          type: string
          enum: [APPLIES, NOT_ASKED]
          description: |
            `APPLIES` is a finding about this patient. `NOT_ASKED` is a question somebody still has
            to put — a condition added to the catalogue since this assessment was taken. Reported
            apart because the operator's next act differs, and because folding them together would
            tell an operator that a patient has a condition nobody has asked them about.
        excluded:
          type: integer
          description: How many exercises this condition accounts for. These counts **overlap** — jogging is excluded by neuropathy and by an open ulcer — so they do not sum to the total.

    ExerciseOptions:
      type: object
      description: |
        What a station may offer this patient, and why it is not more.
      required: [assessment_id, exercises, library_size, excluded, reasons]
      properties:
        assessment_id:
          type: string
          format: uuid
          description: The findings this list was computed from. Send it back when issuing the plan.
        exercises:
          type: array
          items: { $ref: '#/components/schemas/Exercise' }
          description: The permitted set. An empty array is a real answer, not a missing one.
        library_size:
          type: integer
          description: How many exercises exist, so a short list can say it is short on purpose.
        excluded:
          type: integer
          description: '`library_size` minus what is offered. Not the sum of the per-reason counts, which overlap.'
        reasons:
          type: array
          items: { $ref: '#/components/schemas/ExerciseExclusion' }

    ExerciseAssessment:
      type: object
      description: |
        What station 8 found. The permitted-exercise filter reads this and nothing a client sends,
        which is what makes the exclusion a property of the system rather than of a screen.
      required: [id, patient_id, contraindications, asked, status, recorded_at, recorded_by]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        walks_unaided: { type: boolean }
        walk_minutes: { type: integer }
        joint_pain: { type: string }
        contraindications:
          type: array
          items: { type: string }
          description: The conditions that applied on the day. Always present — "none apply" is the fact the filter turns on.
        asked:
          type: array
          items: { type: string }
          description: |
            The conditions that were put to the patient. Recorded rather than assumed, because when
            a sixth condition is added next year every assessment taken before it existed must
            still read as complete-for-its-time rather than as five people having skipped a
            question. An exercise mapped to a condition that is not in this list is **not offered**
            — absence of evidence is not evidence of absence.
        note: { type: string }
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED]
          description: A second assessment supersedes the first rather than editing it, so last month's plan stays readable against last month's findings.
        recorded_at: { type: string, format: date-time }
        recorded_by: { type: string, format: uuid }
        recorded_role: { type: string }
        station_code: { type: string }
        device_id: { type: string, format: uuid }
        source: { type: string }
        recorded_by_code: { type: string }
        recorded_by_name_en: { type: string }
        recorded_by_name_bn: { type: string }

    ExercisePlanItem:
      type: object
      description: |
        One target, with the wording that gets printed. The instruction is joined from the library
        rather than copied onto the row, so a correction to the Bangla reaches a sheet reprinted
        tomorrow.
      required:
        [
          exercise_code,
          times_per_week,
          minutes_per_session,
          name_en,
          name_bn,
          how_en,
          how_bn,
          needs_equipment,
          can_do_at_home,
          approved,
          minutes_per_week,
        ]
      properties:
        exercise_code: { type: string }
        times_per_week: { type: integer }
        minutes_per_session: { type: integer }
        ordering: { type: integer }
        note: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        how_en:
          type: string
          description: |
            Always present, and criterion 3 depends on it: this is the sheet the patient is handed.
            Invariant 88 refuses a library row that reads in only one language, and the plan item's
            foreign key to `core.exercise` stops the row it is joined from being deleted.
        how_bn: { type: string }
        kind: { type: string }
        intensity: { type: string }
        impact: { type: string }
        needs_equipment: { type: boolean }
        can_do_at_home: { type: boolean }
        approved: { type: boolean }
        minutes_per_week:
          type: integer
          description: Computed once on the server, so a screen, a printed sheet and §12.1's extract cannot each round it differently.

    ExercisePlan:
      type: object
      description: |
        The routine a patient was given, and the findings it was filtered against.
      required:
        [id, patient_id, assessment_id, status, items, issued_at, issued_by, minutes_per_week]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        assessment_id:
          type: string
          format: uuid
          description: Frozen. Without it, "why was she given stair climbing in June" has no answer once her cardiac symptom is recorded in July — the plan would look like a mistake rather than a decision that was right on the evidence of the day.
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED]
        note: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/ExercisePlanItem' }
        issued_at: { type: string, format: date-time }
        issued_by: { type: string, format: uuid }
        issued_role: { type: string }
        station_code: { type: string }
        device_id: { type: string, format: uuid }
        source: { type: string }
        issued_by_code: { type: string }
        issued_by_name_en: { type: string }
        issued_by_name_bn: { type: string }
        minutes_per_week:
          type: integer
          description: The plan's total, which is the number a follow-up visit compares against the week before.

    JobKind:
      type: object
      description: |
        One registered job type. §8.5's table as data — the class decides the defaults, and a kind
        may still differ from its class where the work does.
      required:
        [
          kind,
          job_class,
          queue,
          priority,
          max_attempts,
          backoff_seconds,
          backoff_cap_seconds,
          description_en,
          description_bn,
          paused,
        ]
      properties:
        kind: { type: string }
        job_class:
          type: string
          enum: [CLINICAL_CRITICAL, PATIENT_FACING, PIPELINE, ANALYTICAL, MAINTENANCE]
        queue:
          type: string
          description: Which pool of workers claims it. Queues exist so that a burst of document processing cannot slow down a clinician entering a blood pressure.
        priority:
          type: integer
          description: Higher runs first.
        max_attempts: { type: integer }
        backoff_seconds:
          type: integer
          description: The first retry waits this long; each subsequent one doubles, with jitter, up to the cap. The jitter is not decoration — without it, twenty jobs that failed together because one dependency was down retry together and fail together again.
        backoff_cap_seconds: { type: integer }
        sla_seconds:
          type: [integer, 'null']
          description: How long this kind has, from enqueue to finish, before it has missed. Null for a kind with no promise attached, which is most of them. §7.1's synthesis is the one that matters.
        description_en: { type: string }
        description_bn:
          type: string
          description: The same sentence in Bangla, because the queue-health page is read by whoever is on the floor when it goes red.
        paused: { type: boolean }
        paused_at: { type: string, format: date-time }
        paused_by:
          type: string
          format: uuid
          description: Attributed on the way out as well as on the way in. A screen that can say a kind is stopped and cannot say who stopped it leaves the log as the only place that person is findable, which is not what "findable afterwards" means.
        paused_by_code: { type: string }
        paused_by_name_en: { type: string }
        paused_by_name_bn: { type: string }

    AIInteractionStatus:
      type: string
      description: |
        What became of one AI call.

        `IN_FLIGHT` is written **before** the provider is contacted, and a row left in that state is
        a process that died mid-call. That is a worse-looking and more honest outcome than no row at
        all: criterion 2 says every call is recorded, and a row written only after the answer came
        back would record only the calls that came back.

        `REFUSED_TIER` is acceptance criterion 1b happening — a payload not known to be fabricated,
        on a free-tier credential. The call is not made, not downgraded and not retried.

        `CACHED` is an identical input answered from a previous call. Recorded as its own row with a
        cost of zero, which is what makes "identical input is never re-billed" verifiable from the
        record rather than a claim in a comment.

        `UNGROUNDED` (CP72) is an answer that reached a model, satisfied its schema, and said
        something the model was not shown. Deliberately a sibling of `INVALID_OUTPUT` rather than a
        kind of it: a malformed answer is a transport problem and is retried, an invented HbA1c is a
        quality problem and is **not** — retrying it would spend money to destroy the evidence. The
        caller received nothing; the findings are rows in the grounding-defect queue.
      enum:
        [
          IN_FLIGHT,
          SUCCEEDED,
          CACHED,
          INVALID_OUTPUT,
          PROVIDER_ERROR,
          TIMEOUT,
          CIRCUIT_OPEN,
          REFUSED_TIER,
          REFUSED_PHI,
          UNGROUNDED,
        ]

    AIGroundingArm:
      type: string
      description: |
        Which arm of the grounding check found a claim unsupported. Four, because they are fixed by
        different people: `CITATION` is a model ignoring the instruction to cite, `NUMBER` and
        `DATE` are a model inventing, and `DRUG` is a name nothing in this system can verify — there
        is no formulary until CP75, so today every drug name a model writes is unverifiable and the
        answer is withheld (§10.4 A1: *"an unrecognised drug name is dropped, not displayed"*).
      enum: [CITATION, NUMBER, DATE, DRUG]

    AIGroundingState:
      type: string
      description: |
        §10.2 step 4's verdict on one answer.

        `NOT_CHECKED` is an answer that never reached the check — the call failed, or the row
        predates CP72. Its own value rather than a blank, because "we did not look" and "we looked
        and it was fine" must never be the same thing in a column somebody counts.

        `NOT_REQUIRED` is an agent the register exempts, with a written reason. It never appears on
        a pre-consultation summary: that table's check constraint accepts only `PASSED` for a row a
        physician can read, and does not consult the register.
      enum: [NOT_CHECKED, NOT_REQUIRED, PASSED, FAILED]

    AIGroundingClassification:
      type: string
      description: |
        A person's verdict on a grounding defect. `VALIDATOR_DEFECT` is kept apart from
        `FALSE_POSITIVE` on purpose: the check firing on something that is not a claim at all is a
        parsing fault with a different fix, and folding it into the clinical false-positive rate
        would flatter both numbers.
      enum: [TRUE_POSITIVE, FALSE_POSITIVE, VALIDATOR_DEFECT]

    AIGroundingDefect:
      type: object
      description: |
        One claim an AI answer made that the context it was given does not support.

        One row per finding rather than per call: an answer that invented two numbers and a date is
        three things somebody has to look at, and collapsing them loses the shape of the failure,
        which is the first thing anybody asks when the rate moves.
      required:
        [
          id,
          ai_interaction_id,
          agent_code,
          prompt_version,
          model_version,
          arm,
          path,
          token,
          reason,
          detected_at,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        ai_interaction_id:
          type: string
          format: uuid
          description: The call this came out of. The payload and the raw answer are on that row, and the defect is worthless without them.
        agent_code: { type: string }
        prompt_version: { type: string }
        model_version: { type: string }
        subject_pseudonym:
          type: string
          description: The pseudonym, never the patient id. A reviewer is judging whether a model invented a number, which is a question about the answer rather than about the person.
        arm: { $ref: '#/components/schemas/AIGroundingArm' }
        path:
          type: string
          description: "Where in the answer, in the agent's own vocabulary: `narrative_en`, `red_flags[0].statement`."
        token:
          type: string
          description: The offending text itself — the number, the date, the reference, the drug name.
        excerpt:
          type: string
          description: |
            The sentence around it, bounded. Absent when the surrounding text tripped the PHI
            pattern list: nothing rather than a scrubbed version, because a scrubbed excerpt reads
            as prose the model wrote and is not.
        reason: { type: string }
        detected_at: { type: string, format: date-time }
        status: { type: string, enum: [OPEN, REVIEWED] }
        classification: { $ref: '#/components/schemas/AIGroundingClassification' }
        reviewed_by: { type: string, format: uuid }
        reviewed_at: { type: string, format: date-time }
        review_note: { type: string }

    AIGroundingHealth:
      type: object
      description: One agent's grounding picture over the last day.
      required: [agent_code, passed, failed, not_required, defects_open, defects_reviewed]
      properties:
        agent_code: { type: string }
        passed: { type: integer }
        failed: { type: integer }
        not_required:
          type: integer
          description: Answers not checked because the register exempts the agent. Its own series, because an agent quietly moving here is an exemption somebody granted and should be as visible as a rise in failures.
        defects_open: { type: integer }
        defects_reviewed: { type: integer }
        false_positive_rate:
          type: number
          description: |
            Of the defects a person has reviewed, the fraction they judged the check wrong about.
            **Absent, never zero, when nothing has been reviewed.**

    AIEvaluationRun:
      type: object
      description: |
        One run of the frozen evaluation set against one prompt version and one model version.
        Append-only: a trend somebody can edit is not a trend.
      required:
        [
          id,
          agent_code,
          prompt_version,
          prompt_sha256,
          model_version,
          case_set,
          case_set_sha256,
          mode,
          cases,
          injected,
          detected,
          correct,
          blocked,
          schema_failures,
          verdict,
          started_at,
          finished_at,
        ]
      properties:
        id: { type: string, format: uuid }
        agent_code: { type: string }
        prompt_version: { type: string }
        prompt_sha256: { type: string }
        model_version: { type: string }
        case_set: { type: string }
        case_set_sha256:
          type: string
          description: The frozen set's own hash. Two runs are comparable only when this matches.
        git_sha: { type: string }
        mode: { type: string, enum: [replay, live] }
        cases: { type: integer }
        injected:
          type: integer
          description: Cases whose expected verdict is "this must be caught".
        detected: { type: integer }
        correct:
          type: integer
          description: Cases whose expected verdict is "this must pass".
        blocked:
          type: integer
          description: Known-correct answers the check wrongly refused.
        schema_failures: { type: integer }
        latency_p50_ms:
          type: integer
          description: Absent on a replay, which contacts no model. Absent rather than zero.
        latency_p95_ms: { type: integer }
        cost_micro_usd: { type: integer, format: int64 }
        verdict: { type: string, enum: [PASS, FAIL] }
        regression_detail:
          type: string
          description: What regressed, in the sentence CI printed. Required on a failure — a red gate that does not say what it caught is a gate somebody re-runs until it is green.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    AIInteraction:
      type: object
      description: |
        One recorded call, without its payload.
      required:
        [
          id,
          agent_code,
          tier,
          provenance,
          status,
          input_sha256,
          input_tokens,
          output_tokens,
          cost_micro_usd,
          latency_ms,
          attempts,
          output_valid,
          used_fallback,
          grounding_state,
          grounding_findings,
          started_at,
        ]
      properties:
        id: { type: string, format: uuid }
        agent_code: { type: string }
        prompt_version: { type: string }
        model_version:
          type: string
          description: What actually answered, which need not be what was asked for — a fallback, or the in-process mock reporting itself.
        requested_model_version: { type: string }
        tier:
          type: string
          enum: [free, paid, mock]
          description: Which credential this went out on. A `free` row that is not `SYNTHETIC` cannot exist; a check constraint and invariant 99 both refuse it.
        provenance:
          type: string
          enum: [SYNTHETIC, REAL_PATIENT, UNKNOWN]
          description: |
            How the gateway decided what this payload was about. **Never taken from the request** —
            there is no field on a request that says this. It is resolved from a register of record
            ids somebody deliberately entered, and every answer except "the register says this one
            is fabricated" is treated as a real patient, including the answer a failed lookup gives.
        subject_patient_id: { type: string, format: uuid }
        subject_pseudonym:
          type: string
          description: |
            What stood in for the subject in the payload. An HMAC under a key only this deployment
            holds, salted with the agent code — so the same patient is a different token to every
            agent, and two agents' logs cannot be joined by anyone who obtains both.
        status: { $ref: '#/components/schemas/AIInteractionStatus' }
        refusal_detail:
          type: string
          description: Why this was refused, or what the provider said when it failed. Names the offending key or pattern, never the value.
        input_sha256:
          type: string
          description: The hash the cache is keyed on — of the **minimised** payload together with the prompt version, which itself pins the model. Never the caller's input, which would make the cache key a derived identifier.
        input_tokens: { type: integer }
        output_tokens: { type: integer }
        cost_micro_usd:
          type: integer
          format: int64
          description: Integer micro-dollars, rounded up. Zero on a cached call, by constraint.
        latency_ms: { type: integer }
        attempts: { type: integer }
        output_valid:
          type: [boolean, 'null']
          description: |
            Whether the answer passed its schema. **Null when the call never got that far**, which
            is a third state and not a synonym for false — a dashboard treating them alike would
            report a provider outage as a quality problem.
        used_fallback:
          type: boolean
          description: True when the primary model was unreachable and the registered fallback answered instead.
        grounding_state:
          $ref: '#/components/schemas/AIGroundingState'
        grounding_findings:
          type: integer
          description: |
            How many claims the grounding check refused (CP72). Zero on a passing verdict; on a
            failing one, the number of rows this call left in the grounding-defect queue.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }

    AIInteractionDetail:
      allOf:
        - $ref: '#/components/schemas/AIInteraction'
        - type: object
          properties:
            outbound:
              type: object
              description: |
                Exactly what was sent, after minimisation: the payload, the prompt version, and
                `removed` — the kinds of thing the scrubber took out and where, never the values.
                Absent on a `REFUSED_PHI` row.
              additionalProperties: true
            response:
              type: object
              description: What the model said, as validated.
              additionalProperties: true

    SynthesisView:
      type: object
      description: |
        What a client is given for one visit's summary. Never a 404 — see the Synthesis tag.
      required: [visit_id, state, ai_generated, degraded, message_en, message_bn, requestable]
      properties:
        visit_id: { type: string, format: uuid }
        state:
          type: string
          enum: [NOT_REQUESTED, PENDING, RUNNING, READY, FAILED, UNCHANGED]
        ai_generated:
          type: boolean
          description: Always true, never omitted. Every AI-derived element is marked wherever it appears.
        degraded:
          type: boolean
          description: |
            The screen should lead with the structured record. True for everything except a summary
            that is ready and current.
        message_en: { type: string }
        message_bn: { type: string }
        run: { $ref: '#/components/schemas/SynthesisRun' }
        requestable:
          type: boolean
          description: Whether the Analyze / Summarize button should be enabled.

    SynthesisRun:
      type: object
      description: |
        One run of the synthesis agent against one visit. A re-run is a new generation, never an
        update.
      required:
        [
          id,
          visit_id,
          patient_id,
          generation,
          state,
          trigger,
          ai_generated,
          context,
          requested_at,
          met_sla,
          grounding_state,
          grounding_findings,
        ]
      properties:
        id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        generation:
          type: integer
          description: Starts at 1 and counts re-runs for this visit.
        state:
          type: string
          enum: [PENDING, RUNNING, READY, FAILED, UNCHANGED]
        trigger:
          type: string
          enum: [AUTOMATIC, MANUAL, RERUN]
          description: |
            How this run came to exist. The ratio between AUTOMATIC and MANUAL is acceptance
            criterion 2.
        ai_generated: { type: boolean }
        context:
          $ref: '#/components/schemas/SynthesisContext'
        output:
          type: object
          additionalProperties: true
          description: |
            The model's validated answer: `narrative_en`, `key_points`, `suggested_diagnoses`,
            `missing_investigations`, `draft_medications`, `red_flags`, `confidence` and
            `citations`. Absent until there is one. Every clinical claim in it carries the fact
            references it rests on, and every reference resolves to an entry in `context.facts`.
        prompt_version: { type: string }
        model_version: { type: string }
        ai_interaction_id:
          type: string
          format: uuid
          description: The gateway call that produced it, openable in the outbound log.
        requested_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        sla_deadline:
          type: string
          format: date-time
          description: Stamped by the queue from `ops.job_kind.sla_seconds`.
        met_sla:
          type: [boolean, 'null']
          description: |
            Null while the run is unfinished. Never omitted once it is set — a false here is the
            whole point of measuring.
        failure_kind:
          type: string
          enum: [ASSEMBLY, REFUSED, PROVIDER, TIMEOUT, INVALID_OUTPUT, INTERNAL, UNGROUNDED]
          description: |
            Classified by what the physician should do about it, not by which error was returned.

            `UNGROUNDED` (CP72) is its own class because the sentence on the screen is different
            from all six others: nothing is unavailable and nothing timed out. The system has an
            answer and is **withholding** it, and a screen saying "the model could not be reached"
            would send somebody to check a network that is fine.
        failure_detail: { type: string }
        grounding_state:
          type: string
          enum: [NOT_CHECKED, PASSED, FAILED]
          description: |
            §10.2 step 4's verdict on this run's answer. **A `READY` run is always `PASSED`** — a
            check constraint refuses any other combination, which is what makes "violations block
            display" a property of the record rather than of a code path. Never omitted: a missing
            verdict and a `NOT_CHECKED` verdict are different facts.
        grounding_findings:
          type: integer
          description: How many claims failed. Zero on a passing run; on a failing one, the number of rows waiting in the grounding-defect queue.
        superseded_at:
          type: string
          format: date-time
          description: Set when a later generation became ready.

    SynthesisContext:
      type: object
      description: |
        The deterministic assembly: everything the model was shown, built by code from stored facts.
        Stored beside the answer so that a grounding check is a comparison of two columns rather
        than a re-derivation months later, and rendered by the physician's screen when there is no
        narrative to show.

        It carries **no identifier**: the age in months and the sex are the two demographics D-08
        permits, and the assembler is structurally incapable of seeing a name.
      required: [assembler_version, assembled_at, demographics, visit, allergies, facts]
      properties:
        assembler_version: { type: string }
        assembled_at: { type: string, format: date-time }
        demographics:
          type: object
          properties:
            age_months: { type: integer }
            age: { type: string }
            sex: { type: string }
        visit:
          type: object
          additionalProperties: true
          description: Visit type, clinic day, chief complaint, and every planned station with its state.
        allergies:
          type: object
          additionalProperties: true
          description: |
            `status` is the load-bearing field: `unknown` is not `none`, and a summary that read an
            absence of records as an absence of allergies would defeat the rule CP54 exists for.
        history:
          type: array
          items: { type: object, additionalProperties: true }
        current_measurements:
          type: array
          items: { type: object, additionalProperties: true }
        trends:
          type: array
          items: { type: object, additionalProperties: true }
          description: |
            Up to five points per code with the change already computed in Go. A model asked to
            subtract two numbers is usually right, and usually is the problem.
        growth:
          type: object
          additionalProperties: true
          description: |
            [R-06]. Percentiles, z-scores and the ≥95th-centile flag, taken from the clinical
            module's own scoring against the seeded reference — never recomputed in a prompt.
        lifestyle: { type: object, additionalProperties: true }
        nutrition: { type: object, additionalProperties: true }
        exercise: { type: object, additionalProperties: true }
        alerts:
          type: array
          items: { type: object, additionalProperties: true }
        prior_visits:
          type: array
          items: { type: object, additionalProperties: true }
        gaps:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              detail: { type: string }
              severity: { type: string, enum: [note, important] }
          description: |
            What the assembler expected and did not find. A model shown a record with no HbA1c
            writes a summary that does not mention HbA1c; noticing absences is what a deterministic
            pass is for.
        facts:
          type: array
          description: |
            Everything citable, flattened. The only thing the narrative may cite, and the set CP72's
            grounding validator will check against.
          items:
            type: object
            required: [ref, kind, label]
            properties:
              ref:
                type: string
                description: Short, stable and readable, e.g. `obs.hba1c:2026-03-12`.
              kind: { type: string }
              label: { type: string }
              value: { type: string }
              unit: { type: string }
              on: { type: string }
              note: { type: string }

    SynthesisSLA:
      type: object
      description: Acceptance criterion 1 as a number, over one window.
      required: [since, until, finished, met, failed, manual, p95_seconds, budget_seconds]
      properties:
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        finished: { type: integer }
        met: { type: integer }
        failed: { type: integer }
        manual:
          type: integer
          description: How many runs somebody had to ask for. Criterion 2's only measurement.
        p95_seconds: { type: number }
        budget_seconds:
          type: integer
          description: |
            From `ops.job_kind`. Zero means the catalogue could not be read — not that there is no
            budget.

    AISpend:
      type: object
      description: One agent's day, or the deployment's.
      required: [agent_code, calls, spend_micro_usd, input_tokens, output_tokens, percent_of_budget]
      properties:
        agent_code:
          type: string
          description: Empty for the deployment as a whole.
        calls: { type: integer, format: int64 }
        spend_micro_usd: { type: integer, format: int64 }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        budget_micro_usd: { type: integer, format: int64 }
        percent_of_budget:
          type: [integer, 'null']
          description: Null when no budget is configured for this agent. "Nothing configured" and "nothing spent" are different states.

    AIBudgetAlert:
      type: object
      description: One threshold crossing. Fires once per agent, per threshold, per day.
      required: [agent_code, day, threshold_percent, spend_micro_usd, budget_micro_usd, raised_at]
      properties:
        agent_code: { type: string }
        day: { type: string, format: date }
        threshold_percent: { type: integer }
        spend_micro_usd: { type: integer, format: int64 }
        budget_micro_usd: { type: integer, format: int64 }
        raised_at: { type: string, format: date-time }

    AIAgent:
      type: object
      required: [agent_code, technology, description_en, description_bn]
      properties:
        agent_code: { type: string }
        technology:
          type: string
          enum: [GENERATIVE, RETRIEVAL, SPEECH]
          description: |
            §10.1's taxonomy. It is on the row so that a reader can see at a glance that not
            everything the blueprint calls an agent goes near a model — the medication safety engine
            is deterministic code and data, and treating it as an LLM would be the single most
            dangerous architectural mistake available in this project.
        description_en: { type: string }
        description_bn: { type: string }

    AIPromptVersion:
      type: object
      required: [agent_code, version, model_version, content_sha256, changelog, deployed_at]
      properties:
        agent_code: { type: string }
        version: { type: string, description: 'Semantic: major.minor.patch.' }
        model_version: { type: string }
        fallback_model_version:
          type: string
          description: What answers when the primary is failing. A Flash answer clearly recorded as a fallback beats no answer, and beats a fabricated one by more (D-15).
        content_sha256: { type: string }
        changelog:
          type: string
          description: Required. A version without one is a change nobody can review after the fact, which is the only time anybody wants to.
        deployed_at: { type: string, format: date-time }
        content: { type: string }

    AIModel:
      type: object
      required:
        [
          model,
          model_version,
          provider,
          input_micro_usd_per_million,
          output_micro_usd_per_million,
          description_en,
          description_bn,
          retired,
        ]
      properties:
        model: { type: string }
        model_version:
          type: string
          description: Explicit and pinned. A constraint refuses anything containing `latest` or `preview`, or equal to the family name (D-13).
        provider: { type: string, enum: [gemini, mock] }
        input_micro_usd_per_million: { type: integer, format: int64 }
        output_micro_usd_per_million: { type: integer, format: int64 }
        description_en: { type: string }
        description_bn: { type: string }
        retired: { type: boolean }

    JobQueueHealth:
      type: object
      description: |
        One kind's numbers over the window.
      required:
        [
          kind,
          job_class,
          queue,
          paused,
          available,
          running,
          oldest_available_seconds,
          oldest_due_seconds,
          succeeded,
          discarded,
          cancelled,
          dead_letters,
          failure_rate,
          sla_measured,
          sla_met,
          sla_attainment,
          seconds_since_last_finish,
        ]
      properties:
        kind: { type: string }
        job_class: { type: string }
        queue: { type: string }
        paused: { type: boolean }
        paused_at: { type: string, format: date-time }
        paused_by_name_en: { type: string }
        paused_by_name_bn:
          type: string
          description: Who stopped it, on the health row too, because this is the screen somebody is looking at when they are trying to work out why nothing is happening.
        sla_seconds: { type: [integer, 'null'] }
        available:
          type: integer
          description: Depth — how many are waiting.
        running: { type: integer }
        oldest_available_seconds:
          type: integer
          description: |
            Total age — how long the oldest waiting job has existed, measured from `enqueued_at`.
            Honest, and the one a human reads; it counts a job sitting out a retry backoff as
            waiting, because it is.
        oldest_due_seconds:
          type: integer
          description: |
            **The number to alert on.** Measured from `run_at`, over jobs that are actually due, so
            it answers what an alert is really asking: is there work nobody is doing right now.

            The difference from total age matters — a job waiting out an exponential backoff is
            waiting *on purpose*, and one failing SMS on a kind with a half-hour cap would
            otherwise light an alert while the retry policy behaved exactly as designed.

            Age rather than depth, because a queue of two that has not moved in an hour is a worse
            state than a queue of four hundred that is draining. Zero when nothing is due.
        succeeded: { type: integer }
        discarded:
          type: integer
          description: Given up on after exhausting the retry policy. These are the dead letters.
        cancelled: { type: integer }
        dead_letters:
          type: integer
          description: |
            Jobs given up on and still waiting for a person — **not windowed**, unlike `discarded`
            above it. A dead letter from last night is still a dead letter this morning, so a kind
            can honestly read "0% given up on, 0 of 40 finished in the last hour" while forty dead
            letters wait. Both numbers are true; a reader who saw only one would conclude the screen
            was lying.
        failure_rate:
          type: [number, 'null']
          description: |
            Percentage of finished jobs that were given up on, over the window. **Null rather than
            zero when nothing finished** — "no failures" and "nothing ran" are different states, and
            showing 0% for both hides a stopped queue behind the healthiest number on the page.
        sla_measured:
          type: integer
          description: How many finished jobs carried a deadline. Zero for a kind with no SLA.
        sla_met: { type: integer }
        sla_attainment:
          type: [number, 'null']
          description: Percentage of measured jobs that met their deadline. Null when nothing was measured. This is §7.1's five minutes as a number rather than a claim.
        seconds_since_last_finish:
          type: integer
          description: |
            How long since this kind last finished anything, and **-1 for "never"**. An age rather
            than a wall-clock time because "nothing for four hours" is the sentence a reader wants,
            and a kind that has never run is the single most interesting thing this row can say.

    JobAttempt:
      type: object
      description: One failure, kept with what it said.
      required: [attempt, worker, failed_at, ran_for_ms, error]
      properties:
        attempt: { type: integer }
        worker:
          type: string
          description: Which process held it. A lease held by "worker" tells nobody which of six pods is wedged.
        failed_at: { type: string, format: date-time }
        ran_for_ms:
          type: integer
          description: How long it ran before failing. A job that fails after four minutes and one that fails immediately are different problems.
        error:
          type: string
          description: Truncated for rendering; the full text is in the log, joined to this by the job id.

    Job:
      type: object
      description: |
        One unit of background work. `args` may reference but must never embed PHI — a check
        constraint refuses it on the way in and a database invariant re-checks the whole table.
      required:
        [
          id,
          kind,
          queue,
          args,
          priority,
          attempt,
          max_attempts,
          status,
          run_at,
          enqueued_at,
          met_sla,
        ]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        queue: { type: string }
        args:
          type: object
          additionalProperties: true
          description: Ids, codes and counts. Never a name, a phone number, or a clinical value.
        priority: { type: integer }
        attempt: { type: integer }
        max_attempts: { type: integer }
        status:
          type: string
          enum: [AVAILABLE, RUNNING, SUCCEEDED, DISCARDED, CANCELLED]
        run_at:
          type: string
          format: date-time
          description: When it may next be picked up — now for an ordinary enqueue, later for a backoff or a scheduled job.
        enqueued_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        leased_by: { type: string }
        leased_until:
          type: string
          format: date-time
          description: A lease rather than a lock, because a lock dies with the connection that took it and the case this survives is a worker that stopped answering rather than one that disconnected politely.
        sla_deadline: { type: string, format: date-time }
        met_sla:
          type: [boolean, 'null']
          description: Null while unfinished, and for a kind with no deadline. Never omitted when set — a false here is the whole point of measuring.
        last_error: { type: string }
        dedupe_key: { type: string }
        description_en: { type: string }
        description_bn: { type: string }
        attempts:
          type: array
          items: { $ref: '#/components/schemas/JobAttempt' }

    SyncEvent:
      type: object
      description: |
        One event as a device sends it. The same shape the ledger stores, minus everything the
        server assigns: there is no `recorded_at`, no actor, no source, and no global sequence,
        because a client that could supply those could forge attribution.
      required:
        [event_id, aggregate_type, aggregate_id, event_type, event_version, occurred_at, payload]
      properties:
        event_id:
          type: string
          format: uuid
          description: Client-generated, and the idempotency key. The same event sent twice is stored once and comes back `DUPLICATE`.
        aggregate_type: { type: string }
        aggregate_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        event_type: { type: string }
        event_version: { type: integer }
        occurred_at:
          type: string
          format: date-time
          description: |
            When it happened by the device's clock. Preserved exactly; the server assigns
            `recorded_at` separately. More than five minutes in the *future* is held rather than
            accepted — an observation dated next week sorts above every real measurement forever,
            and nothing downstream can distinguish it from a genuine future-dated record because
            there is no such thing. Being in the past is unbounded and always fine: a device offline
            for a week is the entire point.
        payload:
          type: object
          additionalProperties: true
        expected_sequence:
          type: integer
          format: int64
          description: |
            Declares that this event depends on the aggregate being where the client thinks it is
            (§7.9). Setting it is what makes an event orderable — and what makes it `BLOCKED`
            rather than attempted after an earlier failure on the same aggregate.
        metadata:
          type: object
          additionalProperties: true

    SyncResult:
      type: object
      description: What happened to one event.
      required: [event_id, outcome]
      properties:
        event_id: { type: string, format: uuid }
        outcome:
          type: string
          enum: [ACCEPTED, DUPLICATE, REJECTED, QUARANTINED, BLOCKED]
          description: |
            `DUPLICATE` is **not an error** — it is what a resent batch looks like, and a client
            that treated it as one would refuse to make progress after any lost response.
            `BLOCKED` means the event was **not attempted** and the client should send it again.
            Two things produce it. `EARLIER_EVENT_FAILED`: an earlier event for the same record
            failed and this one declared it depends on that record's state. `QUARANTINE_FULL`: this
            device already has as many events awaiting review as it may have, so there was nowhere
            to hold it — cleared by somebody working through the device's quarantine, not by
            waiting. Blocked and not rejected in both cases, deliberately: a conforming client drops
            a `REJECTED` event, and dropping a real blood pressure because a supervisor is behind on
            their reading is the silent loss the quarantine exists to prevent.
        reason_code:
          type: string
          description: What a client branches on. Empty for `ACCEPTED` and `DUPLICATE`.
        reason:
          type: string
          description: What a person reads. Neither is a substitute for the other.
        global_seq:
          type: integer
          format: int64
          description: |
            Where it landed. A client advances its pull cursor past its own writes rather than
            pulling them back down — which is why it is **stored** as well as returned: the receipt
            exists for the client that lost the response, and that client needs the cursor as much
            as the outcome.

    SyncReceipt:
      type: object
      description: What happened to a whole batch.
      required:
        [
          batch_id,
          received_at,
          server_time,
          closed,
          events,
          accepted,
          duplicated,
          rejected,
          quarantined,
          blocked,
          results,
        ]
      properties:
        batch_id: { type: string, format: uuid }
        received_at: { type: string, format: date-time }
        server_time:
          type: string
          format: date-time
          description: What the server's clock said. A client with no other time source can use it.
        events: { type: integer }
        accepted: { type: integer }
        duplicated: { type: integer }
        rejected: { type: integer }
        quarantined: { type: integer }
        blocked: { type: integer }
        clock_skew_ms:
          type: integer
          format: int64
          description: |
            How far ahead of the server the device's clock was, positive when the device is ahead.
            Reported on every receipt rather than only when it is large, because a client that only
            learns about skew once it is a problem cannot correct for it gradually. Absent when the
            client sent no clock reading — unknown rather than assumed to be zero.
        closed:
          type: boolean
          description: |
            False for a batch that was opened and never finished — a server interrupted halfway.
            Such a receipt reports nothing, so a push under that id is **reprocessed** rather than
            answered from it. A client seeing `closed: false` on a `GET` should resend the batch,
            not conclude its events were lost.
        replayed:
          type: boolean
          description: True when this receipt was read rather than computed — the client asked again about a batch it had already sent. The same outcome, and a different story about what the network did.
        results:
          type: array
          items: { $ref: '#/components/schemas/SyncResult' }
          description: In the order the events were sent, so a client can walk its outbox against the response without building an index.

    SyncPage:
      type: object
      required: [events, cursor, latest, more]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/PulledEvent' }
        cursor:
          type: integer
          format: int64
          description: Where to ask from next. **Always present, even on an empty page** — a client that had to infer it from the last event would have none when the page was empty and would ask the same question forever.
        latest:
          type: integer
          format: int64
          description: Where the ledger is now, so a client can tell whether it has caught up without asking for an empty page to find out.
        more: { type: boolean }

    PulledEvent:
      type: object
      required:
        [
          event_id,
          global_seq,
          aggregate_type,
          aggregate_id,
          event_type,
          event_version,
          occurred_at,
          recorded_at,
          payload,
          actor_user_id,
          source,
        ]
      properties:
        event_id: { type: string, format: uuid }
        global_seq: { type: integer, format: int64 }
        aggregate_type: { type: string }
        aggregate_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        event_type: { type: string }
        event_version: { type: integer }
        occurred_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
        actor_user_id: { type: string, format: uuid }
        actor_role: { type: string }
        actor_station: { type: string }
        source: { type: string }

    ReferenceVersion:
      type: object
      required: [catalogue, rows, fingerprint]
      properties:
        catalogue: { type: string }
        rows: { type: integer, format: int64 }
        fingerprint:
          type: string
          description: Changes when any row does. It does not say which — a client that needs to know re-fetches the catalogue, which is one request and the thing it was going to do anyway.

    DeviceSyncState:
      type: object
      required: [device_id, last_pulled_seq, pushed_total, quarantined_total]
      properties:
        device_id: { type: string, format: uuid }
        last_pulled_seq: { type: integer, format: int64 }
        last_pulled_at: { type: string, format: date-time }
        last_pushed_at: { type: string, format: date-time }
        last_skew_ms: { type: integer, format: int64 }
        pushed_total: { type: integer, format: int64 }
        quarantined_total:
          type: integer
          format: int64
          description: How many of this device's events have been held. A running total, so "that tablet has had eleven events quarantined since Tuesday" is one read rather than a scan.

    QuarantinedEvent:
      type: object
      description: |
        An offline event that was held rather than accepted. `envelope` is present only on the
        single-event read, never in a list — the list is a triage view, and one that carried
        clinical values would put a blood pressure on every screen that shows a count.
      required:
        [
          id,
          batch_id,
          event_id,
          device_id,
          user_id,
          reason_code,
          reason,
          event_type,
          occurred_at,
          held_at,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        batch_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        reason_code:
          type: string
          enum: [DEVICE_REVOKED, DEVICE_SUSPENDED, CLOCK_IMPLAUSIBLE, UNKNOWN_EVENT_TYPE]
          description: |
            Not a free string: a quarantine somebody has to read prose to categorise is one nobody
            triages. `UNKNOWN_EVENT_TYPE` is usually a newer app talking to an older server, which
            is an ordinary state during a rolling deploy and not something to throw away.
        reason: { type: string }
        event_type: { type: string }
        occurred_at: { type: string, format: date-time }
        patient_id: { type: string, format: uuid }
        held_at: { type: string, format: date-time }
        status:
          type: string
          enum: [HELD, RELEASED, DISCARDED]
        resolved_at: { type: string, format: date-time }
        resolved_by: { type: string, format: uuid }
        resolution_note: { type: string }
        released_event_id:
          type: string
          format: uuid
          description: What it became. Set on release, so "what happened to that morning's blood pressures" has an answer that is a link.
        device_name: { type: string }
        operator_code: { type: string }
        operator_name_en: { type: string }
        operator_name_bn: { type: string }
        envelope:
          type: object
          additionalProperties: true
          description: The event as it was sent, whole. Single-event read only.

    LifestyleScoring:
      type: object
      description: |
        The composite, or the reason there is not one.

        The reason is on the payload rather than left to a client to work out, because working it
        out means re-implementing which observation feeds which domain.
      required: [score, assessed, missing, minimum]
      properties:
        score:
          oneOf:
            - $ref: '#/components/schemas/Observation'
            - type: 'null'
          description: The composite as a derived observation, or null when too few domains have been assessed.
        assessed:
          type: array
          items:
            type: string
            enum: [SMOKING, ALCOHOL, SLEEP, ACTIVITY]
          description: The domains that went into it, in the order a screen would list them.
        missing:
          type: array
          items:
            type: string
            enum: [SMOKING, ALCOHOL, SLEEP, ACTIVITY]
        minimum:
          type: integer
          description: How many domains are needed before a composite means anything. A score from one answer is a number whose name promises far more than it holds.

    Instrument:
      type: object
      description: |
        One questionnaire, and whether this clinic may run it. An unusable one is returned with its
        licence note rather than omitted, so that its absence from a screen reads as a decision.
      required: [code, name_en, name_bn, domain, usable, provenance, ordering, version_published]
      properties:
        code: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        purpose_en: { type: string }
        purpose_bn: { type: string }
        domain:
          type: string
          enum: [SMOKING, ALCOHOL, SLEEP, STRESS, ACTIVITY, DIET, READINESS]
        usable:
          type: boolean
          description: False for a copyrighted instrument nobody has licensed (D-26). Its wording is not in the database and an invariant refuses it.
        copyright_holder: { type: string }
        licence_note:
          type: string
          description: Why it may be used, or what has to be confirmed before it can be.
        licence_note_bn:
          type: string
          description: The same sentence in Bangla. The one sentence that must not be misunderstood — why a counsellor cannot run PHQ-9 today — was English only until a Bangla-reading counsellor met it on a screen.
        provenance:
          type: string
          enum: [PUBLISHED, THIS_CLINIC]
          description: |
            Whether this is published literature or something this clinic wrote. A fact rather
            than a string comparison against seeded English prose: it holds up the rule that the
            clinic's own readiness question must never read as a validated instrument.
        scoring:
          type: string
          enum: [sum, none]
          description: How the item scores add up under the published version. Reported because a total means different things under different schemes, and a screen showing "Total 3" for a one-item question whose own note says the score means nothing on its own is a screen inventing a finding.
        ordering: { type: integer }
        version:
          type: integer
          description: The latest published version, absent when there is none.
        version_published: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/InstrumentItem' }

    InstrumentItem:
      type: object
      required: [item_code, ordering, prompt_en, prompt_bn, answer_type, required]
      properties:
        item_code: { type: string }
        ordering: { type: integer }
        prompt_en: { type: string }
        prompt_bn: { type: string }
        answer_type:
          type: string
          enum: [coded, numeric, boolean]
        unit: { type: string }
        min_value: { type: number }
        max_value: { type: number }
        required: { type: boolean }
        options:
          type: array
          items: { $ref: '#/components/schemas/InstrumentOption' }

    InstrumentOption:
      type: object
      required: [option_code, ordering, label_en, label_bn, score]
      properties:
        option_code: { type: string }
        ordering: { type: integer }
        label_en: { type: string }
        label_bn: { type: string }
        score:
          type: integer
          description: What this answer contributes to the instrument's total. Sent to the client so a screen can show its working; never accepted back from one.

    InstrumentAnswerInput:
      type: object
      description: |
        One item, answered. Exactly one of `option_code`, `value_num` and `value_bool` is set, and
        which one is decided by the item's `answer_type`.

        There is deliberately **no score field**. A client that could send a score could send any
        total it liked, and the total is what §12's cohorting reads.
      required: [item_code]
      properties:
        item_code: { type: string }
        option_code: { type: string }
        value_num: { type: number }
        value_bool: { type: boolean }

    InstrumentAnswer:
      type: object
      description: One item as stored, with the wording and the chosen option's label joined so a timeline reads as a sentence rather than as codes.
      required: [item_code, score]
      properties:
        item_code: { type: string }
        option_code: { type: string }
        value_num: { type: number }
        value_bool: { type: boolean }
        score: { type: integer }
        prompt_en: { type: string }
        prompt_bn: { type: string }
        option_en: { type: string }
        option_bn: { type: string }

    InstrumentResponse:
      type: object
      description: |
        One questionnaire, answered, by one person, at one moment.

        `total` is computed from `answers` on the way out and is stored nowhere: two columns that
        ought to agree are two columns that will not, and on the day they disagree nobody can say
        which was right.
      required:
        [
          id,
          patient_id,
          instrument_code,
          instrument_version,
          recorded_at,
          recorded_by,
          status,
          total,
          answers,
        ]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        instrument_code: { type: string }
        instrument_version:
          type: integer
          description: The wording answered, frozen. An instrument whose questions change next year must not make this year's answers read as answers to the new ones.
        recorded_at: { type: string, format: date-time }
        recorded_by: { type: string, format: uuid }
        recorded_role: { type: string }
        recorded_by_code: { type: string }
        recorded_by_name_en: { type: string }
        recorded_by_name_bn: { type: string }
        station_code: { type: string }
        device_id: { type: string, format: uuid }
        source: { type: string }
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED]
        total: { type: integer }
        answers:
          type: array
          items: { $ref: '#/components/schemas/InstrumentAnswer' }

    QualityWindow:
      type: object
      description: The period a record covers. Always a whole number of days ending now — "the last thirty days" is the question people ask, and an arbitrary date range is a report rather than a record.
      required: [from, to, days]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        days: { type: integer }

    QualityThreshold:
      type: object
      description: |
        When a pattern of corrections is worth somebody looking at. Rows rather than constants,
        because the plan lists the numbers as an open decision requiring approval.
      required:
        [
          code,
          pattern,
          window_days,
          min_count,
          min_entries,
          display_en,
          display_bn,
          action_en,
          action_bn,
          approved,
          ordering,
        ]
      properties:
        code: { type: string }
        pattern:
          type: string
          enum: [TRANSCRIPTION, SAME_CODE, END_OF_SHIFT]
          description: §4.3's three shapes — repeated transcription errors, the same measurement, and end-of-shift clustering.
        window_days: { type: integer }
        min_count: { type: integer }
        min_entries:
          type: integer
          description: A floor under the denominator. Three corrections out of five entries is a new operator on their first morning, and flagging them for retraining on their first morning is how a clinic teaches its staff to stop asking for help.
        after_hour:
          type: [integer, 'null']
          description: For END_OF_SHIFT, the wall-clock hour in Asia/Dhaka after which a correction counts towards the cluster.
        display_en: { type: string }
        display_bn: { type: string }
        action_en:
          type: string
          description: What to do about it. A flag with no suggested action is a complaint.
        action_bn: { type: string }
        approved_at:
          type: [string, 'null']
          format: date-time
        approved:
          type: boolean
          description: False on every threshold this system ships with. Stated as a boolean as well as a timestamp so a client cannot forget to check for the null.
        ordering: { type: integer }

    QualityReasonCount:
      type: object
      required: [reason_code, display_en, display_bn, transcription, corrections]
      properties:
        reason_code: { type: string }
        display_en: { type: string }
        display_bn: { type: string }
        transcription:
          type: boolean
          description: Whether this reason means the operator typed something other than what they read.
        corrections: { type: integer }

    QualityCodeCount:
      type: object
      description: |
        Corrections on one measurement, against how many of that measurement the operator took.
        The denominator is the point: three corrections on a weight is a different fact when the
        operator weighed four hundred people and when they weighed nine.
      required: [code, display_en, display_bn, corrections, entries]
      properties:
        code: { type: string }
        display_en: { type: string }
        display_bn: { type: string }
        corrections: { type: integer }
        entries: { type: integer }

    QualityHourCount:
      type: object
      description: |
        Corrections by the hour the value was **recorded**, on the clinic's wall clock — not the
        hour it was flagged. A physician reviewing yesterday's file at nine in the morning would
        otherwise make every operator look like a morning problem.

        `entries` is that hour's own denominator, and without it the end-of-shift pattern is unfair
        by construction: an operator who works only the late shift will always cluster late, and a
        screen showing the numerator alone would present a rota as a person.
      required: [hour, corrections, entries]
      properties:
        hour: { type: integer, minimum: 0, maximum: 23 }
        corrections: { type: integer }
        entries: { type: integer }

    QualityEvidence:
      type: object
      description: |
        One correction behind a flag. Names no patient and carries no value.

        The display pairs are joined by the server rather than left to the client, because this is
        the screen a supervisor reads *before speaking to somebody* — and because the registries
        that would resolve the raw codes sit behind `observation.read.values`, which an
        administrator holding `quality.read.team` does not necessarily have.
      required: [request_id, reason_code, code, at, status, status_as_of, hour]
      properties:
        request_id: { type: string, format: uuid }
        reason_code: { type: string }
        reason_en: { type: string }
        reason_bn: { type: string }
        code:
          type: string
          description: The measurement code — what was being measured, never what it measured.
        code_en: { type: string }
        code_bn: { type: string }
        at: { type: string, format: date-time }
        status:
          type: string
          description: What the request was **when the flag was raised**, frozen with everything else on the row. A request that was open then and rejected since still reads OPEN here; that is the honest reading of a frozen record, and `status_as_of` says when it was true.
        status_as_of:
          type: string
          format: date-time
          description: The moment `status` was true — the raise moment, so it is the same on every row of one flag. Render it once for the evidence rather than per row.
        hour: { type: integer, minimum: 0, maximum: 23 }

    QualityFlag:
      type: object
      description: A pattern somebody should look at, frozen at the moment it was noticed.
      required:
        [
          id,
          facility_id,
          operator_id,
          threshold_code,
          threshold_approved,
          raised_at,
          window,
          observed_count,
          entries_count,
          evidence,
          status,
        ]
      properties:
        id: { type: string, format: uuid }
        facility_id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid }
        operator_code: { type: string }
        operator_name_en: { type: string }
        operator_name_bn: { type: string }
        threshold_code: { type: string }
        threshold_en: { type: string }
        threshold_bn: { type: string }
        action_en: { type: string }
        action_bn: { type: string }
        threshold_approved:
          type: boolean
          description: Whether a clinician has signed off the numbers this was raised on. False on everything this system ships with, and reported rather than hidden.
        raised_at: { type: string, format: date-time }
        window: { $ref: '#/components/schemas/QualityWindow' }
        observed_count: { type: integer }
        entries_count:
          type: integer
          description: The denominator, frozen with the count. A flag showing only the numerator would be the accusation this design exists to avoid.
        evidence:
          type: array
          items: { $ref: '#/components/schemas/QualityEvidence' }
        status:
          type: string
          enum: [OPEN, ACKNOWLEDGED, DISMISSED]
        resolved_at: { type: string, format: date-time }
        resolved_by: { type: string, format: uuid }
        resolved_by_code: { type: string }
        resolved_by_name_en: { type: string }
        resolved_by_name_bn: { type: string }
        resolution: { type: string }

    QualityOperator:
      type: object
      description: One line of the supervisor's list.
      required:
        [
          operator_id,
          corrections,
          upheld,
          overridden,
          rejected,
          open,
          entries,
          rate,
          rate_floor,
          open_flags,
        ]
      properties:
        operator_id: { type: string, format: uuid }
        employee_code: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        status:
          type: string
          description: Deactivated staff stay listed, because much of what a review asks about is somebody who has since left.
        corrections: { type: integer }
        upheld:
          type: integer
          description: Corrections this operator applied themselves.
        overridden:
          type: integer
          description: Corrections a supervisor applied instead. Counted apart, because CP62 made a supervisor's fix a different event precisely so an operator's record would not read it as their own.
        rejected:
          type: integer
          description: Requests this operator answered by saying the value stands. Never counted as an error.
        open: { type: integer }
        entries:
          type: integer
          description: The denominator, from the same query as the numerator.
        rate:
          type: [number, 'null']
          description: Corrections that stood — applied or overridden — per hundred entries. **The same arithmetic the record uses**; it was corrections-over-entries here and upheld-over-entries there, so one person and one window produced two different numbers on two screens. Null below the floor.
        rate_floor:
          type: integer
          description: The number of entries below which no rate is computed, so a screen can say how many more are needed rather than only "too few".
        open_flags: { type: integer }

    QualityRecord:
      type: object
      description: |
        One operator's record over one window. Every field that could be read as an accusation is
        accompanied by the field that makes it legible: `corrections` never appears without
        `entries`, and `upheld` never appears without `rejected`.
      required:
        [
          operator_id,
          window,
          entries,
          corrections,
          upheld,
          overridden,
          rejected,
          open,
          rate,
          rate_floor,
          answered_flags_kept_days,
          by_reason,
          by_code,
          by_hour,
          flags,
        ]
      properties:
        operator_id: { type: string, format: uuid }
        operator_code: { type: string }
        operator_name_en: { type: string }
        operator_name_bn: { type: string }
        operator_status:
          type: string
          description: The names, so a supervisor opening somebody's month gets a heading rather than a uuid.
        window: { $ref: '#/components/schemas/QualityWindow' }
        entries:
          type: integer
          description: Values this operator typed in the window. Derived values are excluded — they are computed by the server, not typed by anybody.
        corrections: { type: integer }
        upheld:
          type: integer
          description: Corrections this operator applied themselves.
        overridden:
          type: integer
          description: Corrections a supervisor applied instead. Counted apart from `upheld`, because CP62 made a supervisor's fix a different event so that an operator's record would not read it as though they had put it right themselves.
        rejected:
          type: integer
          description: Requests the operator answered by saying the value stands. Reported separately and never counted as an error — an operator who defends a correct reading is doing the job.
        open: { type: integer }
        rate:
          type: [number, 'null']
          description: Corrections that stood — applied or overridden — per hundred entries. Null below `rate_floor` entries in the window; a rate computed from four entries is noise. Always present as a key, never omitted.
        rate_floor:
          type: integer
          description: The entry count below which no rate is computed. On the payload so a screen can say "eight more values and you will see a rate" rather than only "too few" — being specific is most of what makes this read as arithmetic rather than as judgement.
        answered_flags_kept_days:
          type: integer
          description: How long an answered flag keeps appearing on this record, so a screen can say "answered notes stay for a month" rather than letting one disappear unexplained.
        by_reason:
          type: array
          items: { $ref: '#/components/schemas/QualityReasonCount' }
        by_code:
          type: array
          items: { $ref: '#/components/schemas/QualityCodeCount' }
        by_hour:
          type: array
          items: { $ref: '#/components/schemas/QualityHourCount' }
        flags:
          type: array
          description: |
            The flags on this record: open ones, and ones answered in the last thirty days.

            An operator sees their own — a flag somebody learns about from their supervisor first
            is a flag that felt like an ambush. The answered ones stay for the same reason from the
            other end: a note that appeared on somebody's device and then silently vanished when a
            supervisor closed it would teach them that things are decided about them out of sight.
          items: { $ref: '#/components/schemas/QualityFlag' }

    CorrectionRequest:
      type: object
      required:
        [
          id,
          patient_id,
          observation_id,
          code,
          requested_at,
          requested_by,
          reason_code,
          assigned_to,
          status,
        ]
      description: One value somebody said was wrong, routed to whoever typed it (CP62, §4.3).
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        observation_id:
          type: string
          format: uuid
          description: The value being flagged. It is never altered — a correction writes a new one.
        code: { type: string }
        requested_at: { type: string, format: date-time }
        requested_by: { type: string, format: uuid }
        requested_role: { type: string }
        requested_by_code: { type: string }
        requested_by_name_en: { type: string }
        requested_by_name_bn: { type: string }
        reason_code: { type: string }
        note:
          type: string
          description: What the flagger actually saw. A code can be counted and cannot say this.
        assigned_to:
          type: string
          format: uuid
          description: |
            Whoever typed the value. §4.3 routes the request to them, because an operator who never
            learns they mistyped will mistype again. Kept even when a supervisor answers instead.
        assigned_to_code: { type: string }
        assigned_to_name_en: { type: string }
        assigned_to_name_bn: { type: string }
        status:
          type: string
          enum: [OPEN, APPLIED, REJECTED, OVERRIDDEN]
          description: |
            `OVERRIDDEN` means somebody other than the author corrected it. A separate status from
            `APPLIED` because an operator's quality record must not read a supervisor's fix as
            though they had put it right themselves.
        resolved_at: { type: string, format: date-time }
        resolved_by: { type: string, format: uuid }
        resolved_role: { type: string }
        resolution_note: { type: string }
        replacement_id:
          type: string
          format: uuid
          description: The observation that now holds the value.
        recomputed:
          type: array
          items: { type: string }
          description: |
            What else moved because this moved (criterion 3): the derived codes that were
            recomputed, each as a new row superseding the old one. An entry ending
            `:not-recomputed` says one could not be — its other input has since been removed, or
            the formula refused the new value — so a physician reading "height corrected" is not
            left assuming everything downstream followed.

    CounselingAssignment:
      type: object
      required: [id, template_id, code_system, code_version, code_prefix, priority]
      description: A rule saying which diagnosis calls for which checklist.
      properties:
        id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        template_code: { type: string }
        title_en: { type: string }
        title_bn: { type: string }
        code_system: { type: string, example: ICD10 }
        code_version: { type: string, example: '2019' }
        code_prefix:
          type: string
          description: |
            Matched against the start of a recorded diagnosis code. `E11` catches the whole
            family, which is what a clinician means by "type 2 diabetes"; a rule per member would
            be sixteen rows that drift apart.
          example: E11
        priority:
          type: integer
          description: |
            Higher wins where two rules match. A patient with type 2 diabetes and
            hypothyroidism gets one checklist per matching rule, and the order they are offered
            in is not arbitrary.

    CounselingMatch:
      type: object
      required: [template_id, code, title_en, title_bn, version, priority]
      description: A checklist a coding calls for, with the published version it would use.
      properties:
        template_id: { type: string, format: uuid }
        code: { type: string }
        title_en: { type: string }
        title_bn: { type: string }
        version: { type: integer }
        priority: { type: integer }

    AllergyReaction:
      type: object
      required: [reaction, display_en, display_bn, is_emergency, ordering]
      description: One thing an allergy can have done.
      properties:
        reaction:
          type: string
          enum: [ANAPHYLAXIS, BREATHING, SWELLING_FACE, RASH, ITCHING, VOMITING, DIARRHOEA, OTHER]
        display_en: { type: string, example: Collapse or anaphylaxis }
        display_bn: { type: string, example: শ্বাস নিতে কষ্ট }
        is_emergency:
          type: boolean
          description: |
            A property of the reaction, not of the severity somebody ticked beside it.
            Anaphylaxis is an emergency whatever was chosen from the list.
        ordering: { type: integer }

    Allergy:
      type: object
      required: [id, patient_id, reaction, severity, certainty, recorded_at, recorded_by]
      description: |
        One recorded reaction to one substance. The substance is coded where the catalogue has
        it and in words where it does not — the escape hatch matters more here than anywhere
        else, because an allergy nobody could code is far more dangerous in a note field than
        it is here, marked and visible.
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        code_system: { type: string, example: DTHC }
        code_version: { type: string, example: '1.0' }
        code: { type: string, example: ALLERGEN_PENICILLIN }
        display_en: { type: string }
        display_bn: { type: string }
        said:
          type: string
          description: |
            The substance in the patient's own words, and the only field on an uncoded allergy.
            Kept on coded ones too — "the yellow tablet from the pharmacy near the bridge" is
            sometimes the only thing that identifies what actually happened.
        reaction: { type: string }
        reaction_en: { type: string }
        reaction_bn: { type: string }
        is_emergency: { type: boolean }
        severity: { type: string, enum: [mild, moderate, severe, life_threatening] }
        certainty:
          type: string
          enum: [suspected, confirmed]
          description: |
            A suspected reaction thirty years ago and a confirmed anaphylaxis are both worth
            recording and they are not the same warning.
        note: { type: string }
        recorded_at: { type: string, format: date-time }
        recorded_by: { type: string, format: uuid }
        recorded_role: { type: string }
        device_id:
          type: string
          format: uuid
          description: |
            Which tablet or phone recorded it (CP61). Absent for a record written on the web,
            which is an honest absence — resolve the name through `GET /v1/directory`.
        station_code:
          type: string
          description: Where it was recorded. Resolve the name through `GET /v1/directory`.
        source:
          type: string
          description: |
            How the record reached the server (§7.2): a station entry, an OCR read of a paper the
            patient brought, a field worker's phone. CP61's criterion 3 is that an OCR-sourced
            record is visibly different from one somebody typed, and a screen cannot draw a
            distinction the record does not carry.
        recorded_visit: { type: string, format: uuid }

    AllergyAssertion:
      type: object
      required: [id, patient_id, kind, asserted_at, asserted_by]
      description: |
        An explicit statement about allergy status, with a person behind it. Criterion 2: "no
        known allergies" is never a default and never an empty field.
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        kind: { type: string, enum: [NO_KNOWN_ALLERGY, UNABLE_TO_ASSESS] }
        reason:
          type: string
          description: |
            Present on `UNABLE_TO_ASSESS` and empty on the other. The third state exists
            because it is reviewable, and "we could not ask" with no reason is a silent gap
            wearing a label.
        asserted_at: { type: string, format: date-time }
        asserted_by: { type: string, format: uuid }
        asserted_role: { type: string }
        device_id:
          type: string
          format: uuid
          description: |
            Which tablet or phone recorded it (CP61). Absent for a record written on the web,
            which is an honest absence — resolve the name through `GET /v1/directory`.
        station_code:
          type: string
          description: Where it was recorded. Resolve the name through `GET /v1/directory`.
        source:
          type: string
          description: |
            How the record reached the server (§7.2): a station entry, an OCR read of a paper the
            patient brought, a field worker's phone. CP61's criterion 3 is that an OCR-sourced
            record is visibly different from one somebody typed, and a screen cannot draw a
            distinction the record does not carry.
        asserted_visit: { type: string, format: uuid }

    AllergyState:
      type: object
      required: [status, satisfied, allergies]
      description: |
        Everything a patient header and a station need. The status is answered as well as the
        list, because an empty list and "nobody has asked" are opposite facts.
      properties:
        status:
          type: string
          enum: [NONE_RECORDED, ALLERGIES_RECORDED, NO_KNOWN_ALLERGY, UNABLE_TO_ASSESS]
        satisfied:
          type: boolean
          description: |
            Whether the patient may advance past the history station. The same question the
            database trigger asks, answered here so a screen can explain itself before submit.
            It is not the enforcement.
        allergies:
          type: array
          description: Worst first — emergency reactions, then by severity.
          items:
            $ref: '#/components/schemas/Allergy'
        assertion:
          $ref: '#/components/schemas/AllergyAssertion'

    RecordAllergyRequest:
      type: object
      required: [reaction, severity, certainty]
      properties:
        event_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        code_system: { type: string }
        code_version: { type: string }
        code:
          type: string
          description: All three coding fields or none. Two of the three is refused.
        said: { type: string, description: Required when there is no coding. }
        reaction: { type: string }
        severity: { type: string, enum: [mild, moderate, severe, life_threatening] }
        certainty: { type: string, enum: [suspected, confirmed] }
        note: { type: string }

    AllergyChange:
      type: object
      required: [kind, id, at, by]
      description: |
        One line of the allergy change history. Withdrawn entries are included, and they are
        the reason it exists.
      properties:
        kind:
          type: string
          enum: [ALLERGY, NO_KNOWN_ALLERGY, UNABLE_TO_ASSESS]
        id: { type: string, format: uuid }
        said: { type: string }
        code: { type: string }
        reaction: { type: string }
        severity: { type: string }
        detail:
          type: string
          description: The certainty on an allergy; the reason on an assertion.
        at: { type: string, format: date-time }
        by: { type: string, format: uuid }
        by_role: { type: string }
        undone_at: { type: string, format: date-time }
        undone_by: { type: string, format: uuid }
        undone_why: { type: string }

    AllergyAssertionRate:
      type: object
      required: [asserted_by, no_known, unable, asserted]
      description: |
        One operator's assertions over a window. A view for a QA officer, never a rule: an
        officer whose patients genuinely have no allergies sits near the top of this list, and
        so does one who taps the button without asking.
      properties:
        asserted_by: { type: string, format: uuid }
        no_known: { type: integer }
        unable: { type: integer }
        asserted: { type: integer }

    HistoryKind:
      type: object
      required:
        [
          kind,
          display_en,
          display_bn,
          code_system,
          requires_relation,
          requires_duration,
          allows_severity,
          allows_onset,
          is_medication,
          ordering,
        ]
      description: |
        One of the six kinds of history, and the rules for it. The rules travel with the name
        so a station app can render the right fields per kind rather than remembering which
        needs what — the thing that stops a screen asking for a family relation on a complaint.
      properties:
        kind:
          type: string
          enum: [COMPLAINT, COMORBIDITY, FAMILY_HISTORY, SURGICAL_HISTORY, MEDICATION, VACCINATION]
        display_en: { type: string, example: Presenting complaint }
        display_bn: { type: string, example: বর্তমান সমস্যা }
        code_system:
          type: string
          description: |
            The catalogue this kind draws on. A complaint comes from the clinic's own
            dictionary; a comorbidity from ICD. Coding an item from the wrong one is refused —
            a complaint coded in ICD would make the record assert that a patient *presented
            with* a diagnosis.
          example: DTHC
        requires_relation:
          type: boolean
          description: Family history only. A family history with no relative is not one.
        requires_duration:
          type: boolean
          description: Complaints. Duration is what separates a complaint from a diagnosis.
        allows_severity: { type: boolean }
        allows_onset: { type: boolean }
        is_medication:
          type: boolean
          description: |
            Whether this kind is a drug, and therefore carries a dose and is reconciled against
            the formulary. Exactly one kind is.
        ordering: { type: integer, description: The order station 4 asks in. }

    FamilyRelation:
      type: object
      required: [relation, display_en, display_bn, degree, ordering]
      description: |
        Who a family history is about. Coded rather than typed for the same reason a complaint
        is: "mother", "Mother", "মা" and "mom" are one relation, and a query asking how many
        patients have a first-degree relative with diabetes cannot ask that of four spellings.
      properties:
        relation:
          type: string
          enum: [MOTHER, FATHER, SIBLING, CHILD, GRANDPARENT, AUNT_UNCLE]
        display_en: { type: string, example: Mother }
        display_bn: { type: string, example: মা }
        degree:
          type: integer
          enum: [1, 2]
          description: |
            First-degree family history is a risk factor with a number attached; second-degree
            is context. Returned rather than left for a client to enumerate, because a list of
            which relations are first-degree is a clinical rule and does not belong in a WHERE
            clause somebody copies wrong.
        ordering: { type: integer }

    HistoryItem:
      type: object
      required: [id, patient_id, kind, status, recorded_at, recorded_by]
      description: |
        One thing the patient brought with them, with an identity that outlives the visit.

        The coding is `code_system` + `code_version` + `code`, all three or none. An item may
        carry none when the catalogue has nothing for what the patient described; it is then
        visibly uncoded and counted at `/v1/history/uncoded`.

        `display_en` and `display_bn` come from the catalogue and are not stored on the item,
        so a title corrected next year reads correctly on every item coded with it. `said` is
        the item's own: what the patient told this officer on this day.
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        kind: { type: string }
        code_system: { type: string, example: ICD10 }
        code_version: { type: string, example: '2019' }
        code: { type: string, example: I10 }
        display_en: { type: string }
        display_bn: { type: string }
        heading: { type: string }
        heading_bn: { type: string }
        said:
          type: string
          description: |
            What the patient said, in their words. Kept on coded items too — the catalogue
            says "Type 2 diabetes mellitus without complications" and the patient said "sugar
            since the flood", and the second one is the clinical detail.
        relation: { type: string }
        duration_days: { type: integer, minimum: 0 }
        severity: { type: string, enum: [mild, moderate, severe] }
        onset_on: { type: string, format: date }
        onset_precision:
          type: string
          enum: [day, month, year]
          description: |
            How exact the start date is. A patient who says "about two years ago" has given a
            real answer, and storing it as an exact date makes a guess look like a measurement.
        dose: { type: string, example: 1 tablet }
        frequency: { type: string, example: twice a day after food }
        formulary_product_id:
          type: string
          format: uuid
          description: |
            Criterion 2. Null on every item until the formulary exists — that is the honest
            shape of "link to formulary products **where they exist**". The state is recorded
            per item now so that the day the formulary lands, the work is matching rows.
        reconciliation:
          type: string
          enum: [UNRECONCILED, MATCHED, NOT_STOCKED]
          description: |
            `NOT_STOCKED` is a finding, not a failure: somebody looked and this clinic does
            not carry it, which is worth knowing before a prescription is written.
        status:
          type: string
          enum: [ACTIVE, RESOLVED]
          description: |
            `RESOLVED` is not a removal. "She had this and no longer does" is a clinical fact;
            "this was never true" removes the item and takes a reason.
        recorded_at: { type: string, format: date-time }
        recorded_by: { type: string, format: uuid }
        recorded_role: { type: string }
        device_id:
          type: string
          format: uuid
          description: |
            Which tablet or phone recorded it (CP61). Absent for a record written on the web,
            which is an honest absence — resolve the name through `GET /v1/directory`.
        station_code:
          type: string
          description: Where it was recorded. Resolve the name through `GET /v1/directory`.
        source:
          type: string
          description: |
            How the record reached the server (§7.2): a station entry, an OCR read of a paper the
            patient brought, a field worker's phone. CP61's criterion 3 is that an OCR-sourced
            record is visibly different from one somebody typed, and a screen cannot draw a
            distinction the record does not carry.
        recorded_visit: { type: string, format: uuid }
        confirmed_at:
          type: string
          format: date-time
          description: |
            Criterion 3. Absent means nobody has said this is still true since it was
            recorded — which is exactly what a returning patient's list looks like, and what
            station 4 works through one item at a time.
        confirmed_by: { type: string, format: uuid }
        confirmed_visit: { type: string, format: uuid }
        amended_at: { type: string, format: date-time }
        amended_by: { type: string, format: uuid }

    RecordHistoryItemRequest:
      type: object
      required: [kind]
      description: |
        One item. Which fields are required beyond `kind` depends on the kind, and
        `/v1/history/kinds` says which — the server enforces the same rules and names the
        offending field when it refuses.
      properties:
        event_id:
          type: string
          format: uuid
          description: |
            The client's idempotency key. Optional from a browser, which has no offline queue
            and nothing to replay; a tablet sends its own, which is what makes a history taken
            over a bad connection produce one complaint rather than four.
        visit_id: { type: string, format: uuid }
        kind: { type: string }
        code_system: { type: string }
        code_version: { type: string }
        code:
          type: string
          description: |
            All three coding fields or none. Two of the three is refused: a code with no
            version is a string, and guessing the missing third is how a coding acquires a
            version nobody searched.
        said:
          type: string
          description: Required when there is no coding, and welcome when there is.
        relation: { type: string }
        duration_days: { type: integer, minimum: 0 }
        severity: { type: string, enum: [mild, moderate, severe] }
        onset_on: { type: string, format: date }
        onset_precision: { type: string, enum: [day, month, year] }
        dose: { type: string }
        frequency: { type: string }

    AmendHistoryItemRequest:
      type: object
      description: |
        Every field optional; absent means unchanged and an empty string clears it. The kind
        and the coding are absent from this schema on purpose — changing what an item *is*
        means removing one and recording another.
      properties:
        event_id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        said: { type: string }
        severity: { type: string }
        duration_days: { type: integer, minimum: 0 }
        onset_on: { type: string }
        onset_precision: { type: string }
        dose: { type: string }
        frequency: { type: string }
        status: { type: string, enum: [ACTIVE, RESOLVED] }
        formulary_product_id: { type: string }
        reconciliation: { type: string, enum: [UNRECONCILED, MATCHED, NOT_STOCKED] }

    CodeSystem:
      type: object
      required: [code, title_en, title_bn, publisher, usable]
      description: |
        One terminology, and what may be done with it. The licence note is part of the answer:
        the next person to add a system will be tempted to add SNOMED, and this is where they
        find out that they cannot yet.
      properties:
        code: { type: string, example: ICD10 }
        title_en:
          {
            type: string,
            example: 'ICD-10: International Classification of Diseases, 10th revision',
          }
        title_bn:
          { type: string, example: 'আইসিডি-১০: রোগের আন্তর্জাতিক শ্রেণিবিন্যাস, ১০ম সংস্করণ' }
        publisher: { type: string, example: World Health Organization }
        licence_note:
          type: string
          description: What the publisher permits, where that is not obvious. Empty when it is.
        usable:
          type: boolean
          description: |
            Whether this deployment may embed content from it. `false` is SNOMED CT pending
            D-24 — searching it answers `422` rather than an empty list, because "no results"
            and "we are not licensed for that" send a clinician to two different places.
        default_version:
          type: string
          description: |
            What a search resolves to when the caller names no version. Absent for a system
            registered with no content yet, in which case a caller must name one explicitly.

    Concept:
      type: object
      required: [system, version, code, display_en]
      description: |
        One coded thing: a diagnosis from ICD, or a complaint from the clinic's own dictionary.

        `system` and `version` travel with every concept because they are half of what a
        coding means. Store both.
      properties:
        system: { type: string, example: ICD10 }
        version: { type: string, example: '2019' }
        code: { type: string, example: E11.9 }
        display_en: { type: string, example: Type 2 diabetes mellitus without complications }
        display_bn: { type: string, example: 'টাইপ ২ ডায়াবেটিস মেলিটাস, জটিলতাবিহীন' }
        heading:
          type: string
          description: The grouping this sits under, for filing a long result list.
          example: Diabetes
        heading_bn:
          type: string
          description: |
            The same grouping in Bangla. A list of Bengali diagnoses filed under English
            chapter names is what half-bilingual looks like on a screen — worse than either
            language alone, because it reads as an interface somebody translated the easy
            parts of. A standing invariant refuses a heading that has no Bangla form.
          example: ডায়াবেটিস
        favourite_rank:
          type: integer
          description: |
            The clinic's own ordering, where it has one. Present on the diagnoses DTHC
            actually makes; absent on the rest of the classification.
        tier:
          type: integer
          enum: [1, 2, 3, 4]
          description: |
            Why this result came where it did. 1 the code typed literally, 2 a favourite whose
            words start with the query, 3 anything else whose words do, 4 the trigram tier for
            a misspelling. Returned rather than hidden: a ranking nobody can inspect is a
            ranking nobody can tune. Absent on the favourites endpoint, which is not a search.
        score:
          type: number
          format: double
          description: Trigram similarity, 0–1. What orders results inside a tier.

    ConceptList:
      type: object
      required: [system, version, concepts]
      description: |
        Results, and the pair they were found under. The `version` is the resolved one — stamp
        that on the coding, not a version the client assumed.
      properties:
        system: { type: string, example: ICD10 }
        version: { type: string, example: '2019' }
        concepts:
          type: array
          items:
            $ref: '#/components/schemas/Concept'

    ConceptMapping:
      type: object
      required: [to_system, to_version, to_code, equivalence]
      description: |
        One concept's equivalent in another system. Empty everywhere until D-24 answers; the
        shape exists now so that the day it does, nothing on either side changes.
      properties:
        to_system: { type: string, example: SNOMED }
        to_version: { type: string }
        to_code: { type: string }
        equivalence:
          type: string
          enum: [equivalent, wider, narrower, inexact]
          description: |
            How close the match is. `wider` and `narrower` are not the same as `equivalent`,
            and a report that treated them as one would silently change what it counted.

    ReferenceRange:
      type: object
      required: [code, approved]
      description: |
        What is ordinary for a patient of this age and sex. All values are in the code's
        canonical unit. Either edge may be absent — a pulse oximeter reading has a floor and
        no ceiling worth naming, and an invented upper bound is a bound that flags healthy
        patients until staff stop reading the flag.
      properties:
        code: { type: string, example: HEART_RATE }
        sex: { type: string, enum: [male, female] }
        min_age_years: { type: number }
        max_age_years: { type: number }
        low: { type: number }
        high: { type: number }
        note_en: { type: string }
        note_bn: { type: string }
        approved:
          type: boolean
          description: Whether a clinician has signed off on this range.

    PlausibilityRule:
      type: object
      required: [code, approved]
      description: |
        One band. `sex`, `min_age_years` and `max_age_years` narrow who it applies to; absent
        means anyone. All values are in the code's **canonical** unit.
      properties:
        code: { type: string, example: BODY_HEIGHT }
        sex: { type: string, enum: [male, female] }
        min_age_years: { type: number }
        max_age_years: { type: number }
        absolute_min:
          type: number
          description: Below this, nothing stores the value — no confirmation passes it.
        absolute_max: { type: number }
        plausible_min:
          type: number
          description: |
            Below this and above `absolute_min`, the value is storable with an explicit
            confirmation. A system that refused every unusual value would be a system that
            cannot record the tallest patient in the district.
        plausible_max: { type: number }
        max_increase:
          type: number
          description: |
            How far the value may rise from the patient's own last recorded one before it
            needs confirming. An adult who gains 12 cm of height between visits is a typing
            error far more often than a finding.
        max_decrease: { type: number }
        max_increase_per_day: { type: number }
        max_decrease_per_day: { type: number }
        note_en: { type: string }
        note_bn: { type: string }
        approved:
          type: boolean
          description: Whether a clinician has signed off on these numbers.

    QueueEnterRequest:
      type: object
      additionalProperties: false
      required: [event_id, station_code]
      properties:
        event_id: { type: string, format: uuid }
        station_code: { type: string, pattern: '^STN_[A-Z_]+$' }
        priority: { type: integer, minimum: 0, maximum: 9, default: 0 }
        priority_reason:
          type: string
          description: Required whenever the priority is above zero.

    QueueLeaveRequest:
      type: object
      additionalProperties: false
      required: [event_id, outcome]
      properties:
        event_id: { type: string, format: uuid }
        outcome:
          type: string
          enum: [served, skipped, rerouted, left]
        reason: { type: string }
        rerouted_to:
          type: string
          description: Required for a reroute. Where the patient actually went.

    Visit:
      type: object
      additionalProperties: false
      required:
        [id, patient_id, visit_code, visit_type, status, clinic_day, opened_at, reopened_count]
      properties:
        id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_code:
          type: string
          description: 'Spoken at a desk: V-2026-0914-017 is the seventeenth patient of that morning.'
        visit_type:
          type: string
          enum: [new, follow_up, outreach_referral]
          description: |
            `outreach_referral` is separate because §14 counts it as a different funnel: a
            patient who arrived from a camp is not a walk-in.
        chief_complaint: { type: string }
        status:
          type: string
          enum: [open, closed, abandoned]
          description: |
            `abandoned` is deliberately not `closed`. §14.2's throughput must not count a
            journey nobody completed as a completed journey.
        status_reason: { type: string }
        clinic_day:
          type: string
          format: date
          description: Asia/Dhaka. A visit spanning midnight belongs to one day.
        opened_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time }
        diagnoses: { type: string }
        plan: { type: string }
        next_review_days:
          type: integer
          description: A number rather than "in three months", because the outreach engine reads it.
        next_review_on: { type: string, format: date-time }
        reopened_count:
          type: integer
          description: How many times this visit has been reopened. Three is worth somebody looking.

    Encounter:
      type: object
      additionalProperties: false
      required: [id, visit_id, station_code, status, started_at, started_role]
      properties:
        id: { type: string, format: uuid }
        visit_id: { type: string, format: uuid }
        station_code: { type: string }
        status:
          type: string
          enum: [in_progress, finished, bounced]
        started_at: { type: string, format: date-time }
        started_role: { type: string }
        ended_at: { type: string, format: date-time }
        outcome:
          type: string
          enum: ['', completed, skipped, bounced, patient_left]
        notes: { type: string }
        seconds:
          type: integer
          description: How long the patient was at this station. Absent while the encounter is open.

    VisitSummary:
      type: object
      additionalProperties: false
      required: [visit, encounters, total_seconds, waiting_seconds]
      properties:
        visit:
          $ref: '#/components/schemas/Visit'
        encounters:
          type: array
          items:
            $ref: '#/components/schemas/Encounter'
        total_seconds:
          type: integer
          description: How long the patient has been in the building.
        waiting_seconds:
          type: integer
          description: |
            Time not at any station — the gaps between encounters, which is what a patient
            actually experiences as waiting.

    VisitOpenRequest:
      type: object
      additionalProperties: false
      required: [event_id, patient_id, visit_type]
      properties:
        event_id: { type: string, format: uuid }
        patient_id: { type: string, format: uuid }
        visit_type:
          type: string
          enum: [new, follow_up, outreach_referral]
        chief_complaint:
          type: string
          description: |
            What the patient came with, in their own words where possible. Free text on
            purpose — a coded complaint taken at a registration desk is a coded guess.

    VisitCloseRequest:
      type: object
      additionalProperties: false
      required: [event_id, diagnoses, plan, next_review_days]
      properties:
        event_id: { type: string, format: uuid }
        chief_complaint:
          type: string
          description: |
            Optional at close, and only to correct it: the desk hears "sugar problem" and the
            physician writes what it turned out to be. Empty keeps what the visit has.
        diagnoses: { type: string }
        plan: { type: string }
        next_review_days: { type: integer, minimum: 1, maximum: 3650 }

    VisitAbandonRequest:
      type: object
      additionalProperties: false
      required: [event_id, reason]
      properties:
        event_id: { type: string, format: uuid }
        reason:
          type: string
          enum: [patient_left, referred_out, clinic_closed, duplicate, other]
        note: { type: string }

    VisitReopenRequest:
      type: object
      additionalProperties: false
      required: [event_id, reason]
      properties:
        event_id: { type: string, format: uuid }
        reason:
          type: string
          minLength: 10
          description: Required. A closed visit that changes without saying why is what §4.3 forbids.

    EncounterStartRequest:
      type: object
      additionalProperties: false
      required: [event_id, station_code]
      properties:
        event_id: { type: string, format: uuid }
        station_code: { type: string, pattern: '^STN_[A-Z_]+$' }

    EncounterFinishRequest:
      type: object
      additionalProperties: false
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
        outcome:
          type: string
          enum: [completed, skipped, bounced, patient_left]
          default: completed
        note: { type: string }

    PatientTimeline:
      type: object
      additionalProperties: false
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        total:
          type: integer
          description: How many entries match the window and the caller's permissions.
        earliest:
          type: string
          format: date-time
          description: |
            The first thing on record, whatever window was asked for — so "nothing in this
            window" is distinguishable from "nothing at all". Absent for a patient with no
            timeline.
        latest: { type: string, format: date-time }

    TimelineEntry:
      type: object
      additionalProperties: false
      required:
        [
          occurred_at,
          recorded_at,
          category,
          kind,
          label_en,
          label_bn,
          actor_code,
          actor_role,
          flags,
          event_id,
          event_type,
        ]
      properties:
        occurred_at:
          type: string
          format: date-time
          description: When it happened in the world.
        recorded_at:
          type: string
          format: date-time
          description: When it reached the system. Later than `occurred_at` for anything entered after the fact.
        category:
          type: string
          enum:
            [
              registration,
              visit,
              observation,
              diagnosis,
              medication,
              document,
              communication,
              alert,
              consent,
              administrative,
            ]
        kind:
          type: string
          description: What the row actually is, e.g. `patient.corrected`. Open, so a new type needs no migration.
        label_en: { type: string }
        label_bn: { type: string }
        value: { type: string }
        unit: { type: string }
        value_num:
          type: number
          description: The numeric value when there is one, for a chart that plots the row rather than reading it.
        actor_code: { type: string }
        actor_role: { type: string }
        actor_station: { type: string }
        source: { type: string }
        flags:
          type: array
          items: { type: string }
          description: What a screen acts on — `critical`, `corrected`, `amended`, `high`, `low`.
        event_id: { type: string, format: uuid }
        event_type: { type: string }
        item:
          type: string
          description: Distinguishes several rows produced by one event — a corrected field, a consent type.

    ConsentTemplate:
      type: object
      additionalProperties: false
      required: [consent_type, version, language, title, body, digest, status]
      description: |
        One version of one consent's wording, in one language. Immutable once active: a
        patient consented to these exact words, and a new version is published rather than
        the old one edited.
      properties:
        consent_type:
          type: string
          enum: [care, communication, research, ai_processing, outreach]
        version: { type: integer, minimum: 1 }
        language: { type: string, enum: [en, bn] }
        title: { type: string }
        body: { type: string }
        digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the body. Travels into the event, so a later edit of the row is detectable.
        status: { type: string, enum: [draft, active, retired] }
        effective_from: { type: string, format: date-time }

    PatientConsent:
      type: object
      additionalProperties: false
      required: [consent_type, status, has_evidence]
      properties:
        consent_type:
          type: string
          enum: [care, communication, research, ai_processing, outreach]
        status:
          type: string
          enum: [granted, revoked, absent]
          description: |
            `absent` means never asked, and is not the same as `revoked`. One is work the
            desk has not done; the other is a decision the patient made.
        template_version: { type: integer }
        language: { type: string, enum: ['', en, bn] }
        capture_method:
          type: string
          enum: ['', signature, thumbprint, verbal_attested, paper_form]
        paper_reference: { type: string }
        witnessed_by_code: { type: string }
        granted_for_relation:
          type: string
          description: Set when somebody else consented for the patient — a guardian for a minor.
        granted_for_name: { type: string }
        granted_at: { type: string, format: date-time }
        granted_by_code: { type: string }
        revoked_at: { type: string, format: date-time }
        revoked_by_code: { type: string }
        revoke_reason: { type: string }
        has_evidence:
          type: boolean
          description: |
            Whether a signature or thumbprint image exists. Not a URL: one would be minted
            for every row in the list whether or not anybody opened one.

    ConsentGrantRequest:
      type: object
      additionalProperties: false
      required: [event_id, consent_type, capture_method]
      properties:
        event_id: { type: string, format: uuid }
        consent_type:
          type: string
          enum: [care, communication, research, ai_processing, outreach]
        language:
          type: string
          enum: [en, bn]
          description: The language the patient was shown. Defaults to Bangla.
        capture_method:
          type: string
          enum: [signature, thumbprint, verbal_attested, paper_form]
        evidence_key:
          type: string
          description: Required for a signature or a thumbprint. From the evidence-url response.
        evidence_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        paper_reference:
          type: string
          description: Required for a paper form. Without it nobody can find the paper.
        witnessed_by:
          type: string
          format: uuid
          description: Required for a thumbprint or a verbal attestation.
        granted_for_relation: { type: string }
        granted_for_name: { type: string }

    ConsentRevokeRequest:
      type: object
      additionalProperties: false
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
        reason:
          type: string
          description: Optional. A patient withdrawing consent does not owe anybody an explanation.
        requested_by:
          type: string
          enum: [patient, guardian, clinic]
          default: patient

    ConsentHistoryEntry:
      type: object
      additionalProperties: false
      required: [consent_type, action, occurred_at, event_id]
      properties:
        consent_type: { type: string }
        action: { type: string, enum: [granted, revoked] }
        template_version: { type: integer }
        language: { type: string }
        capture_method: { type: string }
        reason: { type: string }
        requested_by: { type: string }
        actor_code: { type: string }
        occurred_at: { type: string, format: date-time }
        event_id: { type: string, format: uuid }

    PatientCorrectionRequest:
      type: object
      additionalProperties: false
      required: [event_id, reason]
      description: |
        Only the fields being corrected. An absent field is one the operator is not touching.
      properties:
        event_id: { type: string, format: uuid }
        reason:
          type: string
          minLength: 10
          description: |
            Required. "Correction" is not a reason; "the NID card says 1985, the registration
            desk typed 1958" is.
        name_en: { type: string }
        name_bn: { type: string }
        sex: { type: string, enum: [female, male, other] }
        birth_date: { type: string, format: date }
        dob_precision: { type: string, enum: [day, month, year] }
        dob_source: { type: string }
        phone_primary: { type: string }
        phone_secondary: { type: string }
        division: { type: string }
        district: { type: string }
        upazila: { type: string }
        address_line: { type: string }
        postcode: { type: string }

    FieldChange:
      type: object
      additionalProperties: false
      required: [field, previous, current]
      properties:
        field: { type: string }
        previous: { type: string }
        current: { type: string }

    DerivedDependency:
      type: object
      additionalProperties: false
      required: [derived_name, depends_on, action, description]
      properties:
        derived_name: { type: string }
        depends_on: { type: string }
        action:
          type: string
          enum: [recompute, review]
          description: |
            `recompute` — the value is a function of the field and was rebuilt in the same
            transaction. `review` — a person has to look, because the old value was acted on.
        description: { type: string }

    PatientCorrection:
      type: object
      additionalProperties: false
      required:
        [field, previous, current, reason, high_impact, corrected_by_code, corrected_at, event_id]
      properties:
        field: { type: string }
        previous: { type: string }
        current: { type: string }
        reason: { type: string }
        high_impact: { type: boolean }
        corrected_by_code: { type: string }
        corrected_at: { type: string, format: date-time }
        event_id: { type: string, format: uuid }

    DuplicateMatch:
      type: object
      additionalProperties: false
      required: [verdict, candidates]
      properties:
        verdict:
          type: string
          enum: [clear, review, blocked]
          description: |
            `blocked` — an identity number, or a mobile and an exact date of birth, already
            belongs to somebody. Registration will be refused and the record is shown.
            `review` — candidates worth a person's eye. Registration is **not** refused: a
            register in Bangladesh legitimately contains many people of one name born in one
            year, and refusing them all would train the desk to ignore the warning.
            `clear` — nothing plausible was found.
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/DuplicateCandidate'

    DuplicateCandidate:
      type: object
      additionalProperties: false
      required:
        [
          patient_id,
          clinical_id,
          name_en,
          name_bn,
          sex,
          birth_date,
          phone_masked,
          district,
          registered_at,
          score,
          reasons,
          deterministic,
        ]
      properties:
        patient_id: { type: string, format: uuid }
        clinical_id: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        sex: { type: string }
        birth_date: { type: string, format: date }
        phone_masked:
          type: string
          description: |
            The last four digits only. A duplicate warning is read at a desk with the patient
            standing in front of it, and whoever is beside them can read the screen too.
          examples: ['•••• 5678']
        district: { type: string }
        registered_at: { type: string, format: date-time }
        score:
          type: number
          minimum: 0
          maximum: 1
        reasons:
          type: array
          description: |
            Why, in the operator's language rather than in weights. "Same national ID" and
            "the name sounds the same and the birth year matches" call for different
            decisions, and a bare 0.71 calls for neither.
          items:
            type: object
            additionalProperties: false
            required: [code, message, message_bn]
            properties:
              code: { type: string }
              message: { type: string }
              message_bn: { type: string }
        deterministic:
          type: boolean
          description: True when this candidate blocks rather than warns.

    PatientMergeRequest:
      type: object
      additionalProperties: false
      required: [event_id, merged_id, decision, justification]
      properties:
        event_id:
          type: string
          format: uuid
          description: Client-generated. A retry of a merge that landed returns the original.
        merged_id:
          type: string
          format: uuid
          description: The record that will redirect. The survivor is the one in the path.
        score:
          type: number
          minimum: 0
          maximum: 1
          description: |
            What the matcher thought at the moment of the decision. Recorded alongside the
            decision because a merge performed against a low score is a person overruling the
            machine — legitimate, and exactly the case a reviewer will want to find.
        decision:
          type: string
          enum: [blocked_match, reviewed_match, manual]
        justification:
          type: string
          minLength: 10
          description: |
            Required, free text, and something a reviewer can act on. "Duplicate" is not a
            justification; "same NID, second registration at the outreach camp on 12 Aug" is.

    PatientMergeRecord:
      type: object
      additionalProperties: false
      required: [merged_id, score, decision, justification, merged_by, merged_at, event_id]
      properties:
        merged_id: { type: string, format: uuid }
        score: { type: number }
        decision: { type: string }
        justification: { type: string }
        merged_by: { type: string, format: uuid }
        merged_at: { type: string, format: date-time }
        event_id: { type: string, format: uuid }

    PatientRegistered:
      type: object
      additionalProperties: false
      required: [patient, event_id, duplicate]
      properties:
        patient:
          $ref: '#/components/schemas/Patient'
        event_id:
          type: string
          format: uuid
          description: The `PATIENT_REGISTERED` event, which is the request's own `event_id`.
        duplicate:
          type: boolean
          description: |
            True when this `event_id` had already been registered and nothing was created.
            The patient is the one the original registration produced.

    Patient:
      type: object
      additionalProperties: false
      required:
        [
          id,
          clinical_id,
          name_en,
          name_bn,
          sex,
          birth,
          phone_primary,
          phone_secondary,
          address,
          emergency_contact,
          socioeconomic,
          identifiers,
          status,
          registered_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        clinical_id:
          type: string
          description: |
            `DTHC-FRD-2026-000137` — the number spoken at a desk and printed on a card.
            Gapless within a facility and clinic year: a missing number means a missing
            person and is worth investigating.
          examples: [DTHC-FRD-2026-000137]
        name_en: { type: string }
        name_bn: { type: string }
        sex:
          type: string
          enum: [female, male, other]
        birth:
          type: object
          additionalProperties: false
          required: [date, precision, source, age]
          properties:
            date: { type: string, format: date }
            precision:
              type: string
              enum: [day, month, year]
            source:
              type: string
              enum:
                [
                  birth_certificate,
                  national_id,
                  passport,
                  immunisation_card,
                  patient_stated,
                  guardian_stated,
                  estimated,
                ]
            age:
              type: integer
              description: |
                Whole years today, by the clinic's calendar. When `precision` is not `day`
                this is approximate by up to a year, and a screen showing it must say so.
        phone_primary: { type: string }
        phone_secondary: { type: string }
        address:
          type: object
          additionalProperties: false
          properties:
            division: { type: string }
            district: { type: string }
            upazila: { type: string }
            address_line: { type: string }
            postcode: { type: string }
        emergency_contact:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
            relation: { type: string }
            phone: { type: string }
        socioeconomic:
          type: object
          additionalProperties: false
          description: |
            The cohorting baseline. An absent field was not captured; `unknown` was asked and
            not known.
          properties:
            education_level: { type: string }
            occupation_category: { type: string }
            income_band: { type: string }
            household_size: { type: integer }
            residence_type: { type: string }
            medicine_payer: { type: string }
        identifiers:
          type: array
          description: |
            Which identity numbers are on file, and their masks. Never the numbers: revealing
            one in full is a separate, step-upped act with its own audit entry.
          items:
            type: object
            additionalProperties: false
            required: [kind, masked]
            properties:
              kind:
                type: string
                enum: [national_id, birth_certificate, passport, driving_licence, other]
              masked:
                type: string
                examples: ['**** **** 6789']
        status:
          type: string
          enum: [active, inactive, deceased, merged]
          description: |
            A duplicate is `merged`, never deleted — a record that is removed takes its
            history with it.
        registered_at:
          type: string
          format: date-time

    BreakGlassAccess:
      type: object
      additionalProperties: false
      required:
        [
          id,
          user_id,
          active_role,
          scope_kind,
          scope_ref,
          justification,
          granted_at,
          expires_at,
          ended_at,
          end_reason,
          acknowledged_at,
          audit_seq,
        ]
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        active_role: { type: string }
        scope_kind: { type: string }
        scope_ref: { type: string }
        justification: { type: string }
        granted_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ended_at:
          type: [string, 'null']
          format: date-time
        end_reason: { type: string }
        acknowledged_at:
          type: [string, 'null']
          format: date-time
        audit_seq:
          type: [integer, 'null']
          format: int64

    BreakGlassList:
      type: object
      additionalProperties: false
      required: [accesses]
      properties:
        accesses:
          type: array
          items:
            $ref: '#/components/schemas/BreakGlassAccess'

    RoleCatalogue:
      type: object
      additionalProperties: false
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleDefinition'

    RoleDefinition:
      type: object
      additionalProperties: false
      required: [code, name_en, name_bn, is_clinical, station, permissions]
      properties:
        code:
          type: string
        name_en:
          type: string
        name_bn:
          type: string
        is_clinical:
          type: boolean
        station:
          type: string
          description: The role's station code, or empty.
        permissions:
          type: array
          items:
            type: string

    InviteRequest:
      type: object
      additionalProperties: false
      required: [employee_code, name_en, name_bn, roles]
      properties:
        employee_code:
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{1,15}$'
        name_en:
          type: string
        name_bn:
          type: string
        phone:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Set in person. Omit to leave the account invited.

    StatusChangeRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [active, suspended, deactivated]
        reason:
          type: string

    GrantRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string

    PasswordRequest:
      type: object
      additionalProperties: false
      required: [password, reason]
      properties:
        password:
          type: string
          minLength: 12
          maxLength: 128
        reason:
          type: string
          minLength: 3

    SessionsEnded:
      type: object
      additionalProperties: false
      required: [sessions_ended]
      properties:
        sessions_ended:
          type: integer
          minimum: 0

    Device:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          kind,
          status,
          enrolled_at,
          model,
          os_version,
          app_version,
          last_seen_at,
          status_changed_at,
          status_reason,
          created_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: What the clinic calls it. Unique within the facility.
        kind:
          type: string
          enum: [tablet, phone, desktop]
        status:
          type: string
          enum: [pending, active, suspended, revoked, lost]
          description: |
            `pending` → `active` → (`suspended` ↔ `active`) → `revoked` | `lost`. The last
            two are terminal.
        enrolled_at:
          type: [string, 'null']
          format: date-time
        model:
          type: string
          description: What the device said about itself. Display only.
        os_version:
          type: string
        app_version:
          type: string
          description: Kept current by every signed request.
        last_seen_at:
          type: [string, 'null']
          format: date-time
        status_changed_at:
          type: string
          format: date-time
        status_reason:
          type: string
        created_at:
          type: string
          format: date-time

    DeviceList:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    DeviceIssueRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        kind:
          type: string
          enum: [tablet, phone, desktop]

    DeviceEnrolmentIssued:
      type: object
      additionalProperties: false
      required: [device, code, expires_at]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        code:
          type: string
          description: |
            The one-time enrolment code, `XXXXX-XXXXX`, shown here and never again. Case,
            spaces and dashes are forgiven when it is typed.
          example: K7Q2M-9XWRD
        expires_at:
          type: string
          format: date-time

    DeviceEnrolRequest:
      type: object
      additionalProperties: false
      required: [code, public_key]
      properties:
        code:
          type: string
        public_key:
          type: string
          description: The device's new Ed25519 public key — 32 bytes, standard base64.
        model:
          type: string
          maxLength: 80
        os_version:
          type: string
          maxLength: 40
        app_version:
          type: string
          maxLength: 40

    DeviceEnrolResponse:
      type: object
      additionalProperties: false
      required: [device, key_id]
      properties:
        device:
          $ref: '#/components/schemas/Device'
        key_id:
          type: string
          format: uuid

    DeviceRotateKeyRequest:
      type: object
      additionalProperties: false
      required: [public_key]
      properties:
        public_key:
          type: string
          description: The replacement Ed25519 public key, 32 bytes, standard base64.

    DeviceKeyResponse:
      type: object
      additionalProperties: false
      required: [key_id]
      properties:
        key_id:
          type: string
          format: uuid

    DeviceEvent:
      type: object
      additionalProperties: false
      required: [kind, actor_id, detail, at]
      properties:
        kind:
          type: string
          enum:
            [
              enrolment_issued,
              enrolment_failed,
              enrolled,
              key_rotated,
              suspended,
              reinstated,
              revoked,
              lost,
              signature_refused,
              session_bound,
            ]
        actor_id:
          type: [string, 'null']
          format: uuid
        detail:
          type: object
          additionalProperties: true
        at:
          type: string
          format: date-time

    DeviceEventList:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/DeviceEvent'

    ReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          description: |
            The stored refresh token, for the `bearer` transport. A browser omits the body
            entirely; its credential is the cookie.

    CurrentUser:
      type: object
      additionalProperties: false
      required:
        [
          id,
          employee_code,
          name_en,
          name_bn,
          status,
          facility_id,
          roles,
          permissions,
          grants,
          second_factor,
        ]
      properties:
        id:
          type: string
          format: uuid
        employee_code:
          type: string
          example: JD_04
        name_en:
          type: string
          example: Amlan Roy
        name_bn:
          type: string
          example: অমলান রায়
        status:
          type: string
          enum: [invited, active, suspended, deactivated]
          description: |
            Only `active` can reach this endpoint — the others cannot hold a live session —
            but the field is present so a client never has to infer it.
        facility_id:
          type: string
          format: uuid
          description: |
            Which clinic this person works at. The client needs it for one thing: the
            realtime gateway's topics are facility-scoped, so a screen watching the traffic
            board has to name `queue:{facility_id}` to subscribe (CP40).
        roles:
          type: array
          items:
            type: string
            example: JUNIOR_DOCTOR
          description: |
            Role codes, not names. One person may hold several at once [R-02]: the same
            assistant enters a blood pressure and then switches to anthropometry.
        permissions:
          type: array
          items:
            type: string
            example: observation.write.vitals
          description: |
            The union across every live role, as `resource.action.scope`.

            For hiding what the operator cannot do. **Not a control** — every route,
            service and serialiser is guarded server-side by the same catalogue (CP20).
        grants:
          type: array
          items:
            $ref: '#/components/schemas/RoleGrant'
          description: |
            Which role confers which permissions, one entry per live role. An interface
            that scopes itself to one role [R-02] reads this entry's permissions and sends
            the role as `X-Active-Role`, so what it shows is what the server will allow.

        second_factor:
          $ref: '#/components/schemas/SecondFactorStatus'

    RoleGrant:
      type: object
      additionalProperties: false
      required: [role, permissions]
      properties:
        role:
          type: string
          example: PHYSICIAN
        permissions:
          type: array
          items:
            type: string
        station:
          type: string
          example: STN_ANTHROPOMETRY
          description: |
            Where this role works in the patient journey, when it works one. The station app
            needs it: an operator's queue is their station's queue, and a screen that asks
            them to choose is a screen where somebody calls a patient to the wrong room.
            Absent for the administrative roles, which work no station.

    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, user_agent, issued_at, last_seen_at, current]
      properties:
        id:
          type: string
          format: uuid
        user_agent:
          type: string
          description: |
            Enough for a person to recognise a device. Truncated, and deliberately not an
            address.
        issued_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
          description: |
            Written at most once a minute. Every authenticated request updating a row would
            make a read-mostly path the busiest write in the clinic.
        current:
          type: boolean
          description: |
            True for the session making this request, so the screen can say "this device"
            rather than inviting somebody to end the one they are reading it on.

    SessionList:
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'

    LogoutEverywhereResponse:
      type: object
      additionalProperties: false
      required: [ended]
      properties:
        ended:
          type: integer
          minimum: 0
          description: The number of sessions revoked, including the one that asked.

    LivenessResponse:
      type: object
      title: LivenessResponse
      required: [status, service, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          description: Which binary answered. One of api, worker, realtime, migrate.
          examples: [api]
        version:
          type: string
          examples: [0.1.0-dev]

    ReadinessResponse:
      type: object
      title: ReadinessResponse
      required: [status, service, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, unready]
        service:
          type: string
          examples: [api]
        version:
          type: string
          examples: [0.1.0-dev]
        checks:
          type: object
          description: |
            One entry per declared dependency. A status word only — never the underlying
            error, which may carry a host, a user name or a password.
          additionalProperties:
            type: string
            enum: [ok, unavailable]
          examples:
            - postgres: ok
              redis: ok
              blobstore: unavailable

    VersionResponse:
      type: object
      title: VersionResponse
      required: [service, version, commit, build_time]
      additionalProperties: false
      properties:
        service:
          type: string
          examples: [api]
        version:
          type: string
          examples: [0.1.0]
        commit:
          type: string
          description: The git commit this binary was built from, or `unknown` locally.
        build_time:
          type: string
          description: RFC 3339 build timestamp, or `unknown` locally.

  responses:
    BadRequest:
      description: The request could not be understood. `BAD_REQUEST`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: BAD_REQUEST
              kind: validation
              message: The request could not be understood.
              message_bn: অনুরোধটি বোঝা যায়নি।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Unauthenticated:
      description: No valid session. `UNAUTHENTICATED`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHENTICATED
              kind: auth
              message: Please sign in again.
              message_bn: অনুগ্রহ করে আবার সাইন ইন করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Forbidden:
      description: |
        The caller may not do this. `FORBIDDEN`.

        Deliberately **identical whether the resource is missing or merely forbidden**.
        Telling a caller that a patient exists but is out of reach is itself a
        disclosure.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: FORBIDDEN
              kind: auth
              message: You do not have permission to do that.
              message_bn: এই কাজটি করার অনুমতি আপনার নেই।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    StepUpRequired:
      description: |
        The caller may do this, but must first confirm their second factor. `STEP_UP_REQUIRED`.

        Distinct from `FORBIDDEN` on purpose: the right response is to ask for a code, not to
        say no. Mint a token at `/v1/auth/step-up` for this endpoint's purpose and retry with
        `X-Step-Up-Token`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: STEP_UP_REQUIRED
              kind: auth
              message: Please confirm with your authenticator code to continue.
              message_bn: চালিয়ে যেতে আপনার অথেন্টিকেটর কোড দিয়ে নিশ্চিত করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    DeviceRequired:
      description: |
        The caller is signed in but this request did not come from an enrolled clinic
        device, and the action needs one. `DEVICE_REQUIRED`.

        Distinct from `FORBIDDEN`: the person may do this — from a tablet. A browser session
        gets this on every clinical write (D-46).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: DEVICE_REQUIRED
              kind: auth
              message: This action must be done from an enrolled clinic device.
              message_bn: এই কাজটি ক্লিনিকের নিবন্ধিত ডিভাইস থেকে করতে হবে।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    NotFound:
      description: No such resource, or none the caller may see. `NOT_FOUND`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: NOT_FOUND
              kind: not_found
              message: Not found.
              message_bn: পাওয়া যায়নি।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Conflict:
      description: |
        The request contradicts current state. `CONFLICT`.

        Two idempotency outcomes share this status and are told apart by their code
        (CP24):

        - `IDEMPOTENCY_KEY_REUSED` — the key was already used for a *different* request.
          A client bug: keep one key per attempt, and mint a new one for a new action.
        - `IDEMPOTENCY_IN_PROGRESS` — the first attempt with this key is still running.
          Wait a moment and retry; the same key will then be answered from the store.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: CONFLICT
              kind: conflict
              message: This conflicts with a change someone else made.
              message_bn: অন্য কেউ পরিবর্তন করায় দ্বন্দ্ব তৈরি হয়েছে।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    PayloadTooLarge:
      description: The request body exceeds the configured limit. `PAYLOAD_TOO_LARGE`.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              kind: validation
              message: The request is too large.
              message_bn: অনুরোধটি অনেক বড়।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    ValidationFailed:
      description: |
        One or more values failed a rule. `VALIDATION_FAILED`, with `fields` naming
        each one.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_FAILED
              kind: validation
              message: Some values need correcting.
              message_bn: কিছু তথ্য সংশোধন করতে হবে।
              fields:
                date_of_birth: A date of birth cannot be in the future.
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    RateLimited:
      description: Too many requests. `RATE_LIMITED`. Implemented at CP49.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: RATE_LIMITED
              kind: validation
              message: Too many requests. Please slow down.
              message_bn: অনেক বেশি অনুরোধ। একটু ধীরে চেষ্টা করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Internal:
      description: |
        The system failed. `INTERNAL`. The cause is logged against the correlation ID
        and never returned.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: INTERNAL
              kind: technical
              message: Something went wrong. The team has been notified.
              message_bn: কিছু একটা সমস্যা হয়েছে। বিষয়টি জানানো হয়েছে।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Unavailable:
      description: Temporarily unable to serve. `UNAVAILABLE`. Retryable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAVAILABLE
              kind: technical
              message: The service is temporarily unavailable. Please try again.
              message_bn: সেবাটি সাময়িকভাবে বন্ধ আছে। আবার চেষ্টা করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d

    Timeout:
      description: The request took too long. `TIMEOUT`. Retryable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: TIMEOUT
              kind: technical
              message: The request took too long. Please try again.
              message_bn: অনুরোধটি সম্পন্ন হতে বেশি সময় নিচ্ছে। আবার চেষ্টা করুন।
              correlation_id: 0198c4e2-7f3a-7000-8c1d-2b4e6a8f0c3d
