        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/stations/{station}/call-next:
    post:
      operationId: callNextPatient
      tags: [Queue]
      summary: Claim the next patient
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: station
          in: path
          required: true
          schema: { type: string, pattern: '^STN_[A-Z_]+$' }
      description: |
        Needs `visit.attend`.

        **Exactly one operator gets any given patient.** The claim selects one waiting row
        under `FOR UPDATE SKIP LOCKED`: the first caller locks the head of the queue and takes
        it; a second calling in the same millisecond does not block behind it and does not get
        the same row — it skips to the next waiting patient. Which is what the second operator
        wanted: *a* patient, not *that* patient.

        `204` when nobody is waiting. An operator who is free and finds an empty queue has not
        made a mistake, and a screen that shows an error for it is a screen operators learn to
        ignore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id]
              properties:
                event_id: { type: string, format: uuid }
      responses:
        '200':
          description: The patient, now called.
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry:
                    $ref: '#/components/schemas/QueueEntry'
        '204':
          description: Nobody is waiting.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
