  /v1/patients:
    get:
      operationId: searchPatients
      tags: [Patients]
      summary: Find a patient
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
          description: |
            A clinical id, a telephone number, or a name in either script. One query with
            four ways in; which route found the row does not change the answer's shape, only
            its `rank`.

            Names are matched forgivingly, including across romanisation: searching
            "Muhammad Raheem" finds a patient registered as "Mohammad Rahim". An empty `q`
            returns nothing rather than the register — "who is here today" is
            `/v1/patients/today`, which has its own index.
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: |
            Capped at 100 — not for speed, but because a search endpoint that returns two
            thousand rows is a bulk export with a different name.
        - name: include_merged
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            Bring records that now redirect into the results. Off by default: a station
            looking for today's patient does not want yesterday's duplicate.
      description: |
        Needs `patient.read.demographics`. Scoped to the caller's facility.

        **Searches are audited** as `patient.searched`, **without the term** — the term is a
        patient's name, and a name in the audit trail is PHI in a table administrators read.
        What is recorded is that a search happened, how it was framed, and how many rows came
        back, which is what a bulk-search pattern actually looks like.

        Telephone numbers come back masked.
      responses:
        '200':
          description: The matches, best first.
          content:
            application/json:
              schema:
                type: object
                required: [patients, page]
                properties:
                  patients:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientSearchResult'
                  page: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: registerPatient
      tags: [Patients]
      summary: Register a patient
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActiveRole'
      description: |
        Needs `patient.write.demographics`.

        One transaction: the clinical id is drawn from the facility-year counter, the patient
        row is written, each identity number is hashed and sealed, the anonymised research
        subject and its link are created, `PATIENT_REGISTERED` is appended to the ledger and
        the read model is updated. Any failure leaves nothing behind, including the clinical
        id — the series stays gapless.

        **Re-submission.** `event_id` is generated by the client and is the idempotency key.
        Sending the same one again returns `200` with the original patient and
        `duplicate: true`; nothing is created. A first registration returns `201`. A client
        reconciling an offline queue can therefore count its `201`s.

        **Validation.** Every failing field is reported at once, not the first one, and each
        message appears in both `fields` and `fields_bn` — a desk that fixes one field,
        resubmits and is told about the next holds a queue four times over.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistration'
      responses:
        '201':
          description: The patient was registered.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRegistered'
        '200':
          description: |
            This `event_id` was already registered. The original patient is returned and
            nothing was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientRegistered'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/today:
    get:
      operationId: listTodaysPatients
      tags: [Patients]
      summary: Who is here today
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      description: |
        Needs `patient.read.demographics`. Everybody registered on the clinic's current day —
        Asia/Dhaka, not UTC, or the list disagrees with the wall clock for six hours every
        morning.

        Its own endpoint and its own index because it is the most frequent read in the
        building and must never become a scan. Deliberately **not** audited: this is the
        screen every station leaves open all day, and recording it would fill the trail with
        one line per refresh and bury the searches that matter.
      responses:
        '200':
          description: Today's patients, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [patients, total]
                properties:
                  patients:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientSearchResult'
                  total: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/check-duplicates:
    post:
      operationId: checkPatientDuplicates
      tags: [Patients]
      summary: Is this person already registered?
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActiveRole'
      description: |
        A query rather than a mutation, sent as a `POST` because the probe carries the
        patient's name, telephone number and date of birth, and personal data does not belong
        in a URL. It still carries an `Idempotency-Key` like every other `POST` under `/v1`:
        the rule is worth more without exceptions than the two rows a day it costs. Mint a
        **fresh key for each call** — the desk calls this repeatedly as it types, each time
        with a different body, and reusing a key across different bodies is what `409` means.

        Needs `patient.write.demographics` — it answers a question for somebody about to
        create a record, and it returns names and dates of birth, so a reader with no reason
        to register has no reason to probe the register with arbitrary names.

        Takes the same body as `POST /v1/patients` and is called **while the desk is still
        typing**, so a partial form is normal: only the fields present are used.

        Two passes with different characters. The **deterministic** one — an identity number
        already on file, or the same mobile and the same exact date of birth — returns
        `verdict: blocked` and the one record it found; registration will be refused. The
        **probabilistic** one returns `verdict: review` with a scored list for a person to
        look at; registration is *not* refused, because a register in Bangladesh legitimately
        contains many people of the same name born in the same year, and a matcher that
        refused them all would train the desk to ignore it.

        Nothing is ever merged automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientRegistration'
      responses:
        '200':
          description: The verdict and any candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateMatch'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

