  /v1/board/reroute/{entryId}:
    post:
      operationId: rerouteFromBoard
      tags: [Queue]
      summary: Move a waiting patient to another station
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `visit.reroute` — a floor supervisor's permission, not a station operator's.
        Rerouting is deciding somebody else's queue is wrong.

        The patient leaves one queue and joins another in **one transaction**. Half a reroute
        is a patient standing in no queue at all, invisible to the board, which is precisely
        the failure the board exists to prevent.

        A retry with the same `event_id` answers `409`: the entry is no longer live because the
        first call moved it. Both of the reroute's ledger entries have ids derived from the
        `event_id`, so a retry cannot write a second arrival.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardRerouteRequest'
      responses:
        '200':
          description: Moved. The entry returned is the patient's new place in the destination queue.
          content:
            application/json:
              schema:
                type: object
                required: [entry]
                properties:
                  entry:
                    $ref: '#/components/schemas/QueueEntry'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/batch:
    post:
      operationId: recordObservationBatch
      tags: [Observations]
      summary: Record a station's whole form in one transaction
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: |
        An anthropometry entry is six measurements and four derived values. Ten round trips
        over clinic wifi is ten chances to lose one, and the entry is meant to take under
        thirty seconds — most of which should be the operator handling a tape measure.

        **One transaction, not one event.** Six measurements are six facts and the ledger
        records six of them, each with its own `event_id`, its own idempotency and its own
        attribution. What the transaction buys is that the record never holds three of six.

        The per-code permission is still checked **per value, against the active role**. A
        batch is not a way around that: an operator wearing the anthropometry hat cannot
        record a blood pressure by putting it in a list with five heights.

        `derive` names values the **server** computes once the measurements have landed,
        from what it has just written. A derivation whose inputs are not on record is
        skipped rather than failing the batch — a waist with no hip is an ordinary
        half-finished entry, not a reason to throw away five good measurements.

        Retrying is safe. Each observation carries its own `event_id`; the derived values'
        ledger ids are seeded from the batch's `event_id`, so a tablet that lost the reply
        and pressed save again writes the same values rather than a second BMI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationBatchRequest'
      responses:
        '201':
          description: |
            Everything written, in the order it was written: the measurements first, in the
            order given, then the derived values in the order named.
          content:
            application/json:
              schema:
                type: object
                required: [observations]
                properties:
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'
                  alerts:
                    type: array
                    description: |
                      Critical values this write raised (CP50). Present only when there are
                      any. They travel back in the write's own response rather than on the
                      realtime socket, because the alarm has to sound in the hand that typed
                      the number and the only thing certain to arrive there is the reply to
                      the write the operator just made.
                    items:
                      $ref: '#/components/schemas/CriticalAlert'
                  escalate_verbally:
                    type: boolean
                    description: |
                      True when at least one of those alerts reached **no live screen**. The
                      operator must be told, in words, to go and find somebody — which in a
                      building whose Wi-Fi has just failed is the only escalation path that
                      still works. Computed server-side rather than left to each client: an
                      undelivered alert is exactly the situation in which a screen must not be
                      trusted to do its own reasoning.
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/answers:
    get:
      operationId: listObservationAnswers
      tags: [Observations]
      summary: The answers a coded observation may take
      description: |
        The vocabulary (CP51). Until this endpoint existed, a `coded` observation meant only
        that `value_code` was not empty — so `absent`, `Absent` and `not felt` were three
        findings as far as any query was concerned, and the research extract would have held
        all three with no way to tell they were the same one.

        Now the answers are data, a database trigger enforces them, and a station app fetches
        the whole set once and renders it as buttons. That is not only tidier: it is what makes
        a complete diabetic foot examination — ten monofilament sites, four pulses, deformity,
        skin and ulcer grade, on both feet — fit into the two minutes CP51 asks for.

        Ordered by `ordering`, which is **clinical** order rather than alphabetical: "present,
        diminished, absent" is a scale, and a screen that sorted it alphabetically would put
        absent first and make every examiner read the list twice.

        `is_normal` marks the answer that means nothing abnormal, so a screen can pre-select it
        and a report can count abnormal findings without a list of magic strings in three
        places.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: Every vocabulary, grouped by code and in clinical order.
          content:
            application/json:
              schema:
                type: object
                required: [answers]
                properties:
                  answers:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObservationAnswer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/codes:
    get:
      operationId: listObservationCodes
      tags: [Observations]
      summary: The observation code registry
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      description: |
        Needs `observation.read.values`.

        What every kind of measured value *is*: its category, its shape, the dimension of its
        unit, its plausibility band, and which permission recording it needs. Reference data,
        no patient in it.

        Fetched **once** by a station app on start-up and used to validate every entry for the
        rest of the clinic session, offline. That is why it is one call and not one per code.

        `loinc` is empty where the code is not known. An empty code is honest; a guessed one
        is a mapping error that surfaces years later in somebody else's system.
      responses:
        '200':
          description: The registry.
          content:
            application/json:
              schema:
                type: object
                required: [codes]
                properties:
                  codes:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObservationCode'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/derive:
    post:
      operationId: deriveObservation
      tags: [Observations]
      summary: Compute a derived value from what is on record
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: |
        The server computes; the client does not send a number.

        A client-computed value posted here would make the client authoritative about a
        clinical value, and "it uses the same library" does not fix that — an old app build, a
        modified one, or a request assembled by hand would all be accepted. `@dthcms/clinical-calc`
        exists so an operator sees a BMI the instant they type a height and a weight (P-4);
        this endpoint is what makes the server's copy the one the record holds. The two are
        proven identical by shared fixtures in CI.

        The stored value carries **which formula, which version, and what it was given**. The
        version matters: CKD-EPI was revised in 2021 to remove a race coefficient, and a
        stored eGFR without a version cannot afterwards be told apart from one computed under
        the old equation. The inputs are stored rather than re-derived because they are what
        the formula actually saw — a weight corrected an hour later does not change what a BMI
        was computed from.

        `422` with `what` means either that the inputs are not on record yet or that the
        equation refused them. Those are different sentences, and the message says which.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_id, patient_id, what]
              properties:
                event_id: { type: string, format: uuid }
                patient_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                what:
                  type: string
                  enum: [BMI, WHR, BSA, BMR, IBW, EGFR, PACK_YEARS, FOOT_RISK_LEFT, FOOT_RISK_RIGHT]
      responses:
        '201':
          description: Computed and recorded.
          content:
            application/json:
              schema:
                type: object
                required: [observation]
                properties:
                  observation:
                    $ref: '#/components/schemas/Observation'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/growth-curves:
    get:
      operationId: growthCurves
      tags: [Observations]
      summary: The reference growth curves, for plotting
      description: |
        The published percentile lines — 3rd, 15th, 50th, 85th, **95th** and 97th — computed
        from the same seeded parameters as a patient's own point, so a plotted child and the
        lines behind them can never come from different tables.

        Its own endpoint rather than part of the patient's growth, because these are published
        tables: identical for every child in the world, fetched once and cached for the
        session. Sending eight hundred points with every chart would be eight hundred points
        of patient response that are not about the patient.

        The 95th is in the set because [R-06] flags childhood obesity at it, and a threshold
        with no line on the chart is a threshold nobody can see a child approaching.

        `standards` says which reference covers which age span, so the chart can **draw where
        the reference changes** rather than pretending one curve runs the whole way. That is
        D-21's explicit requirement: a percentile computed under WHO and one computed under
        CDC are not the same measurement.
      parameters:
        - name: indicator
          in: query
          required: true
          schema: { type: string, enum: [HFA, WFA, BFA] }
          description: Height-, weight- or BMI-for-age.
        - name: sex
          in: query
          required: true
          schema: { type: string, enum: [male, female] }
        - name: from_months
          in: query
          schema: { type: number, default: 0 }
        - name: to_months
          in: query
          schema: { type: number, default: 240.5 }
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The lines, oldest age first.
          content:
            application/json:
              schema:
                type: object
                required: [curves]
                properties:
                  curves:
                    $ref: '#/components/schemas/GrowthCurveSet'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/plausibility:
    get:
      operationId: listPlausibilityRules
      tags: [Observations]
      summary: The plausibility rules a station app applies as the operator types
      description: |
        The server checks these on every write and is authoritative. This endpoint exists so
        the **warning arrives in time to matter**: a refusal that comes back after the save
        button is a refusal that comes back after the patient has stood up, and the whole
        point of the check is that a typing error can still be re-measured.

        Fetched once on start-up and applied offline for the rest of the clinic session, like
        the code registry.

        **Ordered most specific first**, in exactly the order the server resolves them. The
        rule that applies is therefore "the first one in this list whose predicate matches",
        and a client never ranks anything — a client that reimplemented the specificity
        ranking would one day show an operator one band and be refused by another.

        `approved` is false for a band no clinician has signed off on yet. The seeded values
        are proposals; an interface that presented them as settled would overstate what
        anybody has agreed to.
      responses:
        '200':
          description: Every rule, most specific first.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlausibilityRule'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/alerts:
    get:
      operationId: listOpenAlerts
      tags: [Alerts]
      summary: Critical values nobody has answered yet
      description: |
        The consultant's priority surface (CP50, §4.4): everything unacknowledged in this
        facility, newest first, whatever queue the patient is standing in.

        This is the **pull** half of the design. The realtime gateway pushes
        `critical_value.raised` the moment an alert is raised, and a client re-reads this
        endpoint on every reconnect — because the socket is a nicety and the pull is the
        truth. A dashboard that trusted only the socket would go quiet after a dropped
        connection and look exactly like a clinic with nothing wrong in it.

        Deliberately not paginated. A list long enough to need paging is a clinic in trouble,
        and the answer to that is not pagination.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Every open alert, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/CriticalAlert'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/alerts/rules:
    get:
      operationId: listCriticalValueRules
      tags: [Alerts]
      summary: The critical-value thresholds
      description: |
        What counts as a value somebody has to act on now. Reference data: a station app
        fetches it once and evaluates locally, so the alarm sounds in the operator's hand at
        the instant they type — on a phone that may have no signal at all.

        Ordered most specific first, in exactly the order the server resolves. The rule that
        applies is the first match; a client never ranks anything itself. A phone that ranked
        them could sound an alarm the server did not raise, or — far worse — stay quiet when
        the server did.

        `approved` is **false on every row**. D-27 is open and blocking: the critical-value
        table and the escalation chain are the clinical lead's to author. What is not
        provisional is the mechanism — raising, delivery, acknowledgement, escalation and the
        audit trail are built and tested, and D-27 changes rows rather than code.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: Every threshold, most specific first.
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/CriticalValueRule'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/alerts/escalation:
    get:
      operationId: listEscalationChain
      tags: [Alerts]
      summary: Who is told when nobody answers
      description: |
        Acknowledge-or-escalate, as data. Step 1 is immediate; each later step waits longer
        than the one before it.

        The last step names **no role**, and that is the design rather than a gap: when the
        consultant and the junior doctor have both had five minutes, the remaining escalation
        is a person walking to another person, so the step tells the operator who entered the
        value to go and find somebody. A chain whose final link is another notification has no
        end.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The chain, in order.
          content:
            application/json:
              schema:
                type: object
                required: [steps]
                properties:
                  steps:
                    type: array
                    items:
                      $ref: '#/components/schemas/EscalationStep'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/alerts/{id}:
    get:
      operationId: getAlert
      tags: [Alerts]
      summary: One critical value
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The alert.
          content:
            application/json:
              schema:
                type: object
                required: [alert]
                properties:
                  alert:
                    $ref: '#/components/schemas/CriticalAlert'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/alerts/{id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [Alerts]
      summary: Take a critical value, and stop it escalating
      description: |
        The act that stops the chain. Deliberately **not** available to the officer who
        entered the value: they already know — the alarm sounded in their hand — and a clinic
        where the person who typed the number can close their own alert is a clinic that can
        clear its board without a clinician ever seeing one.

        The note is required and is not paperwork. "Seen" is not an acknowledgement; "giving
        oral glucose, rechecking in 15" is, and the next person to open the record needs the
        second one — at the moment when nobody has time to write it down twice.

        A second acknowledgement answers **409** with the alert attached, so the screen can
        say who has it. Two clinicians reaching for the same alert is the system working.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 3
                  description: What is being done about it.
                  example: Giving oral glucose, rechecking in 15 minutes.
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema:
                type: object
                required: [alert]
                properties:
                  alert:
                    $ref: '#/components/schemas/CriticalAlert'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Somebody else acknowledged it first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                  alert:
                    $ref: '#/components/schemas/CriticalAlert'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/reference-ranges:
    get:
      operationId: listReferenceRanges
      tags: [Observations]
      summary: What is normal, per code and age band
      description: |
        Three different things a number can be outside, and they are not the same:

        - **plausibility** (`/v1/observations/plausibility`) — outside it, the number is a
          typing error;
        - **the reference range**, here — outside it, the number is worth a second look;
        - **critical** (CP50) — outside it, somebody has to act now.

        Conflating the second with the third is how a clinic ends up ignoring both. A value
        outside a range here turns a field amber. Nothing on this endpoint alerts anybody.

        Fetched once and applied offline for the session, ordered most specific first — the
        range that applies is the first match, and a client never ranks anything itself.

        `approved` is false for every seeded range. The plan is explicit that normal ranges
        per age band need clinical confirmation, and an interface that presented them as
        settled would overstate what anybody has agreed to.
      responses:
        '200':
          description: Every range, most specific first.
          content:
            application/json:
              schema:
                type: object
                required: [ranges]
                properties:
                  ranges:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReferenceRange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/units:
    get:
      operationId: listUnits
      tags: [Observations]
      summary: Units and their dimensions
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      description: |
        Needs `observation.read.values`. Two units convert into each other if and only if they
        share a dimension — that is the whole of the conversion rule, and this is the list.

        The conversion factors are deliberately **not** returned. Conversion happens in the
        database, once, so that a client cannot arrive at a different canonical value from the
        one that will be stored.
      responses:
        '200':
          description: Every unit.
          content:
            application/json:
              schema:
                type: object
                required: [units]
                properties:
                  units:
                    type: array
                    items:
                      $ref: '#/components/schemas/MeasurementUnit'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/rooms:
    get:
      operationId: listCounselingRooms
      tags: [Counseling]
      summary: The rooms counselling walks through
      description: |
        §5.2's sequence, as data: Counseling Room, then Nutrition Room, then Insulin Corner —
        "sequence configurable", so it is rows and not code.

        A station app fetches this once and groups its screen by room, because the grouping *is*
        the flow: a counsellor works through one room's items, walks the patient to the next, and
        the screen should follow them rather than making them hunt.

        `station_code` says which queue a room belongs to, where it has one. The insulin corner
        is part of the counselling station rather than a station of its own — a room claiming to
        be a station would appear on the traffic board as a queue nobody is ever called to.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The rooms, in the configured sequence.
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingRoom'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/assignments:
    get:
      operationId: listCounselingAssignments
      tags: [Counseling]
      summary: Which diagnosis calls for which checklist
      description: |
        Keyed on a **coding**, not on a word. A rule saying "diabetes" would miss `E11.65` and
        match a complaint of diabetes insipidus, and the mistake would surface as a counsellor
        asking the wrong seven questions.

        `code_prefix` is why this is not a foreign key to one concept: ICD-10 groups a family
        under `E11`, and a rule per member would be sixteen rows that drift apart. A prefix says
        what a clinician means — "type 2 diabetes, any of it".

        Supply `system`, `version` and `code` to ask the other question — *what would this
        diagnosis get* — which is what starting a session does, and what an author checking their
        own rule wants. Only published versions come back: a draft is not something to hand a
        counsellor.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: system
          in: query
          schema: { type: string, example: ICD10 }
        - name: version
          in: query
          schema: { type: string, example: '2019' }
        - name: code
          in: query
          schema: { type: string, example: E11.9 }
      responses:
        '200':
          description: |
            Every live rule, or — when a coding was supplied — the templates it calls for, best
            first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingAssignment'
                  matches:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingMatch'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/templates:
    get:
      operationId: listCounselingTemplates
      tags: [Counseling]
      summary: Every checklist, with the version a new session would get
      description: |
        Templates with no published version are listed too. They are drafts in progress, and an
        author who cannot see their own unpublished work has no way back to it.

        `approved_at` is null until a clinician signs off on the content. **D-53 is open**: the
        seeded diabetes items are transcribed from §5.1 and are the launch minimum, not a
        clinical author's list. The field is reported rather than hidden so that no interface
        presents a proposal as settled.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: Every template.
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingTemplate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

    post:
      operationId: createCounselingTemplate
      tags: [Counseling]
      summary: Start a new checklist
      description: |
        Criterion 1: a physician authors and publishes a template without a code change.

        Creates the template together with its first draft version, because a template with no
        versions is a row that cannot be edited or published and looks, in every listing, like a
        mistake.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, title_en, title_bn]
              properties:
                code:
                  type: string
                  description: |
                    Stable and upper-case, e.g. `THYROID`. It is what an assignment rule and an
                    audit entry name, so it does not change with the title.
                  example: THYROID
                title_en: { type: string }
                title_bn: { type: string }
      responses:
        '201':
          description: The template and its first draft.
          content:
            application/json:
              schema:
                type: object
                required: [template]
                properties:
                  template:
                    $ref: '#/components/schemas/CounselingTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That `Idempotency-Key` belongs to another attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/templates/{templateId}:
    get:
      operationId: listCounselingVersions
      tags: [Counseling]
      summary: Every revision of one checklist
      description: |
        Newest first. `published_source` says whether a person published a version or a
        migration did — the seeded diabetes template says `MIGRATION`, because no person
        published it, and an invented user id there would be the only attribution in this system
        naming somebody who did not do the thing.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/templates/{templateId}/versions:
    post:
      operationId: draftCounselingVersion
      tags: [Counseling]
      summary: Open a new draft
      description: |
        The only way to change a published checklist.

        It copies the current published version's items, because that is what an author almost
        always wants: a new version exists to change one thing. Starting empty would mean
        retyping seven items to fix a typo in one, and a system that makes the safe path
        expensive gets the unsafe one instead.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  description: Why this revision exists. Read by whoever compares two versions.
      responses:
        '201':
          description: The new draft, with the copied items.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    $ref: '#/components/schemas/CounselingVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That `Idempotency-Key` belongs to another attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/templates/{templateId}/versions/{version}:
    get:
      operationId: getCounselingVersion
      tags: [Counseling]
      summary: One revision, with its items
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The version and its items, in working order.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    $ref: '#/components/schemas/CounselingVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

    put:
      operationId: saveCounselingDraft
      tags: [Counseling]
      summary: Save a draft's items
      description: |
        Replaces the draft's items wholesale with the list sent. The authoring screen sends what
        it is showing; a patch-style update would leave the stored version disagreeing with the
        screen the author is looking at, and the way that surfaces is somebody publishing an item
        they thought they had deleted — on a checklist a counsellor then reads to a patient.

        **Half-written is allowed.** An item with English text and no Bengali is a normal state
        for somebody mid-sentence, and refusing it would make this screen fight the person using
        it. The bilingual requirement is criterion 4 and is checked at the publish transition
        instead — by this API and, for every path that is not this API, by a database trigger.

        A published version answers `409`. That is not an error to work around: draft a new
        version. Editing a published one rewrites what past sessions were asked to cover, and
        nothing would look wrong afterwards.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                notes: { type: string }
                items:
                  type: array
                  items:
                    $ref: '#/components/schemas/CounselingItemDraft'
      responses:
        '200':
          description: The draft as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    $ref: '#/components/schemas/CounselingVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            That version is published and cannot be edited. Draft a new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/templates/{templateId}/versions/{version}/publish:
    post:
      operationId: publishCounselingVersion
      tags: [Counseling]
      summary: Put a checklist on the floor, and freeze it
      description: |
        Its own endpoint, its own permission and its own step-up, because it is not the same act
        as saving. Saving a draft is cheap and reversible; publishing puts a checklist on every
        phone on the floor within seconds, **freezes it forever**, and retires whatever was there
        before. A physician who meant to fix a typo must not be able to accidentally do the other
        thing.

        The retire-and-publish happens in one statement, so there is no instant in which a clinic
        has two live checklists or none.

        Refused unless **every item reads in both languages** (criterion 4) and the version has at
        least one item — an empty checklist on a phone is a checklist that reads as complete the
        moment it opens. Both are checked here and again by a database trigger.

        Audited. This is the act that changes what every counsellor asks every patient from this
        second onwards.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/StepUpToken'
        - name: templateId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: version
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The version, now published and frozen.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version:
                    $ref: '#/components/schemas/CounselingVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That version is already published, or has been retired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/sessions:
    post:
      operationId: startCounselingSession
      tags: [Counseling]
      summary: Open a checklist for the patient in the room
      description: |
        Opens a session against the version that is published **now**, and records that version on
        the session. A checklist republished while a counsellor is halfway down it does not change
        what this patient was asked about (CP55 criterion 2).

        Idempotent by design rather than by accident: a phone that lost the reply and pressed start
        again lands back in the session it already has, answered `200` instead of `201`. A second
        half-ticked copy of the same list is how two counsellors each cover half of it and each
        believe the other did the rest.

        Refused with `422` when the checklist has no published version. A draft is not something to
        hand somebody on the floor.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [patient_id, visit_id, template_id]
              properties:
                event_id:
                  type: string
                  format: uuid
                  description: |
                    The client's, so a retry after a lost reply writes the same session rather than
                    a second one. Offline ticking queues events with ids generated on the device.
                patient_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                template_id: { type: string, format: uuid }
      responses:
        '200':
          description: The session that was already open for this visit and checklist.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/CounselingSession'
        '201':
          description: A new session, against the version published now.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/CounselingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `IDEMPOTENCY_KEY_REUSED`: that event id was written with a different body. A start
            that simply arrived twice is not a conflict — it is answered `200` with the session
            already open.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/sessions/{sessionId}:
    get:
      operationId: getCounselingSession
      tags: [Counseling]
      summary: One session, its frozen list, its ticks and what is missing
      description: |
        The session with the items of the version it is walking, every tick made on it — withdrawn
        ones included, because "ticked at 11:02 and taken back at 11:04" is an answer rather than the
        absence of one — and the mandatory items still outstanding.

        `outstanding` comes from the same database function CP57's gate reads. A second
        implementation of "what is still missing" is how a phone shows a green tick while a gate
        refuses the patient standing in front of it.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/CounselingSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/sessions/{sessionId}/ticks:
    post:
      operationId: tickCounselingItem
      tags: [Counseling]
      summary: Cover one item
      description: |
        One item, one request, one event, one actor. **This endpoint is acceptance criterion 1.**

        There is deliberately no endpoint that ticks a list. A `PUT /ticks` taking seven codes would
        attribute seven acts to one press, and §5.4's method — the physician asking the patient what
        they were told about injection sites, and then looking at who told them — would have no
        answer. The cost is paid where it is cheapest: each tick is a small request a phone can
        retry, carrying a client-generated event id so a lost reply does not double-tick.

        Re-ticking an item that was taken back is allowed and lands on the same row, by whoever
        ticked it this time. The un-tick stays in the ledger and the row remembers how often it has
        happened.

        Refused with `422` for an item the session's frozen version does not contain — a client
        holding a list from before a republish — and with `409` for a session somebody has closed.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item_code]
              properties:
                event_id: { type: string, format: uuid }
                item_code: { type: string, maxLength: 60 }
                note:
                  type: string
                  maxLength: 500
                  description: |
                    §5.3's optional per-item note: what this counsellor wants the physician to know
                    about this item for this patient. Optional because most items have nothing to
                    add, and a required note is a note people fill with a full stop.
      responses:
        '200':
          description: The session, with the tick on it.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/CounselingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Three different facts, told apart by `code` because a client can only branch on a
            code: `COUNSELING_ITEM_ALREADY_COVERED` (somebody has covered that item — re-read the
            session to see who and when), `COUNSELING_SESSION_FINISHED`, or
            `IDEMPOTENCY_KEY_REUSED` for an event id written with a different body.

            A retry carrying the **same** `event_id` as the tick already stored is not a conflict:
            it is the same act arriving twice, and it is answered `200` with the session. Reuse
            the id when retrying rather than minting a new one, or an offline replay becomes a
            second person's press.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/sessions/{sessionId}/unticks:
    post:
      operationId: untickCounselingItem
      tags: [Counseling]
      summary: Take a tick back, and say why
      description: |
        **This endpoint is acceptance criterion 3.** The reason is required here, in the event's own
        validation and by a database constraint — an un-tick with no reason is indistinguishable
        from a mis-tap, and telling those two apart is the entire value of recording it.

        The tick's row is kept. A delete would satisfy the words and destroy the point: the
        interesting record is that somebody covered an item and then somebody decided they had not.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [item_code, reason]
              properties:
                event_id: { type: string, format: uuid }
                item_code: { type: string, maxLength: 60 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The session, with the tick withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/CounselingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `COUNSELING_ITEM_NOT_TICKED` — nothing to take back — or
            `COUNSELING_SESSION_FINISHED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/sessions/{sessionId}/complete:
    post:
      operationId: completeCounselingSession
      tags: [Counseling]
      summary: Finish the session
      description: |
        The counsellor saying they are done. It **ticks nothing**: a completion that also covered the
        outstanding items would be the batch attribution criterion 1 forbids, wearing a different
        name, and it would let a session be closed by somebody who counselled nobody.

        A session may be completed with items outstanding — the patient left, the interpreter did not
        arrive, the insulin corner was closed — and the record then says exactly that. Whether such a
        visit may reach the physician is CP57's gate to decide, and it can only decide it because
        this endpoint did not quietly prevent the situation being recorded.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                event_id: { type: string, format: uuid }
      responses:
        '200':
          description: The session, closed.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/CounselingSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `COUNSELING_SESSION_FINISHED` — somebody has already closed it — or
            `IDEMPOTENCY_KEY_REUSED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/visits/{visitId}/sessions:
    get:
      operationId: listCounselingSessionsForVisit
      tags: [Counseling]
      summary: What this visit has been walked through
      description: |
        Every checklist opened for one visit, oldest first. A patient with two conditions gets one
        session per matching assignment rule, and the physician's panel (CP57) shows them together.

        Items and ticks are not included: this is the index, and a panel opens the session it wants.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: visitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The sessions, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingSession'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/visits/{visitId}/checklists:
    get:
      operationId: listCounselingChecklistsForVisit
      tags: [Counseling]
      summary: Which checklists this visit calls for
      description: |
        The answer a counsellor's phone needs before it can start anything. Without it, starting a
        session would mean showing a list of every checklist in the clinic and having the
        counsellor choose — a clinical assignment made by the person least placed to make it,
        which is exactly what §5.1's assignment rules exist to avoid.

        Matched against the patient's **live coded comorbidities**. A presenting complaint is coded
        in the clinic's own dictionary and matches no ICD rule; a family history is somebody else's
        condition, and a checklist assigned from a mother's diabetes would have a counsellor
        teaching the wrong person's disease.

        Sessions already open for the visit are included **even when no rule matches them any
        more**: a rule retired at lunchtime must not make a half-ticked session disappear from the
        phone of the counsellor walking it. `session_id` is what the phone resumes from.

        `matched_code` is reported so "why am I being asked to do this" has an answer on the screen
        rather than in a policy document.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: visitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The checklists, open sessions first, then by the clinic's own priority.
          content:
            application/json:
              schema:
                type: object
                required: [checklists]
                properties:
                  checklists:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingChecklist'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/visits/{visitId}/gate:
    get:
      operationId: getCounselingGate
      tags: [Counseling]
      summary: Whether counselling is holding this patient, and what is missing
      description: |
        **Criterion 2 lives in this response.** A refusal that only said "not allowed" would send
        an operator back to a screen with no idea what to do next, so the answer names each
        missing item, on which checklist, in which room.

        `session_id` is absent on an item whose checklist nobody opened at all — the difference
        between "go back and finish it" and "nobody has started this", which are two different
        rooms to send the patient to.

        `blocked` is what the queue will do; `overridden` is why it will not. A screen that drew
        those the same way would be telling a physician the counselling was done.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: visitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: What the gate says about this visit.
          content:
            application/json:
              schema:
                type: object
                required: [gate]
                properties:
                  gate:
                    $ref: '#/components/schemas/CounselingGate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/visits/{visitId}/gate/override:
    post:
      operationId: overrideCounselingGate
      tags: [Counseling]
      summary: Send a patient past the counselling gate, with a reason
      description: |
        The valve, and it exists because the plan says a rigid gate with no escape valve will be
        worked around — and a gate people route around is worse than one with a recorded valve,
        because the routing-around is invisible.

        CP54's allergy gate has no override, deliberately: it has three honest answers, each five
        seconds long, so an override would become the fast one. This gate asks for seven
        conversations, and the reasons they cannot happen are ordinary — the patient's daughter
        arrives with the car, the interpreter does not come, the insulin corner is closed.

        So everything about it is built to be seen: its own permission
        (`counseling.gate.override`), its own event, a **required reason**, the missing items
        recorded as they stood at that moment, an audit entry, and a rate view for the person
        whose job is to ask why it happened eleven times today.

        Refused with `422` when nothing is outstanding — an override on a visit the gate is not
        holding is a row that makes the rate view lie — and with `409` when one already stands.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: visitId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                event_id: { type: string, format: uuid }
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: |
                    Why this patient is going through without the counselling. Read by whoever
                    reviews override rates, which is the only thing that keeps the valve honest.
      responses:
        '200':
          description: The gate, now overridden.
          content:
            application/json:
              schema:
                type: object
                required: [gate]
                properties:
                  gate:
                    $ref: '#/components/schemas/CounselingGate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `COUNSELING_GATE_ALREADY_OVERRIDDEN`: somebody has already let this patient through,
            with a reason. Not another act — the same one — so it is answered plainly rather than
            stacked as a second row nobody reads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/counseling/gate/overrides:
    get:
      operationId: listCounselingGateOverrides
      tags: [Counseling]
      summary: How often the valve is being used, and why
      description: |
        The plan's mitigation for "the gate causes clinic-floor friction on a busy day" is the
        override **plus override-rate monitoring**, and monitoring nobody can read is a plan on
        paper. Quality's permission, because the answer to a rising rate is a person asking why,
        not a rule.

        Whole days, half-open: a window that ended "now" would exclude the override granted a
        minute ago, which is the one somebody is asking about.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The overrides granted in the window, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [overrides, from, to]
                properties:
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  overrides:
                    type: array
                    items:
                      $ref: '#/components/schemas/CounselingGateOverride'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/foods:
    get:
      operationId: searchFoods
      tags: [Nutrition]
      summary: The food picker
      description: |
        Trigram search over the names **and the synonyms**, because "roti", "ruti" and "রুটি" are
        one food and a picker that only matched the formal name is a picker somebody gives up on.
        A prefix match sorts first; similarity breaks the ties.

        Each food comes with its **portions** — what a cup, a piece or a tablespoon of it weighs,
        with the note that says how big. That is one query rather than one per food, because a
        picker that showed a food and then asked what a cup of it weighed would be a second round
        trip inside the four minutes the whole recall is meant to take.

        `approved` is false on everything: this is a starter list, not the clinic's agreed table.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: q
          in: query
          schema: { type: string }
          description: What the operator has typed so far. Empty returns the list from the top.
        - name: group
          in: query
          schema:
            type: string
            enum:
              [
                GRAIN,
                PULSE,
                VEGETABLE,
                FRUIT,
                FISH,
                MEAT,
                EGG,
                DAIRY,
                OIL,
                SWEET,
                DRINK,
                SNACK,
                OTHER,
              ]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: The matching foods, with their portions.
          content:
            application/json:
              schema:
                type: object
                required: [foods]
                properties:
                  foods:
                    type: array
                    items: { $ref: '#/components/schemas/Food' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/foods/measures:
    get:
      operationId: listFoodMeasures
      tags: [Nutrition]
      summary: The household measures, and the day's meals
      description: |
        Reference data a station app fetches once and works from offline. `universal` marks a
        measure that means the same for every food — only grams — so a screen knows which measures
        it can offer for a food with no portion row.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The measures and the meals.
          content:
            application/json:
              schema:
                type: object
                required: [measures, meals, recall_date_default, clinic_today]
                properties:
                  measures:
                    type: array
                    items: { $ref: '#/components/schemas/FoodMeasure' }
                  meals:
                    type: array
                    items: { $ref: '#/components/schemas/Meal' }
                    description: In the order the day happens, **with their names**, so a screen does not hard-code them and two clients cannot invent different Bangla for MID_MORNING.
                  recall_date_default:
                    type: string
                    format: date
                    description: Which day this clinic thinks a recall taken now is about, **on its own calendar**. The client is told not to compute this — between midnight and six in the morning local, a UTC "yesterday" is a day out.
                  clinic_today:
                    type: string
                    format: date
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/diet:
    post:
      operationId: recordDietEntry
      tags: [Nutrition]
      summary: Record one thing the patient said they ate
      description: |
        One food, one measure, one count. Needs `observation.write.nutrition`.

        The **grams and the energy are the server's**, computed from the food table. A client that
        sent them would be sending its own arithmetic, and a calorie count is a number people act
        on.

        `recall_date` defaults to **yesterday on the clinic's own calendar** (Asia/Dhaka), because a
        recall taken today is almost always about yesterday — a screen defaulting to today would be
        wrong by default, and an operator correcting the date on every patient will stop correcting
        it. The day is worked out in local time rather than UTC: between midnight and six in the
        morning the two differ, so a late session or an offline write replayed overnight would
        otherwise file the recall two days out.

        The entry's id is **derived from `event_id`**, so a client can find the row it just wrote
        among the other operator's identical ones, and a retried write produces the same entry
        rather than a second row.

        **The whole day comes back**, not just the entry. The other assistant has been adding items
        while this one was typing, and seeing them is what stops the same rice being recorded twice.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, meal, food_code, measure_code, quantity]
              properties:
                event_id: { type: string, format: uuid }
                patient_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                recall_date:
                  type: string
                  format: date
                  description: The day being recalled. Defaults to yesterday.
                meal:
                  type: string
                  enum: [BREAKFAST, MID_MORNING, LUNCH, AFTERNOON, DINNER, BEDTIME, OTHER]
                eaten_at_hour:
                  type: integer
                  minimum: 0
                  maximum: 23
                  description: Optional. A patient who cannot remember the hour still remembers the meal, and requiring it would produce invented ones.
                food_code: { type: string }
                measure_code: { type: string }
                quantity:
                  type: number
                  description: How many of the measure — "two cups" is quantity 2, measure CUP. Kept exactly as the patient said it.
                note: { type: string, maxLength: 500 }
      responses:
        '201':
          description: The day so far, including what the other operator has added.
          content:
            application/json:
              schema:
                type: object
                required: [recall, clinic_today]
                properties:
                  recall: { $ref: '#/components/schemas/DietRecall' }
                  clinic_today:
                    type: string
                    format: date
                    description: |
                      The clinic's own today, on every recall payload. It is also on the reference
                      payload, but that one is fetched once and held for a whole clinic session — a
                      session crossing midnight would be checking a date against yesterday's idea
                      of today and would quietly stop warning about a recall dated in the future.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That event id has already been recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/diet/{id}/withdraw:
    post:
      operationId: withdrawDietEntry
      tags: [Nutrition]
      summary: Take one entry back
      description: |
        With a reason and a name, and the entry stays in the record. **Anybody at the station may
        withdraw an entry, including one somebody else recorded** — the commonest reason to take one
        back is that two assistants recorded the same rice, and requiring the original recorder to
        remove it would mean the duplicate stays until they come back from the next patient. The
        reason and the name are what make that safe, and both are required.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                event_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The day, with the entry marked withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [recall, clinic_today]
                properties:
                  recall: { $ref: '#/components/schemas/DietRecall' }
                  clinic_today:
                    type: string
                    format: date
                    description: |
                      The clinic's own today, on every recall payload. It is also on the reference
                      payload, but that one is fetched once and held for a whole clinic session — a
                      session crossing midnight would be checking a date against yesterday's idea
                      of today and would quietly stop warning about a recall dated in the future.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Somebody has already taken that entry back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/patients/{id}/diet:
    get:
      operationId: getDietRecall
      tags: [Nutrition]
      summary: One day's eating
      description: |
        In the order the day happened. Withdrawn entries come back too — a recall somebody corrected
        is still a record of what was said and by whom. `date` defaults to yesterday.

        `totals.contributors` is how many people recorded part of this recall. It is on the payload
        because a recall two assistants built is the thing [R-01] asked for, and a screen that could
        not show it would make the feature invisible to the people using it.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: The day.
          content:
            application/json:
              schema:
                type: object
                required: [recall, clinic_today]
                properties:
                  recall: { $ref: '#/components/schemas/DietRecall' }
                  clinic_today:
                    type: string
                    format: date
                    description: |
                      The clinic's own today, on every recall payload. It is also on the reference
                      payload, but that one is fetched once and held for a whole clinic session — a
                      session crossing midnight would be checking a date against yesterday's idea
                      of today and would quietly stop warning about a recall dated in the future.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/patients/{id}/diet/days:
    get:
      operationId: listDietRecallDays
      tags: [Nutrition]
      summary: Which days this patient has a recall for
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The dates, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [days]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, entries]
                      properties:
                        date: { type: string, format: date }
                        entries:
                          type: integer
                          description: How many items are on that day, so a client can tell which is worth opening without asking again.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/exercise/contraindications:
    get:
      operationId: listContraindications
      tags: [Exercise]
      summary: What station 8 asks about
      description: |
        The conditions, with the **question** rather than the label. A checkbox saying "neuropathy"
        gets ticked for tingling toes; one asking whether protective sensation is lost at a
        monofilament site does not — and every exclusion downstream is only as good as the answer
        to that question.

        This route is unfiltered because it contains no exercises. `from_observation`, where it is
        set, names the code the record may already hold the answer in, so a station can pre-fill
        rather than ask twice.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The catalogue, in the order the station works through it.
          content:
            application/json:
              schema:
                type: object
                required: [contraindications]
                properties:
                  contraindications:
                    type: array
                    items: { $ref: '#/components/schemas/Contraindication' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/exercise/assessments:
    post:
      operationId: recordExerciseAssessment
      tags: [Exercise]
      summary: Record what station 8 found
      description: |
        Mobility, baseline fitness and the conditions that apply today. Needs
        `observation.write.exercise`.

        **The permitted exercise list comes back on the same response.** The alternative — record,
        then fetch — leaves a window in which the station holds findings and no list, and the
        natural thing for a client to do in that window is show a library it already has. Returning
        both makes the filtered list the only list the screen ever holds.

        A second assessment **supersedes** the first rather than editing it. A patient whose foot
        ulcer healed between visits has a new answer, not a corrected one, and last month's plan
        must stay readable against last month's findings.

        A `contraindications` code that is not in the catalogue is refused rather than stored: an
        assessment holding a typo'd condition would filter nothing and look exactly like one that
        filtered correctly.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, asked, contraindications]
              properties:
                event_id: { type: string, format: uuid }
                patient_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                walks_unaided:
                  type: [boolean, 'null']
                  description: Optional. Absent is not false — a patient nobody asked is a different record from one who cannot.
                walk_minutes:
                  type: [integer, 'null']
                  minimum: 0
                  maximum: 600
                  description: How many minutes they walk in a day. Optional, because requiring it would produce invented numbers.
                joint_pain: { type: string, maxLength: 500 }
                asked:
                  type: array
                  items: { type: string }
                  description: |
                    The condition codes that were **put to the patient**. Must cover every live
                    row of `/v1/exercise/contraindications`; an assessment that leaves one
                    unanswered is refused, and the refusal names which.

                    Without this the server cannot tell a skipped question from a negative answer,
                    and a station that never showed the neuropathy question would produce an
                    assessment byte-identical to a careful one — after which the filter computes
                    the permitted list as though the answer were no.
                contraindications:
                  type: array
                  items: { type: string }
                  description: |
                    The codes that apply. Every one must also be in `asked`. **Send `[]` rather
                    than omitting it** — "none apply" is the fact the whole filter turns on, and an
                    absent list is indistinguishable from a station that never asked.
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: The findings, and the options they permit.
          content:
            application/json:
              schema:
                type: object
                required: [assessment, options]
                properties:
                  assessment: { $ref: '#/components/schemas/ExerciseAssessment' }
                  options: { $ref: '#/components/schemas/ExerciseOptions' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That event id has already been recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            When `asked` does not cover every live condition, `fields.missing_conditions` carries
            the missing codes as a comma-separated list and `fields.asked` carries the same thing
            as a sentence. **This is the refusal every client has to branch on to survive a
            catalogue change**: the right response is to fetch
            `/v1/exercise/contraindications` again, put the new questions, and record.

            An unknown condition code, or one recorded as applying that is not in `asked`, is the
            same status with `fields.contraindications`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/exercise/plans:
    post:
      operationId: issueExercisePlan
      tags: [Exercise]
      summary: Issue the routine
      description: |
        Needs `observation.write.exercise`.

        **An exercise this patient's assessment forbids is refused, not warned about.** The server
        recomputes the permitted set and rejects any target outside it with
        `EXERCISE_CONTRAINDICATED`, naming the exercise and the condition — an operator told only
        "not allowed" will try the next high-impact option. The read model's trigger refuses it
        again on the way in, so the guarantee survives a projection rebuild as well as a bad client.

        `assessment_id` is required and is checked against the current assessment. A plan chosen
        before a colleague recorded a foot ulcer would otherwise be issued against the pre-ulcer
        list, and every check would pass — because they would all be checking the wrong findings.
        The answer is `EXERCISE_ASSESSMENT_SUPERSEDED`, and the operator reviews the options again.

        Each target is **two numbers**: times a week and minutes a session. That is §12.1's
        requirement rather than a form's preference — "walk more" is unanalysable, and adherence
        has to be comparable across visits from the first patient.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, assessment_id, targets]
              properties:
                event_id: { type: string, format: uuid }
                patient_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                assessment_id:
                  type: string
                  format: uuid
                  description: The findings the operator was looking at when they chose.
                targets:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [exercise_code, times_per_week, minutes_per_session]
                    properties:
                      exercise_code: { type: string }
                      times_per_week: { type: integer, minimum: 1, maximum: 14 }
                      minutes_per_session: { type: integer, minimum: 1, maximum: 240 }
                      ordering: { type: integer }
                      note: { type: string, maxLength: 500 }
                note: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: The plan, with the instruction that gets printed.
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: '#/components/schemas/ExercisePlan' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Either that event id has already been recorded, a newer assessment has superseded the
            one this plan was built against (`EXERCISE_ASSESSMENT_SUPERSEDED`), no assessment has
            been recorded at all (`EXERCISE_NO_ASSESSMENT`), or an exercise was retired between the
            options being fetched and the plan being submitted (`EXERCISE_RETIRED`, with
            `fields.exercise_code`).

            All four mean the same thing to a client: **fetch the options again**. That is why a
            retirement is a conflict rather than a validation failure — it says the list moved, not
            that the request was wrong, and a client that could not tell the two apart would
            refetch on a typo or fail to refetch on a retirement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            `EXERCISE_CONTRAINDICATED` names the exercise, the condition and the reason from the
            mapping table, in both languages, with `fields.exercise_code` and
            `fields.contraindication_code` carrying the codes a screen can act on.

            Every other refusal here — an exercise not in the library, a target that is not two
            numbers, one exercise targeted twice — carries the offending code in
            `fields.exercise_code` as well as a sentence in `fields.targets`, so a screen can put
            the message on the row it is about rather than in a banner above the list. A retired
            exercise is **not** one of these: it is a 409, because it means the list moved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/patients/{id}/exercise:
    get:
      operationId: getExerciseRecord
      tags: [Exercise]
      summary: The findings and the plan as they stand
      description: |
        Both may be null. A patient who has not been to station 8 has no findings, and answering
        404 would make an ordinary first visit look like a broken route.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: What this patient's exercise record says now.
          content:
            application/json:
              schema:
                type: object
                required: [assessment, plan]
                properties:
                  assessment:
                    oneOf:
                      - $ref: '#/components/schemas/ExerciseAssessment'
                      - type: 'null'
                  plan:
                    oneOf:
                      - $ref: '#/components/schemas/ExercisePlan'
                      - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/patients/{id}/exercise/options:
    get:
      operationId: listPermittedExercises
      tags: [Exercise]
      summary: What this patient may be offered
      description: |
        **This is the only route that returns exercises for a patient, and it never returns a
        contraindicated one.** There is no endpoint that returns the library whole: a screen that
        received everything and hid part of it would be a warning wearing a different colour, one
        bug or one "show all" affordance away from offering a jumping routine to somebody with an
        insensate foot.

        What is returned instead of the excluded rows is a **count and the reasons**: "three
        options are not shown because of severe neuropathy". A physician looking at a short list
        needs to know it is short on purpose, and a clinician who disagrees with an exclusion needs
        a sentence to disagree with.

        `excluded` is `library_size` minus what is offered. It is deliberately **not** the sum of
        the per-reason counts, which overlap — jogging is excluded by neuropathy and by an open
        ulcer, and each reason is true on its own.

        Refused with `EXERCISE_NO_ASSESSMENT` when nobody has answered the questions yet. "No
        contraindications recorded" and "no contraindications" are different facts, and answering
        the first with the whole library is exactly the failure this checkpoint exists to prevent.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The permitted set, the count and the reasons.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExerciseOptions' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No assessment has been recorded for this patient yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/patients/{id}/exercise/history:
    get:
      operationId: listExerciseHistory
      tags: [Exercise]
      summary: Every assessment and every plan
      description: |
        Newest first, with the targets on every plan — because comparing this visit's plan against
        the last is the whole point of structuring the targets, and a contraindication that
        resolved is as interesting as one that appeared.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: The history.
          content:
            application/json:
              schema:
                type: object
                required: [assessments, plans]
                properties:
                  assessments:
                    type: array
                    items: { $ref: '#/components/schemas/ExerciseAssessment' }
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/ExercisePlan' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs/health:
    get:
      operationId: getJobQueueHealth
      tags: [Operations]
      summary: Queue depth, age, failures and SLA attainment
      description: |
        One row per **registered** job kind, whether or not anything is queued. That is the point of
        the catalogue: a dashboard assembled from what is currently in the queue cannot report the
        failure it exists to catch — a job type that has stopped being enqueued at all.

        `oldest_available_seconds` is the number to alert on. Depth says how much there is; age says
        how long the oldest thing has been ignored, and a queue of two that has not moved in an hour
        is a worse state than a queue of four hundred that is draining.

        `failure_rate` and `sla_attainment` are **null rather than zero when nothing finished in the
        window**. "No failures" and "nothing ran" are different states, and showing 0% for both
        hides a stopped queue behind the healthiest-looking number on the page.

        The window applies to every rate in the rows, and is on the payload so a screen can say "in
        the last hour" rather than leaving the reader to assume it.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: window_seconds
          in: query
          schema: { type: integer, minimum: 60, maximum: 86400 }
          description: How far back the rates look. One hour by default — long enough that a quiet queue still has something in it, short enough that a failure rate reflects now rather than the morning rush.
      responses:
        '200':
          description: One row per registered job kind.
          content:
            application/json:
              schema:
                type: object
                required: [queues, window_seconds, as_of]
                properties:
                  queues:
                    type: array
                    items: { $ref: '#/components/schemas/JobQueueHealth' }
                  window_seconds: { type: integer }
                  as_of: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            `window_seconds` is out of range. Refused rather than clamped, for the same reason an
            unknown `status` on the job list is refused rather than ignored: a window that quietly
            becomes an hour shows an operator an hour's arithmetic while they believe they are
            looking at the last thirty seconds, and every rate on the page then means something
            other than what they asked for.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs/kinds:
    get:
      operationId: listJobKinds
      tags: [Operations]
      summary: The registered job types and their retry policies
      description: |
        §8.5's table, as data: the class, the queue, how many attempts, the backoff, and the SLA
        budget where a kind carries one. A kind is a **registered catalogue entry** rather than a
        free string, so a job cannot name one nobody agreed and a worker cannot register a handler
        for one that does not exist — both are refused at startup.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [kinds]
                properties:
                  kinds:
                    type: array
                    items: { $ref: '#/components/schemas/JobKind' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs:
    get:
      operationId: listJobs
      tags: [Operations]
      summary: What is queued, and what was given up on
      description: |
        Newest first. Filter by `status` to find the dead letters, which is what this list is
        usually opened for.

        There is deliberately **no endpoint that enqueues a job**. Work is enqueued by the code that
        decided it was needed, inside the transaction that made that decision true — which is how "a
        job enqueued in a rolled-back transaction never runs" is a property of the system rather
        than a thing to remember. An endpoint accepting a kind and a payload would be the way around
        it that somebody eventually used because it was convenient.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: status
          in: query
          schema:
            type: string
            enum: [AVAILABLE, RUNNING, SUCCEEDED, DISCARDED, CANCELLED]
        - name: kind
          in: query
          schema: { type: string }
        - name: sla
          in: query
          schema:
            type: string
            enum: [met, missed]
          description: |
            The jobs behind the attainment figure. `missed` is the one that matters: the health
            page can say "63.6% on time, 14 of 22 met it", and without this there is no way to
            reach the eight that missed — they succeeded, so they are not among the dead letters,
            and they are finished, so they are not waiting. A number nobody can open is asserted
            to the reader however carefully it was measured.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The matching jobs.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs/{id}:
    get:
      operationId: getJob
      tags: [Operations]
      summary: One job, with every attempt it made
      description: |
        The attempts come with it rather than behind a second request: somebody opening a
        dead-lettered job is opening it to read the errors, and a screen that made them click again
        would be built for the shape of the API rather than for the question.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The job and its attempts.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/Job' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs/{id}/retry:
    post:
      operationId: retryJob
      tags: [Operations]
      summary: Put a dead-lettered job back on the queue
      description: |
        Needs `ops.jobs.manage`, which is separate from reading: retrying runs code against a
        patient's record.

        The attempt count is **reset**, so the retry policy applies again from the start. Somebody
        retrying a job that failed five times means "try again", not "try once more".

        A job that has not been given up on answers 409 `JOB_NOT_RETRYABLE` rather than 404 — a 404
        would send an operator looking for a typo when the real answer is that a colleague retried
        it thirty seconds ago.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The job, back on the queue.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/Job' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That job has not been given up on (`JOB_NOT_RETRYABLE`), or that event id has already been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs/{id}/cancel:
    post:
      operationId: cancelJob
      tags: [Operations]
      summary: Stop a job that has not started
      description: |
        Needs `ops.jobs.manage`, and a reason: a cancelled job that says nothing is a gap somebody
        has to explain later, and the person who can explain it is the one cancelling it now.

        A **running** job is not cancellable. The worker holding it would carry on regardless, and a
        status saying otherwise would be a lie on a screen — so that answers 409
        `JOB_NOT_CANCELLABLE` and says the job will finish or fail on its own.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The cancelled job.
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: '#/components/schemas/Job' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That job has already started (`JOB_NOT_CANCELLABLE`), or that event id has already been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs/kinds/{kind}/pause:
    post:
      operationId: pauseJobKind
      tags: [Operations]
      summary: Stop a job type being claimed
      description: |
        Needs `ops.jobs.manage`. Exists so that stopping a misbehaving job type during an incident
        is a button rather than a deploy.

        Pausing does **not** consume what is already queued: those jobs stay `AVAILABLE` and are
        skipped rather than claimed-and-requeued, so resuming picks up exactly what was waiting. The
        pause takes effect on the next poll rather than after one more run of everything already in
        flight.

        Attributed, because pausing stops work a clinic is relying on and the person who did it has
        to be findable afterwards.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: kind
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The paused kind.
          content:
            application/json:
              schema:
                type: object
                required: [kind]
                properties:
                  kind: { $ref: '#/components/schemas/JobKind' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That job type is already paused (`JOB_KIND_ALREADY_PAUSED`), or that event id has already been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/jobs/kinds/{kind}/resume:
    post:
      operationId: resumeJobKind
      tags: [Operations]
      summary: Let a job type be claimed again
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: kind
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The resumed kind.
          content:
            application/json:
              schema:
                type: object
                required: [kind]
                properties:
                  kind: { $ref: '#/components/schemas/JobKind' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That job type is not paused (`JOB_KIND_NOT_PAUSED`), or that event id has already been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/visits/{id}/synthesis:
    get:
      operationId: getVisitSynthesis
      tags: [Synthesis]
      summary: The pre-consultation summary for a visit
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `ai.synthesis.read`, which is **sensitive**: the narrative is the patient's whole
        clinical picture in prose, and §4.4 blinds registration and the pharmacist from exactly
        that.

        **This never returns 404 for a visit that exists.** `state` is one of `NOT_REQUESTED`,
        `PENDING`, `RUNNING`, `READY`, `FAILED` or `UNCHANGED`, and `degraded` says whether the
        screen should lead with the structured record. `message_en` and `message_bn` are the
        sentence to put above it.

        `UNCHANGED` means a re-run was asked for, the record had not changed materially since the
        current summary was prepared, and no model was called. The narrative on screen is the
        previous generation's, and the message says so.

        `ai_generated` is always true and is never omitted, on the envelope as well as on the run:
        every AI-derived element is marked wherever it appears.
      responses:
        '200':
          description: The state of the summary, with the assembled context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SynthesisView' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      operationId: requestVisitSynthesis
      tags: [Synthesis]
      summary: Analyze / Summarize / Comprehensive Report
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `ai.synthesis.request` — a **narrower permission than reading**. The exercise
        specialist who finishes the last station before the consultation can ask for the summary
        and has no business reading what comes back; two permissions buy that and one would not.

        §7.1's button, and by design the fallback rather than the normal path: the summary is
        requested automatically when the stations complete. A clinic whose runs are mostly
        `MANUAL` has failed acceptance criterion 2, and the trigger is recorded on every run so
        that anybody can tell.

        There is no request body. A caller names a visit and nothing else — the payload sent to the
        model is assembled by the server from the record, which is the rule CP70's gateway exists to
        hold: a caller must never be in charge of deciding what counts as an identifier.

        **Asking twice is safe and does not queue two runs.** One run is in flight per visit at a
        time; a second request while one is running returns that run.

        Answers **202**, not 201: nothing is ready yet, and a 201 pointing at a resource the client
        would immediately fetch and find empty is a worse lie than an honest "accepted".
      responses:
        '202':
          description: Accepted. The run that will produce the summary.
          content:
            application/json:
              schema:
                type: object
                required: [synthesis]
                properties:
                  synthesis: { $ref: '#/components/schemas/SynthesisRun' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            The visit is closed, so no pre-consultation summary can be prepared for it. Code
            `SYNTHESIS_VISIT_CLOSED`. The remedy is to reopen the visit, which is recorded — not to
            send different fields, which is why this is a conflict rather than a validation failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/visits/{id}/synthesis/history:
    get:
      operationId: listVisitSyntheses
      tags: [Synthesis]
      summary: Every summary prepared for this visit
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `ai.synthesis.read`. Newest generation first.

        A re-run never overwrites its predecessor: it inserts the next generation and stamps the
        previous one `superseded_at`. What a physician was looking at ten minutes ago is exactly the
        question a medico-legal review asks, and a table that had been updated in place could not
        answer it.
      responses:
        '200':
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: '#/components/schemas/SynthesisRun' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/synthesis-sla:
    get:
      operationId: getSynthesisSLA
      tags: [Operations]
      summary: Whether the five minutes are being kept
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: window_seconds
          in: query
          schema: { type: integer, minimum: 300, maximum: 2592000 }
          description: |
            How far back to measure. A day by default — §7.1's promise is about a morning, and a
            week's average would hide the morning the provider was down. Refused rather than
            clamped when out of range: a window that quietly became a day would show a reader a
            day's arithmetic while they believed they were looking at an hour.
      description: |
        Needs `ops.jobs.read` — the queue's own permission rather than a new one. This is a report
        about a job kind's deadline, there is no patient in it, and the person who opens it is the
        person already looking at the queue-health page.

        Acceptance criterion 1 as a number: of the runs that finished in the window, how many met
        the deadline the queue stamped on them. `p95_seconds` is the statistic the criterion asks
        about directly — *"≥95% of visits"* — rather than a mean that hides the tail.

        `budget_seconds` is read from `ops.job_kind`, so the measurement and the target come from
        one place. It is zero when the catalogue could not be read, which the report says rather
        than substituting §7.1's five minutes as though somebody had configured it.

        `manual` is how many runs somebody had to ask for. Criterion 2 says the physician should
        never need to; this is the only number that can show whether that is true in practice.
      responses:
        '200':
          description: The measurement.
          content:
            application/json:
              schema:
                type: object
                required: [sla, window_seconds, as_of]
                properties:
                  sla: { $ref: '#/components/schemas/SynthesisSLA' }
                  window_seconds: { type: integer }
                  as_of: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/interactions:
    get:
      operationId: listAIInteractions
      tags: [Operations]
      summary: What the system has sent to an AI model
      description: |
        The **human-reviewable outbound log**. CP70's stated risk is PHI leakage through free-text
        fields and its stated mitigation is the scrubber plus this log; a log nobody can open is not
        a mitigation.

        Every call is here, including the ones that never reached a model. A refusal
        (`REFUSED_TIER`, `REFUSED_PHI`) is exactly the row somebody wants to find afterwards, and a
        log that only recorded the calls that happened would have no answer for them.

        **The payloads are not in this list.** They are in the detail view, one at a time: a list
        endpoint returning two hundred clinical payloads would be a bulk export of the clinic's
        caseload wearing an operational screen's clothes.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: agent_code
          in: query
          schema: { type: string }
          description: Only this agent's calls.
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AIInteractionStatus' }
          description: |
            Only calls with this outcome. An unrecognised value is **refused rather than ignored**:
            a filter that quietly does nothing shows a reviewer the whole log while they believe
            they are looking at the refusals.
        - name: window_seconds
          in: query
          schema: { type: integer, minimum: 60, maximum: 2592000 }
          description: How far back to look. One day by default — long enough that this morning's synthesis is in it, short enough that the first page is not last month.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The outbound log, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [interactions, since, as_of]
                properties:
                  interactions:
                    type: array
                    items: { $ref: '#/components/schemas/AIInteraction' }
                  since: { type: string, format: date-time }
                  as_of: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '`status` is not an interaction status, or `window_seconds` is out of range.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/interactions/{id}:
    get:
      operationId: getAIInteraction
      tags: [Operations]
      summary: One call, with exactly what was sent and what came back
      description: |
        The screen CP70's manual verification step opens: invoke an agent, open the recorded
        outbound payload, and confirm that no name, national ID, phone number or address is in it.

        `outbound.removed` is what the scrubber took out — the kind of thing and where, never the
        thing itself — so a reviewer can see the scrubber working without the review becoming a
        second copy of the data.

        `outbound` is **absent on a `REFUSED_PHI` row**, deliberately. That is precisely the payload
        the gateway decided was unsafe to send; keeping it would move the leak from the provider to
        our own audit table. `refusal_detail` names the key or the pattern instead.

        Opening one payload is logged.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The call.
          content:
            application/json:
              schema:
                type: object
                required: [interaction]
                properties:
                  interaction: { $ref: '#/components/schemas/AIInteractionDetail' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/spend:
    get:
      operationId: getAISpend
      tags: [Operations]
      summary: What AI cost today, against the budget
      description: |
        D-14's cost governance, per agent and for the deployment as a whole. The row whose
        `agent_code` is empty is the deployment-wide total — the budget that catches a runaway in an
        agent nobody was watching.

        Money is in **integer micro-dollars**: a cost record is money, and money in a float is a
        number that stops adding up over a month of calls.

        `percent_of_budget` is **null rather than zero when no budget is configured** for that
        agent. "Nothing configured" and "nothing spent" are different states, and a screen showing
        0% for both hides an unmetered agent behind the healthiest-looking number on the page.

        `alerts` is thirty days of threshold crossings, because the question an administrator has on
        opening this screen is rarely "what is today" and usually "has this been creeping". Each
        threshold fires **once per agent per day**; an alert that fired four hundred times would be
        one somebody turned off.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: day
          in: query
          schema: { type: string, format: date }
          description: The UTC day to report. Today by default.
      responses:
        '200':
          description: The day's spend and the recent crossings.
          content:
            application/json:
              schema:
                type: object
                required: [day, spend, alerts, as_of]
                properties:
                  day: { type: string, format: date }
                  spend:
                    type: array
                    items: { $ref: '#/components/schemas/AISpend' }
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/AIBudgetAlert' }
                  as_of: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '`day` is not a date.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/prompts:
    get:
      operationId: listAIPrompts
      tags: [Operations]
      summary: The prompt registry as deployed, with the pinned models
      description: |
        §10.5's versioned artefacts, as the running system holds them. The files in the repository
        are the source of truth; these are the copies written at start-up, and they are never
        updated afterwards — a prompt that changed under a version number would make every
        interaction naming that version unreproducible, so the process refuses to start instead.

        The prompt text is included. A registry screen showing version numbers and content hashes
        but not the prompt would answer "which version" and not "what did it say", and the second is
        the question somebody has when an AI draft was wrong.

        `models` are the **pinned** versions and their prices. No floating aliases (D-13): on Gemini
        in particular, preview and free-tier aliases are retired within weeks, and a system naming
        `latest` would one day be answered by a model nobody evaluated and would record that it had
        used "latest".
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The registry.
          content:
            application/json:
              schema:
                type: object
                required: [agents, prompts, models]
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AIAgent' }
                  prompts:
                    type: array
                    items: { $ref: '#/components/schemas/AIPromptVersion' }
                  models:
                    type: array
                    items: { $ref: '#/components/schemas/AIModel' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/grounding-defects:
    get:
      operationId: listAIGroundingDefects
      tags: [Operations]
      summary: Claims an AI answer made that the record does not support
      description: |
        §10.2 step 4's output. Every ungrounded claim the gateway caught is one row here: which arm
        of the check fired, where in the answer, the offending token, and the sentence around it.

        **These are defects, not retries.** CP70 retries a malformed answer because that is a
        transport problem; an invented laboratory value is a quality problem, and a retry would
        spend money to destroy the evidence — the second answer usually passes, and the rate of the
        failure this exists to measure would read as zero.

        The `grounding` block beside the queue carries the last day's verdict counts per agent, and
        `false_positive_rate` is **absent rather than zero** when nothing has been reviewed. A
        validator nobody has checked has an *unknown* false-positive rate; reporting 0% for it would
        be the most misleading number this system could publish.

        The excerpt is taken from the answer **before** the gateway restores the subject's
        identifiers, so it names a pseudonym rather than a person, and a check constraint refuses to
        store one that trips the PHI pattern list.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, REVIEWED] }
          description: |
            Only defects in this state. An unrecognised value is refused rather than ignored, for
            the reason the outbound log's status filter is.
        - name: arm
          in: query
          schema: { $ref: '#/components/schemas/AIGroundingArm' }
          description: Only defects this arm of the check found.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: The queue, open defects first, with the current rates beside it.
          content:
            application/json:
              schema:
                type: object
                required: [defects, grounding, as_of]
                properties:
                  defects:
                    type: array
                    items: { $ref: '#/components/schemas/AIGroundingDefect' }
                  grounding:
                    type: array
                    items: { $ref: '#/components/schemas/AIGroundingHealth' }
                  as_of: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '`status` or `arm` is not a value this check produces.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/grounding-defects/{id}/review:
    post:
      operationId: reviewAIGroundingDefect
      tags: [Operations]
      summary: Record whether the model invented something or the check was wrong
      description: |
        The measurement acceptance criterion 2 is really about. A frozen test set can say what the
        validator does to twenty answers written last September; only a person reading today's
        refusals can say whether it is refusing things it should not be.

        Three verdicts, and the third is not a synonym for the second. `TRUE_POSITIVE` — the model
        said something it was not shown. `FALSE_POSITIVE` — the claim was sound and the check was
        wrong about it; this is the number that decides whether the check may stay as strict as it
        is. `VALIDATOR_DEFECT` — the check fired on something that is not a claim at all, which is a
        parsing fault with a different fix, kept apart so that burying it inside a clinical
        false-positive rate does not flatter both numbers.

        Disagreeing with the check requires **at least twenty characters** saying why. A
        false-positive rate assembled from unexplained clicks is a number that will be used to
        loosen the check, and the loosening will be defended with the number.

        Requires `ai.quality.review`, which is sensitive: you cannot classify what you may not read.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classification]
              properties:
                classification: { $ref: '#/components/schemas/AIGroundingClassification' }
                note:
                  type: string
                  maxLength: 2000
                  description: Why. Required, and at least twenty characters, for anything but `TRUE_POSITIVE`.
      responses:
        '200':
          description: The classified defect.
          content:
            application/json:
              schema:
                type: object
                required: [defect]
                properties:
                  defect: { $ref: '#/components/schemas/AIGroundingDefect' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Either the idempotency key was reused for a different request, or — code
            `AI_DEFECT_ALREADY_REVIEWED` — a colleague has already recorded a verdict on this
            defect. The remedy for the second is to read what they decided, not to retry with a new
            key, which is why it has its own code rather than the bare `CONFLICT`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: The verdict is not one of the three, or a disagreement carries no reason.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/ops/ai/evaluation-runs:
    get:
      operationId: listAIEvaluationRuns
      tags: [Operations]
      summary: The frozen evaluation set's results over time
      description: |
        §10.5's regression record: every run of the frozen case set against one prompt version and
        one model version, newest first. The `case_set_sha256` is what makes two runs comparable —
        a gate run against a case set somebody edited is a gate that passes by construction.

        `mode` is `replay` when no model was contacted and `live` when the gateway was called.
        Latency and cost are **absent** on a replay rather than zero: the difference between "we did
        not measure this" and "this was free" matters on a dashboard.

        `detection_rate` is acceptance criterion 1 and is 1.0 or the build does not ship.
        `false_positive_rate` is criterion 2 on the frozen corpus, whose limitations are stated in
        `docs/ai-grounding.md` — the known-correct answers were written by a deterministic composer
        rather than by a language model, and that flatters the number.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: agent_code
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [runs, as_of]
                properties:
                  runs:
                    type: array
                    items:
                      type: object
                      required: [run]
                      properties:
                        run: { $ref: '#/components/schemas/AIEvaluationRun' }
                        detection_rate:
                          type: number
                          description: Absent when the set injected no hallucinations, because a run that tested nothing has not measured a rate and 100% would be the most misleading way to say so.
                        false_positive_rate:
                          type: number
                          description: Absent when the set held no known-correct answers, for the same reason.
                  as_of: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/events:
    post:
      operationId: pushSyncBatch
      tags: [Sync]
      summary: Send events recorded while the device was offline
      description: |
        A batch, processed **event by event**. One bad event never blocks the rest — that is
        acceptance criterion 1, and it is why there is no batch transaction: a rejected event has
        nothing to roll back, because the reason it was rejected is that it never got written.

        The honest consequence is that a batch is not atomic. A client whose connection drops
        halfway has some of its events in the ledger and some not, which is exactly what
        `event_id` idempotency exists for: **resend the whole batch** and the landed ones come back
        `DUPLICATE`.

        **`occurred_at` is preserved and `recorded_at` is the server's.** A blood pressure taken at
        08:40 and synced at 11:00 is a fact about 08:40 that the record learned about at 11:00, and
        collapsing the two would put a morning of measurements in the wrong order on every timeline.

        **Two idempotency mechanisms, at two layers, and both earn their place.**
        `Idempotency-Key` is the transport's: a request retried within the cache window gets the
        stored response without the handler running. `batch_id` is the protocol's, and it is
        durable — a client that comes back a day later, or after a restart, asks
        `GET /v1/sync/batches/{id}` and is told what happened. The header cannot do that, because
        its cache expires; the batch id cannot do the first, because by the time the handler reads
        it the work has begun.

        `source` is set to `MOBILE_OFFLINE_SYNC` by the server whatever the client says. That is how
        a reader tells a value entered at the bedside from one that arrived hours later through a
        queue, and letting a client assert it would make the distinction worthless.

        **Ordering.** Events are applied in the order sent, and events for one aggregate are applied
        serially. A failure does not block the rest of that aggregate — an observation is a fact
        about a moment, not a mutation of a state, and holding thirty-seven good measurements
        hostage to one typo would be worse. The exception is an event carrying `expected_sequence`,
        which is *saying* it depends on the aggregate's state: after an earlier failure it no longer
        holds, so it comes back `BLOCKED` without being attempted rather than as a misleading
        sequence conflict.

        **A revoked device is quarantined, not accepted and not dropped.** See
        `GET /v1/sync/quarantine`. This is the one route in the system a correctly-signed but
        no-longer-active device may reach: everywhere else it gets 401, which is what revocation
        means. The signature, the timestamp and the nonce are checked here exactly as they are
        everywhere else — what is permitted is a revoked device handing over what it already has,
        to be judged by a person.

        **An interrupted batch is reprocessed, not answered as empty.** The receipt row is opened
        before the first event, so a server that died halfway leaves one that exists and reports
        nothing. A push under that id runs again — safe, because `event_id` is the ledger's key —
        rather than replaying a receipt that would say "your fifty events produced no results" for
        ever. `closed` on the receipt is how a client tells the two apart.

        Guarded by the union of every station write permission, because pushing is not a privileged
        act: it is the same clinical write the station already had the right to make, arriving late.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [batch_id, events]
              properties:
                batch_id:
                  type: string
                  format: uuid
                  description: The client's own receipt number. Required, because a lost response is otherwise unrecoverable — and that is the one failure this endpoint exists to survive.
                device_id:
                  type: string
                  format: uuid
                  description: |
                    Optional, and **checked rather than trusted**: the sending device comes from
                    the signature the middleware verified. Send it and a mismatch is refused —
                    that means the client is confused about which device it is, and carrying on
                    would record something neither side meant. Omit it and the signature decides.
                client_clock:
                  type: string
                  format: date-time
                  description: What the device's clock said when it sent this. Optional — a client that cannot read its clock should still be able to sync, and the skew is then unknown rather than assumed to be zero.
                events:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { $ref: '#/components/schemas/SyncEvent' }
      responses:
        '200':
          description: |
            The receipt, per event. 200 rather than 201 even when events were created: the
            interesting answer is the body, and "created" would be the wrong headline for a batch
            in which half the events were held.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncReceipt' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: That device is not enrolled here. One answer for "does not exist" and "belongs to another clinic", because a distinguishing error would disclose which.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: That idempotency key has already been used for a different request, or one with the same key is still in flight.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            The batch itself is malformed — no identifier, no events, or more than 500. Too large is
            a **refusal rather than a truncation** (`SYNC_BATCH_TOO_LARGE`): a client told
            "accepted" for a prefix and left to work out which is a client that drops the rest.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            Over budget. Two different limits answer here and a client tells them apart by the code.

            `RATE_LIMITED` is the per-device rate limit, and `Retry-After` says how long to wait.
            A tablet coming back into signal may push several batches back to back; sustained, it
            may not push faster than a station generates work.

            `SYNC_QUARANTINE_FULL` is the ceiling on how many events one device may leave awaiting
            review, and it carries **no** `Retry-After` — waiting does not clear it. It is returned
            only to a device the clinic has refused, whose every event would be held and for which
            there is therefore no room for any of them; nothing is written, and the client keeps its
            batch. What clears it is somebody at the clinic working through
            `GET /v1/sync/quarantine` for that device. A device that is *not* refused is never
            answered this way: its valid events still land, and only the ones that would have needed
            a hold come back `BLOCKED` with `QUARANTINE_FULL`.
          headers:
            Retry-After:
              description: Seconds to wait. Present for `RATE_LIMITED`, absent for `SYNC_QUARANTINE_FULL`.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

    get:
      operationId: pullSyncEvents
      tags: [Sync]
      summary: Everything that has happened since a cursor
      description: |
        Scoped twice: to the caller's facility, and to the event types their permissions allow.

        The second is a **declared allowlist**, not a denylist. An event type nobody has decided
        about is not pullable at all — the alternative puts a type added next month on every phone
        in the clinic before anybody notices, working correctly, for months. Each pullable type
        names the same permission that guards its HTTP route, so a role blinded from something over
        HTTP is blinded from it on a device too.

        `cursor` is always present, even on an empty page. A client that had to infer its next
        cursor from the last event would have none when the page was empty and would ask the same
        question forever.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: since
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
          description: The `cursor` from the previous page. Omit for everything from the beginning.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: A page of events, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPage' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          description: |
            `RATE_LIMITED`: over the per-device budget for the pull. Looser than the push's, because
            a device seeding itself walks the ledger a page at a time and a new tablet has a lot of
            pages to walk — and because what a fast pull costs is bandwidth, not a permanent row
            somebody has to triage. `Retry-After` says how long to wait.
          headers:
            Retry-After:
              description: Seconds to wait.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/batches/{id}:
    get:
      operationId: getSyncReceipt
      tags: [Sync]
      summary: What happened to a batch that was already sent
      description: |
        For the client that sent fifty events, had them processed, and lost the response on the way
        back. Without this it can only resend and hope, or drop and hope.

        A batch that was already processed is answered from its stored results without touching the
        ledger — which also means a device revoked *since* that batch cannot change the outcome of
        one that was already accepted.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The receipt, with `replayed` true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncReceipt' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/reference:
    get:
      operationId: getReferenceVersions
      tags: [Sync]
      summary: Whether the catalogues a device is holding have moved
      description: |
        One small request that tells a phone holding six catalogues for a morning whether any of
        them changed. A count and a fingerprint rather than a timestamp, because several of these
        tables have no `updated_at` and adding one to each would be five migrations to answer a
        question a hash already answers. The fingerprint says *that* something moved, not what — a
        client that needs to know re-fetches, which is one request and the thing it was going to do.

        `server_time` rides along so a client can measure its own clock skew from the same response.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: A fingerprint per catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [catalogues, server_time]
                properties:
                  catalogues:
                    type: array
                    items: { $ref: '#/components/schemas/ReferenceVersion' }
                  server_time: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/state:
    get:
      operationId: getDeviceSyncState
      tags: [Sync]
      summary: Where this device has got to
      description: |
        Kept on the server as well as on the device, for two reasons: a phone that was wiped and
        re-enrolled has lost its cursor, and "start from the beginning" for a device a year into
        service is a download nobody wants; and it is the row somebody reads to answer "has that
        tablet synced today", which is the first question asked when a station's work is missing.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The device's position.
          content:
            application/json:
              schema:
                type: object
                required: [state, server_time]
                properties:
                  state: { $ref: '#/components/schemas/DeviceSyncState' }
                  server_time: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/quarantine:
    get:
      operationId: listQuarantinedEvents
      tags: [Sync]
      summary: Offline events that were held rather than accepted
      description: |
        A station tablet is revoked at nine. It has been offline since eight and holds forty real
        blood pressures, taken by a real operator, on patients who have gone home.

        Accepting them defeats revocation — whatever made somebody revoke that device is exactly the
        reason not to trust what it sends. Dropping them loses a morning of measurements, and loses
        them *silently*: the operator believes the work is recorded and nobody finds out until a
        physician wonders why a patient has no vitals. So neither: they are held, in full, and a
        person decides.

        **This list carries no clinical values.** It is a triage view — the event type, when it
        happened, which device, which operator — so that a supervisor sees "eleven blood pressures
        and two weights" without a single measurement appearing on the screen. The values are on the
        single-event read, which is a separate request and a deliberate one.

        Defaults to `HELD`, because a list that opened on everything ever resolved would bury the
        four things somebody has to decide about this morning. `status=ALL` for everything.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: status
          in: query
          schema:
            type: string
            enum: [HELD, RELEASED, DISCARDED, ALL]
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        '200':
          description: The held events, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held:
                    type: array
                    items: { $ref: '#/components/schemas/QuarantinedEvent' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/quarantine/{id}:
    get:
      operationId: getQuarantinedEvent
      tags: [Sync]
      summary: One held event, with its content
      description: |
        The only read in this system that returns a clinical value from outside the ledger, which is
        why `sync.quarantine.read` is sensitive. It exists because somebody deciding whether a
        measurement belongs in a patient's record has to be able to see the measurement.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The held event and its envelope.
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held: { $ref: '#/components/schemas/QuarantinedEvent' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/quarantine/{id}/release:
    post:
      operationId: releaseQuarantinedEvent
      tags: [Sync]
      summary: Let a held event into the permanent record
      description: |
        Needs `sync.quarantine.release`, which the physician holds and the administrator does not —
        the administrator revoked the device, and somebody who can both refuse a device and then
        admit its data has undone their own control.

        **The event keeps its original `occurred_at`.** A blood pressure taken at 08:40 and released
        at four in the afternoon is a fact about 08:40; dating it at release would put it after every
        measurement taken since, on every timeline, forever.

        **The physician's name goes on it, not the operator's**, and that is not a compromise: the
        reason this event is in the record is that a physician decided it should be, on evidence from
        a device somebody had already refused to trust, and their name is the accurate statement of
        who is answerable. The operator is not lost — the original user, device, hold reason and
        quarantine id are carried in the event's metadata, so a reader years later sees the whole
        truth rather than half of it.

        The append and the status change are one transaction, and an invariant checks the whole
        table: "released" set while the append failed would mark a measurement as recovered when it
        is not there, which is worse than never releasing it because now nobody is looking.

        A reason is required — as much as for a discard, and arguably more, since this is the
        decision that is harder to undo.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: The released event, naming what it became.
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held: { $ref: '#/components/schemas/QuarantinedEvent' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Somebody has already decided about this event, or that event id has been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/sync/quarantine/{id}/discard:
    post:
      operationId: discardQuarantinedEvent
      tags: [Sync]
      summary: Refuse a held event, by name and with a reason
      description: |
        The row is never deleted. A discarded clinical measurement with no explanation is exactly
        the silent loss the quarantine exists to prevent, one step later — so the content stays, the
        decision is attributed, and a database invariant refuses a resolution that names nobody.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        '200':
          description: The discarded event.
          content:
            application/json:
              schema:
                type: object
                required: [held]
                properties:
                  held: { $ref: '#/components/schemas/QuarantinedEvent' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Somebody has already decided about this event, or that event id has been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/assessments/instruments:
    get:
      operationId: listInstruments
      tags: [Assessments]
      summary: The questionnaires station 3 may run, and the ones it may not
      description: |
        The whole catalogue in one request, questions included, because a station tablet fetches it
        at the start of a clinic session and then works offline for the rest of the morning. Pass
        `names_only` for the list without the questions.

        **The unusable instruments are in the response.** `usable: false` with a `licence_note`
        saying exactly what has to be confirmed (D-26). Omitting them would make a decision look
        like an oversight, and a clinician who expected to find PHQ-9 would go looking for a bug.

        Readable by anybody who records or reads values: the questionnaire is published literature
        with no patient in it.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: names_only
          in: query
          schema: { type: string }
          description: Present to omit the questions and options.
        - name: version_only
          in: query
          schema: { type: string }
          description: Present to return `catalogue_version` alone. The cheapest possible re-check — a tablet that only wants to know whether the catalogue moved should not pay for five instruments to find out.
      responses:
        '200':
          description: The catalogue.
          content:
            application/json:
              schema:
                type: object
                required: [instruments, catalogue_version]
                properties:
                  instruments:
                    type: array
                    items: { $ref: '#/components/schemas/Instrument' }
                  catalogue_version:
                    type: string
                    format: date-time
                    description: When the catalogue last changed. A tablet holds it for a morning and works from it offline; without this the only signal that a version was republished is a 422 on an item code at submit, after the patient has answered.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/assessments:
    post:
      operationId: recordAssessment
      tags: [Assessments]
      summary: Record one questionnaire, answered
      description: |
        Needs `observation.write.lifestyle` — station 3's own permission, deliberately not a new
        one: an assessment is lifestyle data in another shape, and a second grant would be an
        access review with one more line and no more meaning.

        **The server decides what each answer is worth.** A client sends the option chosen; the
        score comes from the option table. A client that could send a score could send any total it
        liked, and the total is what §12 cohorts on.

        Answering again supersedes the previous response rather than replacing it — the same rule
        every clinical value follows, because an operator who ran the questionnaire twice because
        the patient corrected themselves has produced two facts, not one edit.

        The composite score is derived afterwards and returned beside the response as `scoring`.
        Its `score` is allowed to be **null**: below `minimum` assessed domains there is nothing
        honest to compute. The reason is on the payload — `assessed` and `missing` name the
        domains — because a client left to work that out has to re-implement which observation
        feeds which domain, and the day somebody adds a fifth domain every client that guessed is
        silently wrong about what is still needed.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id, instrument_code, answers]
              properties:
                event_id: { type: string, format: uuid }
                patient_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                instrument_code: { type: string }
                answers:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/InstrumentAnswerInput' }
      responses:
        '201':
          description: The response as stored, and the score if one could be computed.
          content:
            application/json:
              schema:
                type: object
                required: [response, scoring]
                properties:
                  response: { $ref: '#/components/schemas/InstrumentResponse' }
                  scoring: { $ref: '#/components/schemas/LifestyleScoring' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That event id has already been recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/assessments/score:
    post:
      operationId: scoreLifestyle
      tags: [Assessments]
      summary: Recompute the composite from the record as it stands
      description: |
        The commonest sequence at station 3 is "type the four numbers, save", which can take a
        patient from two assessed domains to four without any questionnaire being answered. A score
        that could only be produced by submitting a questionnaire would be stale exactly when the
        operator had just finished making it computable.

        Writes a new `LIFESTYLE_RISK` derived observation when there is enough to compute one, and
        returns the same `scoring` shape either way.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient_id]
              properties:
                patient_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
      responses:
        '200':
          description: The composite, or the reason there is not one.
          content:
            application/json:
              schema:
                type: object
                required: [scoring]
                properties:
                  scoring: { $ref: '#/components/schemas/LifestyleScoring' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: That idempotency key has already been used.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/quality/me:
    get:
      operationId: getMyQualityRecord
      tags: [Quality]
      summary: My own correction record
      description: |
        The record of the operator making the request, over a window ending now.

        **A session, and no permission.** The plan's stated risk for this checkpoint is that a
        metric which feels punitive makes staff hide their errors rather than correct them; an
        operator who has to be granted something before they may see their own error count is an
        operator who will assume the count is being kept from them. The handler reads the caller's
        own id from the session, so there is no version of this that returns somebody else's work,
        and there is no patient anywhere in the response.

        `corrections` is never returned without `entries`. Three corrections against four hundred
        entries and against forty are different facts, and only one of them is a problem — a rate
        without its denominator is exactly the number this design exists to avoid.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365 }
          description: |
            How many days the window covers. Thirty by default — the window the plan's own
            verification uses. A value outside the range is **refused with 422**, not silently
            replaced: a client asking for fourteen days and being given thirty has two windows
            pretending to be one, and every count on the screen is then a numerator over somebody
            else's denominator.
      responses:
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '200':
          description: The caller's own record.
          content:
            application/json:
              schema:
                type: object
                required: [record, mine]
                properties:
                  record: { $ref: '#/components/schemas/QualityRecord' }
                  mine:
                    type: boolean
                    description: Always true here; present so one client component serves both this and the supervisor's view.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/quality/thresholds:
    get:
      operationId: listQualityThresholds
      tags: [Quality]
      summary: What counts as a pattern worth looking at
      description: |
        The three shapes §4.3 names — repeated transcription errors, the same measurement going
        wrong again and again, and corrections clustering late in the day — with the numbers behind
        each and a sentence saying what it looks for.

        **Every one ships with `approved: false`.** The plan lists the thresholds as an open
        decision requiring approval, so they are rows rather than constants and the API reports the
        absence rather than hiding it, exactly as the critical-value table does.

        Readable with a session, for the same reason the record above is: an operator who can see a
        flag on their own record should be able to read what raised it without asking a supervisor
        to explain.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The thresholds.
          content:
            application/json:
              schema:
                type: object
                required: [thresholds]
                properties:
                  thresholds:
                    type: array
                    items:
                      type: object
                      required: [threshold, looks_for_en, looks_for_bn]
                      properties:
                        threshold: { $ref: '#/components/schemas/QualityThreshold' }
                        looks_for_en:
                          type: string
                          description: What this threshold looks for, in words. Rendered from the row rather than stored, so numbers that change cannot leave a sentence describing the old ones.
                        looks_for_bn:
                          type: string
                          description: The same sentence in Bangla, with Bengali numerals. This is the screen an operator reads to understand the rule that measures them, so an English-only sentence here is not a rendering choice.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/quality/operators:
    get:
      operationId: listOperatorQuality
      tags: [Quality]
      summary: Everybody who received a correction, with their denominators
      description: |
        The supervisor's list. Needs `quality.read.team`.

        **A roster by default, and that is the important part.** A list every row of which has at
        least one correction is structurally an accusation, whatever it is titled and however
        carefully each line is annotated. So the default includes everybody who recorded anything
        in the window — including the operators with four hundred entries and nothing corrected,
        who are the rows that make it a roster. Pass `only_corrected` to narrow it.

        Each line carries `entries`, the outcome split and `rate` beside `corrections`. `rate` is
        the **same arithmetic the record uses**, and null below `rate_floor` entries — a rate
        computed from four entries is noise, and rendering noise as a number invites somebody to
        act on it.

        Rows are ordered by employee code, not by count. Position in a list is itself a claim, and
        denominators printed beside a number do not undo it.

        Deactivated staff are listed with their status, for CP61's reason.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365 }
        - name: only_corrected
          in: query
          schema: { type: string }
          description: Present to list only the operators who received a correction in the window. Absent for the roster.
      responses:
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '200':
          description: The operators.
          content:
            application/json:
              schema:
                type: object
                required: [operators, window]
                properties:
                  operators:
                    type: array
                    items: { $ref: '#/components/schemas/QualityOperator' }
                  window: { $ref: '#/components/schemas/QualityWindow' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/quality/operators/{id}:
    get:
      operationId: getOperatorQuality
      tags: [Quality]
      summary: One operator's record
      description: |
        The same shape `/v1/quality/me` returns, for somebody else. Needs `quality.read.team`.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: The operator's record.
          content:
            application/json:
              schema:
                type: object
                required: [record, mine]
                properties:
                  record: { $ref: '#/components/schemas/QualityRecord' }
                  mine:
                    type: boolean
                    description: True when a supervisor is looking at their own record through this route.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/quality/flags:
    get:
      operationId: listQualityFlags
      tags: [Quality]
      summary: The patterns somebody should look at
      description: |
        Open flags raised inside the window, by default. Needs `quality.read.team`.

        A flag carries the count **and the denominator it was taken against**, both frozen at the
        moment it was raised so the evidence does not move when the window slides. It also carries
        `threshold_approved`, false on everything this system ships with — a flag raised on numbers
        no clinician has approved is a demonstration of the mechanism, not a finding.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365 }
          description: |
            The window, the same one the operator list and the records use.

            **An open flag is never outside it.** "What is still waiting" is not a question about a
            date range, so the window scopes what *happened* in it — raised or answered — and never
            hides something nobody has answered yet. Without that rule a supervisor at seven days
            saw a flag on somebody's record that was missing from the queue on the same screen, and
            a roster row saying "two waiting" beside a queue showing none.
        - name: operator_id
          in: query
          schema: { type: string, format: uuid }
        - name: all
          in: query
          schema: { type: string }
          description: Present to include answered flags.
      responses:
        '200':
          description: The flags.
          content:
            application/json:
              schema:
                type: object
                required: [flags]
                properties:
                  flags:
                    type: array
                    items: { $ref: '#/components/schemas/QualityFlag' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/quality/flags/{id}:
    get:
      operationId: getQualityFlag
      tags: [Quality]
      summary: One flag, with the corrections behind it
      description: |
        The supporting corrections a supervisor reads before saying anything to anybody: the
        request, the reason, the measurement code and the hour it was recorded.

        **No patient and no value.** A supervisor reading a patient's numbers through their staff's
        error history would be reading clinical data through a side door;
        `core.assert_no_quality_record_names_a_patient` refuses a row that carries either.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The flag.
          content:
            application/json:
              schema:
                type: object
                required: [flag]
                properties:
                  flag: { $ref: '#/components/schemas/QualityFlag' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/quality/flags/{id}/resolve:
    post:
      operationId: resolveQualityFlag
      tags: [Quality]
      summary: Answer a flag
      description: |
        Acknowledged means "I have seen this and I am doing something about it". Dismissed means
        "this is not a problem", and **a dismissal must say why** — the same rule a rejected
        correction follows, for the same reason: "no" with no reason teaches nobody anything.

        Neither deletes anything. Needs `quality.flag.resolve`.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACKNOWLEDGED, DISMISSED]
                resolution:
                  type: string
                  maxLength: 2000
                  description: Required on a dismissal; what the supervisor is doing about it, on an acknowledgement.
      responses:
        '200':
          description: The answered flag.
          content:
            application/json:
              schema:
                type: object
                required: [flag]
                properties:
                  flag: { $ref: '#/components/schemas/QualityFlag' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Somebody has already answered this flag.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/directory:
    get:
      operationId: getDirectory
      tags: [Directory]
      summary: The names behind the ids every clinical value carries
      description: |
        §4.2 asks that a reviewer see who entered a value **instantly, without digging**. Every
        clinical read already carries the author's id, the role they were wearing, the station and
        the device; what it does not carry is a name, and a uuid answers a different question from
        the one a physician is asking.

        The obvious alternative — joining the staff record into every clinical query — was
        rejected. A patient's timeline is hundreds of values written by a dozen people, and joining
        two rows onto each of them copies the same twelve names into every payload all day; worse,
        every future clinical read would have to remember the join or quietly render a blank. This
        is one small request per session, cached by the client, and it makes the name a *lookup*
        rather than a property of the value — which is what it actually is.

        **Deactivated staff and retired devices stay listed.** Attribution on a value taken last
        March names whoever took it, and much of what a reviewer asks about is somebody who has
        since left; a directory of current staff only would render a blank for exactly the person
        the question is about. `status` is reported so a screen can say "no longer at the clinic"
        rather than presenting a departed colleague as somebody to go and ask.

        Nothing sensitive is here: names, staff codes, device names, station names. No contact
        details, no credentials, no role grants — the role a value carries is the role its author
        was wearing at the time, which is on the value rather than on the person.

        A session is the only requirement. Every clinical screen renders attribution, so every role
        that may see a value may see who entered it; and there is no patient in this response.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The directory, as of the moment it was read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Directory'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/corrections/reasons:
    get:
      operationId: listCorrectionReasons
      tags: [Corrections]
      summary: The ways a value can be wrong
      description: |
        A code **and** free text, always. A code alone cannot say "the tape was against the wall,
        not the patient"; free text alone cannot be counted, and counting is the whole point —
        CP63's pattern detection is specifically about *repeated transcription errors*, and
        `transcription` on the reason is what makes that a query rather than a guess at what
        somebody meant by their note.

        Rows rather than an enum: the taxonomy is a proposal the plan lists as needing clinical
        and operational confirmation, and changing it should be a decision rather than a release.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The vocabulary, in the order a screen offers it.
          content:
            application/json:
              schema:
                type: object
                required: [reasons]
                properties:
                  reasons:
                    type: array
                    items:
                      $ref: '#/components/schemas/CorrectionReason'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/corrections/mine:
    get:
      operationId: listMyCorrections
      tags: [Corrections]
      summary: What I am being asked to fix
      description: |
        The operator's own queue, oldest first — a queue answered newest-first is a queue where the
        oldest request is never answered. Open ones only unless `all` is set.

        This is the routing §4.3 asks for, seen from the other end: the request went to the person
        who typed the value, because an operator who never learns they mistyped will mistype again,
        and a workflow where a supervisor quietly fixes everything produces a clean record and an
        operator who keeps making the same mistake.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: all
          in: query
          schema: { type: string }
          description: Present to include answered requests; absent for the queue.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The requests routed to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/CorrectionRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/corrections/{id}:
    get:
      operationId: getCorrectionRequest
      tags: [Corrections]
      summary: One correction request
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The request.
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/CorrectionRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/corrections/{id}/apply:
    post:
      operationId: applyCorrection
      tags: [Corrections]
      summary: Correct the value
      description: |
        Writes a **new** observation replacing the flagged one — the original is never altered, it
        keeps its row, stops being ACTIVE and stays queryable (criterion 1) — and then **recomputes
        every live derived value that was computed from that code**, each as a new row superseding
        the old one (criterion 3: versioned, not overwritten). All of it in one transaction,
        because a corrected height with a stale BMI beside it is worse than either an old height or
        a failed correction: it is two numbers that disagree, both looking equally official.

        The corrected value keeps the **original's effective time**. The measurement happened when
        it happened, and re-stamping it would move a point on a trend line to the moment somebody
        noticed the typo.

        Who may call it: the person the request was routed to, for their own work, needing no extra
        permission — asking somebody to hold a permission to fix their own mistake is how mistakes
        stay. Anybody else needs `observation.correct.approve`, and that writes
        `SUPERVISOR_OVERRIDE_APPLIED` rather than `CORRECTION_APPLIED`, because an operator's
        quality record must not read a supervisor's fix as though they had put it right themselves.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                event_id: { type: string, format: uuid }
                value: { type: number }
                unit: { type: string }
                value_text: { type: string }
                value_bool: { type: boolean }
                value_code: { type: string }
                note:
                  type: string
                  maxLength: 500
                  description: What the corrector wants the person who flagged it to know.
      responses:
        '200':
          description: The request, answered.
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/CorrectionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            Somebody else's request to answer. The refusal says whose, because an operator staring
            at a refused button needs to know who to find rather than what to retype.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CORRECTION_ALREADY_ANSWERED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/corrections/{id}/reject:
    post:
      operationId: rejectCorrection
      tags: [Corrections]
      summary: Say the value stands
      description: |
        A reason is required. "No" with no reason is how a flagging culture dies: the physician who
        flagged it learns nothing, cannot tell a disagreement from an oversight, and stops flagging
        — and a system nobody flags anything in has an audit trail and no quality signal.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                event_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: The request, refused with its reason.
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/CorrectionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CORRECTION_ALREADY_ANSWERED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/{id}/flag:
    post:
      operationId: flagObservation
      tags: [Corrections]
      summary: Say a value looks wrong
      description: |
        §4.3's 140/150 case begins here: a physician sees a height of 150 cm, is sure it is 140, and
        says so. The request is routed to **whoever typed the value** — not to a supervisor, not to
        a queue — because the point of the mechanism is that the person who made the mistake learns
        of it.

        Needs `observation.correct.request`, which the plan gives to the physician, QA and senior
        operators: saying "that number looks wrong" is a clinical judgement and must not require
        the authority to change somebody else's work.

        Refused with `422` on your own value: correct it rather than flagging it, or the request
        would put a correction on your own quality record that nobody asked you to make. Refused
        with `409` when somebody has already flagged it — a second flag is the same conversation,
        and two would route two corrections at one number.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason_code]
              properties:
                event_id: { type: string, format: uuid }
                reason_code: { type: string, example: TRANSCRIPTION }
                note:
                  type: string
                  maxLength: 500
                  description: What you actually saw. Read by the person being asked to correct it.
      responses:
        '201':
          description: The request, routed to whoever typed the value.
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/CorrectionRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`CORRECTION_ALREADY_OPEN`, or the value has already been replaced.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/assessments:
    get:
      operationId: listPatientAssessments
      tags: [Assessments]
      summary: Every questionnaire this patient has answered
      description: |
        Newest first, **including superseded responses**, because a questionnaire answered
        differently three months ago is exactly the change §12 is looking for.

        Each response carries its raw item answers, and a total computed from them.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The responses.
          content:
            application/json:
              schema:
                type: object
                required: [responses]
                properties:
                  responses:
                    type: array
                    items: { $ref: '#/components/schemas/InstrumentResponse' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/patients/{id}/lifestyle-scoring:
    get:
      operationId: getLifestyleScoring
      tags: [Assessments]
      summary: Where this patient stands, without writing anything
      description: |
        The same `scoring` shape the write endpoints return, computed and **not stored**.

        A screen must be able to ask "where does this patient stand" when it opens, and the writing
        version cannot answer that: a derived observation appended every time somebody opens a tab
        is ledger noise. It is also what the timeline and the physician dashboard want, since a
        stored `LIFESTYLE_RISK` carries how many domains went into it and not which.

        `score` here is always null — this endpoint does not derive. Read the patient's current
        `LIFESTYLE_RISK` observation for the last computed value.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: What has and has not been assessed.
          content:
            application/json:
              schema:
                type: object
                required: [scoring]
                properties:
                  scoring: { $ref: '#/components/schemas/LifestyleScoring' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/patients/{id}/corrections:
    get:
      operationId: listCorrectionsForPatient
      tags: [Corrections]
      summary: Every flag ever raised on this patient's values
      description: |
        What the value-history screen reads beside the observation chain: the corrections, with who
        asked, who was asked, why, and what happened. Newest first.

        Criterion 5 is that the history shows the complete chain with **both** attributions — the
        original author and the corrector — and this is the half of it that the observation rows
        cannot carry: an observation says who recorded it, and only the request says who said it
        was wrong and why.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: The requests, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/CorrectionRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/allergies/reactions:
    get:
      operationId: listAllergyReactions
      tags: [Allergies]
      summary: What an allergy can have done
      description: |
        The reaction vocabulary, short on purpose. A list nobody can hold in their head is one
        people pick the first item from, and this question gets asked in seconds while a queue
        waits.

        `is_emergency` is a property of the **reaction**, not of the severity somebody ticked
        beside it. Anaphylaxis is an emergency whatever was chosen, and a header uses this to
        decide what to lead with rather than trusting a dropdown.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The vocabulary, in the order a screen draws it.
          content:
            application/json:
              schema:
                type: object
                required: [reactions]
                properties:
                  reactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/AllergyReaction'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/allergies/assertion-rates:
    get:
      operationId: allergyAssertionRates
      tags: [Allergies]
      summary: Who asserts "no known allergies", and how often
      description: |
        The plan's own mitigation for the risk it names: **operators may assert NKA reflexively
        to clear the gate.**

        Deliberately a view and not a rule. An officer whose patients genuinely have no
        allergies sits near the top of this list, and so does one who taps the button without
        asking — which is precisely why it belongs in front of a QA officer rather than in an
        automatic threshold that would punish the first and be gamed by the second.

        A window, defaulting to the last thirty days, because a rate over all time flattens the
        thing somebody is looking for: a change in one operator's behaviour.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Assertions per operator over the window.
          content:
            application/json:
              schema:
                type: object
                required: [from, to, operators]
                properties:
                  from: { type: string, format: date-time }
                  to: { type: string, format: date-time }
                  operators:
                    type: array
                    items:
                      $ref: '#/components/schemas/AllergyAssertionRate'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/allergies/{allergyId}/withdraw:
    post:
      operationId: withdrawAllergy
      tags: [Allergies]
      summary: Take back an allergy that should not have been recorded
      description: |
        Never a deletion. An allergy somebody withdrew is one somebody disagreed with, and the
        next clinician reading the record needs to know a colleague once believed it — so the
        row stays, the reason is attached, and both halves show in the change history.

        Withdrawing the last recorded allergy can drop the patient's status back to whatever
        assertion stands behind it, or to nothing at all — which **re-closes the gate**. The
        response carries the resulting status for exactly that reason: the caller must not be
        left to guess.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: allergyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                event_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The patient's allergy state after the withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/allergies/assertions/{assertionId}/withdraw:
    post:
      operationId: withdrawAllergyAssertion
      tags: [Allergies]
      summary: Take back a "no known allergies" or an "unable to assess"
      description: |
        The one that matters is the first. An officer who tapped **no known allergies** on the
        wrong patient has put a claim into a clinical record that a prescriber will rely on, so
        the way back has to exist, be attributed, and leave a trace.

        Withdrawing the standing assertion re-closes the gate unless allergies are recorded, so
        the response says what the status now is.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: assertionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                event_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The patient's allergy state after the withdrawal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Already withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/allergies:
    get:
      operationId: getAllergyState
      tags: [Allergies]
      summary: The patient's allergy status, and what is recorded
      description: |
        **Criterion 3's endpoint.** Every patient-context screen reads this, and it answers the
        *status* as well as the list — because an empty list and "nobody has asked" are opposite
        facts, and a header that drew both as blank would be lying about one of them.

        | `status` | Means |
        | --- | --- |
        | `NONE_RECORDED` | nobody has asked. The gate is closed. |
        | `ALLERGIES_RECORDED` | one or more are on file |
        | `NO_KNOWN_ALLERGY` | asked, and the patient knows of none |
        | `UNABLE_TO_ASSESS` | asked, and the answer could not be got — with the reason |

        Allergies come back **worst first**: emergency reactions, then by severity. A header
        showing three of them shows the one that stops a heart at the top, rather than burying
        it under a rash from 1998.

        `satisfied` is the gate's own question, answered here so a screen can grey out the next
        button for the right reason instead of discovering the refusal on submit. It is not the
        enforcement — see the tag description.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The status, the allergies, and the standing assertion if there is one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyState'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

    post:
      operationId: recordAllergy
      tags: [Allergies]
      summary: Record one allergy
      description: |
        The substance is coded where the catalogue has it and in words where it does not. The
        escape hatch matters more here than anywhere else in the system: an allergy nobody
        could code is far more dangerous sitting in a note field than it is here, marked as
        uncoded and shown on every screen.

        The reaction is checked against the vocabulary rather than trusted, because the
        alternative is a row a header cannot render — and an allergy that shows as a blank line
        is worse than one nobody recorded, since the blank line reads as "checked, nothing
        found".

        Recording an allergy does **not** withdraw an earlier "no known allergies". Both are
        true statements about their own moment — somebody asked in March and was told there
        were none, somebody found one in June — and the record keeps both. A live allergy simply
        outranks any assertion when the status is worked out.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAllergyRequest'
      responses:
        '201':
          description: The patient's allergy state, now including this one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That `Idempotency-Key` belongs to another attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/allergies/assert:
    post:
      operationId: assertAllergyStatus
      tags: [Allergies]
      summary: State, in your own name, what the allergy answer is
      description: |
        **This endpoint is acceptance criterion 2.** "No Known Allergies" must never be a
        default or an empty field, and the only way to make that structural is to require a
        positive act with an actor behind it. There is no column anywhere in this system that
        means "no allergies" by being blank.

        **`UNABLE_TO_ASSESS` is why there is no override.** The unconscious patient and the
        child brought in by a neighbour who does not know are real, and the usual answer is a
        button that advances them anyway with a reason attached. That answer is wrong here, and
        the plan says why in its own risk note: a gate with a way past it is a gate people learn
        the shape of, and within a month the override is the normal path.

        So the third state *is* allergy status: somebody looked, somebody is named, and the
        record says what was found — which is emphatically **not** that the patient has no
        allergies. The medication safety engine will treat the two very differently, and it can
        only do that because they are different rows rather than one row and a missing one.

        It requires a reason for the same purpose: the point of the third state is that it is
        reviewable, and "we could not ask" with no reason is a silent gap wearing a label.
        `NO_KNOWN_ALLERGY` refuses a reason for the mirror reason — text nobody will ever read
        answering a question nobody asked.

        A new assertion supersedes the standing one. Both cannot be the current answer, and a
        status function picking between them by timestamp is a coin toss waiting to happen.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                event_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                kind:
                  type: string
                  enum: [NO_KNOWN_ALLERGY, UNABLE_TO_ASSESS]
                reason:
                  type: string
                  description: |
                    Required for `UNABLE_TO_ASSESS`, refused for `NO_KNOWN_ALLERGY`.
                  example: Patient is drowsy and no attendant present.
      responses:
        '201':
          description: The patient's allergy state after the assertion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllergyState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That `Idempotency-Key` belongs to another attempt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/allergies/history:
    get:
      operationId: listAllergyChanges
      tags: [Allergies]
      summary: Everything ever said about this patient's allergies
      description: |
        Withdrawn entries included, and they are the reason this exists. An allergy that was
        recorded and then taken back is a clinical event — somebody believed it, and somebody
        else disagreed — and both halves are worth reading before writing a prescription.

        Newest first.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The change history, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      $ref: '#/components/schemas/AllergyChange'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/history/kinds:
    get:
      operationId: listHistoryKinds
      tags: [History]
      summary: The six kinds of history, and what each one needs
      description: |
        Reference data a station app fetches once and then renders the right fields from.
        That is the point of returning the *rules* and not only the names: a screen that had
        to remember which kinds need a family relation would eventually ask for one on a
        complaint, or forget to ask on a family history.

        `code_system` names the catalogue each kind draws on — the clinic's own dictionary for
        complaints and medicines, ICD for comorbidities and family history. A picker that
        chose for itself could file an ICD diagnosis as a presenting complaint, and the record
        would then assert that a patient *presented with* type 2 diabetes, which is a claim
        nobody made. The server refuses that combination anyway; this is how a screen avoids
        offering it.

        `from_lifestyle_station` is what station 4 must **not** ask for. Smoking and alcohol
        belong to the lifestyle station's observation codes, and the plan asks that they be
        carried forward "without duplicate entry" — so they are shown from
        `/v1/patients/{id}/observations` and never re-entered here. A second copy would be two
        answers to one question with no way to tell which is current. The list is short today;
        smoking status and alcohol use arrive as observation codes with the lifestyle
        assessment checkpoint.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: The kinds, the relations, and what belongs to another station.
          content:
            application/json:
              schema:
                type: object
                required: [kinds, relations, from_lifestyle_station]
                properties:
                  kinds:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryKind'
                  relations:
                    type: array
                    items:
                      $ref: '#/components/schemas/FamilyRelation'
                  from_lifestyle_station:
                    type: array
                    items: { type: string }
                    description: Observation codes station 4 displays and never re-enters.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/history/uncoded:
    get:
      operationId: countUncodedHistory
      tags: [History]
      summary: How much of the record could not be coded
      description: |
        The number that keeps the escape hatch honest.

        Criterion 1 asks that complaints and comorbidities be coded rather than free text, and
        the catalogue will not have a code for everything a history officer meets. Refusing to
        record those items would push them into a note field where nothing can find them, so
        an item may carry no coding as long as it says what was meant — and every one of those
        is counted here, by kind.

        If this number grows, the catalogue is wrong rather than the officers. It is the list
        of concepts somebody should add.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: Uncoded items in this facility, by kind.
          content:
            application/json:
              schema:
                type: object
                required: [uncoded]
                properties:
                  uncoded:
                    type: object
                    additionalProperties: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/medical-history:
    get:
      operationId: listMedicalHistory
      tags: [History]
      summary: Everything currently believed about this patient
      description: |
        The list station 4 works from, in the order it asks: complaints, other conditions,
        family, operations, medicines, vaccinations.

        **Removed items are absent.** An item somebody removed is one somebody said should not
        have been recorded; it is in the ledger and it does not belong on this screen.

        **Resolved items are present.** "She had this and no longer does" is a clinical fact,
        and a list that hid it would make every follow-up look like a first visit.

        `confirmed_at` is the whole of criterion 3. An item with none has not been confirmed
        by anybody since it was recorded — which is exactly what a returning patient's list
        looks like, and what station 4 works through. There is no endpoint that stamps the
        list: confirming is one request per item, with a person behind each one.

        Not on this path: `/v1/patients/{id}/history` is the patient's **demographic
        corrections**, which is a different thing entirely.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The patient's history, in station order.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

    post:
      operationId: recordHistoryItem
      tags: [History]
      summary: Record one item
      description: |
        One item, one request, one event — never a whole history in one call.

        That is criterion 4. "Every item is individually attributed" is a property of the
        item, and a single HISTORY_TAKEN carrying twenty of them would make it a property of
        the list. The question people actually ask is "who wrote *that*", and it also makes
        removing one item distinguishable from rewriting the history.

        **The coding is three fields and they travel together.** All three may be absent when
        the catalogue has nothing for what the patient described — an uncoded item is allowed,
        visibly uncoded, and counted at `/v1/history/uncoded`. Two of the three is refused: a
        code with no version is a string.

        **`said` is not the code's title.** The catalogue says "Type 2 diabetes mellitus
        without complications"; the patient said "sugar since the flood". The second one is
        the clinical detail, and it is kept on coded items too.

        Which of the remaining fields are required is `/v1/history/kinds`' business and is
        enforced here: a family history without a relation and a complaint without a duration
        are both refused with the field named.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordHistoryItemRequest'
      responses:
        '201':
          description: The item as it was recorded.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/HistoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            That `Idempotency-Key` is already in use by an attempt still in flight, or was
            used for a different request. A retry of the *same* request is answered with the
            original response rather than recording a second item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/history/items/{itemId}:
    get:
      operationId: getHistoryItem
      tags: [History]
      summary: One item, removed ones included
      description: |
        Removed items are readable here and absent from the patient's list. A removal is
        something somebody may need to look at — with the reason attached — and hiding it
        entirely would mean the only way to see why is to read the ledger.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The item.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/HistoryItem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

    patch:
      operationId: amendHistoryItem
      tags: [History]
      summary: Change what is known about an item
      description: |
        What cannot change is what the item **is**: not the kind, not the coding, not who
        first recorded it. Changing those is removing one item and adding another, and
        collapsing the two acts is how an audit trail stops answering "when did this become
        metformin".

        An amendment **confirms as it changes**. Somebody has just made a fresh assertion
        about this item, and leaving `confirmed_at` behind would show an item edited a minute
        ago as one nobody has looked at since last month — which is precisely the list station
        4 works from.

        Every field is optional and absent means unchanged. An empty string clears the field;
        omitting it leaves it alone. Those are different requests, and a screen has to be able
        to make both.

        `status: RESOLVED` is not a removal. "She had this and no longer does" is a clinical
        fact worth keeping; "this was never true" is `POST /remove`, and it needs a reason.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmendHistoryItemRequest'
      responses:
        '200':
          description: The item as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/HistoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That item was removed. A removed item is not amendable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/history/items/{itemId}/confirm:
    post:
      operationId: confirmHistoryItem
      tags: [History]
      summary: Say that a carried-forward item is still true
      description: |
        **This endpoint is acceptance criterion 3.**

        Every other design that satisfies the words — a flag the read sets, a column default,
        an endpoint that stamps a whole list — satisfies them by making the assertion on
        somebody's behalf. A system that silently rolled last month's history into this
        month's would eventually assert, in a signed clinical document, that a patient is on a
        drug they stopped in March, and nobody could say who claimed it, because nobody did.

        So a confirmation is an event with an actor, and **twenty items carried forward is
        twenty requests**. There is deliberately no batch: a "confirm all" button produces one
        action from a person and twenty assertions in the record, which is the auto-acceptance
        this criterion forbids, wearing a person's name.

        A separate permission from writing, because confirming is answering a question rather
        than asserting a new fact — at a follow-up the patient often reaches the examination
        station without seeing the history officer, and an unconfirmed list is worse than a
        confirmed one.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_id:
                  type: string
                  format: uuid
                  description: |
                    The client's idempotency key. Optional from a browser; a tablet sends its
                    own, which is what makes a history confirmed over a bad connection produce
                    one confirmation rather than four.
                visit_id: { type: string, format: uuid }
      responses:
        '200':
          description: The item, now confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/HistoryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That item was removed. A removed item cannot be confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/history/items/{itemId}/remove:
    post:
      operationId: removeHistoryItem
      tags: [History]
      summary: Mark an item as one that should not have been recorded
      description: |
        Not a deletion, and not the same as resolving it.

        "She had this and no longer does" is `PATCH` with `status: RESOLVED` — a clinical fact
        worth keeping. "This was never true" is this endpoint, and it takes a **reason**,
        because an item somebody removed is an item somebody disagreed with, and what they
        disagreed with is the interesting part. The row stays; the ledger keeps both events.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                event_id: { type: string, format: uuid }
                visit_id: { type: string, format: uuid }
                reason:
                  type: string
                  minLength: 1
                  description: Why this should not have been recorded.
                  example: Recorded on the wrong patient.
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: That item was already removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/terminology/systems:
    get:
      operationId: listCodeSystems
      tags: [Terminology]
      summary: The terminologies this clinic holds
      description: |
        Which code systems exist, who publishes each, and — the part that matters — whether
        this deployment may use it.

        `usable: false` with a `licence_note` is not a bug and not an empty catalogue. It is
        SNOMED CT, registered so the mapping table can name it as a target, refused until D-24
        answers whether Bangladesh confers free Affiliate use. A client that cannot offer
        SNOMED in its picker should be able to say why, and this is where it reads the reason.

        `default_version` is what a search resolves to when the caller names none. A system may
        be registered with no version at all — ICD-11 is, today — in which case a caller must
        name one explicitly the moment content is loaded.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
      responses:
        '200':
          description: Every registered terminology, by code.
          content:
            application/json:
              schema:
                type: object
                required: [systems]
                properties:
                  systems:
                    type: array
                    items:
                      $ref: '#/components/schemas/CodeSystem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/terminology/search:
    get:
      operationId: searchTerminology
      tags: [Terminology]
      summary: Find a concept
      description: |
        Autocomplete for a coded field, in English and Bengali, tolerant of a misspelling.

        **The four tiers**, returned with every row as `tier`:

        1. the code itself, typed. `E11` finds `E11` first.
        2. a clinic favourite whose words start with what was typed.
        3. anything else whose title or synonym has a word starting with it.
        4. the trigram tier: `diabetis` still finds diabetes, above a floor loose enough for a
           real typo and tight enough that a single letter does not return the catalogue.

        Matching is on **word starts**, not string prefixes. A clinician typing `dia` means
        diabetes, and a plain prefix match would answer "Diabetic polyneuropathy" before
        "Type 2 diabetes mellitus" — which is the diagnosis this clinic makes more often than
        any other.

        **An empty `q` is the favourites, not everything and not an error.** A picker opens
        before anybody has typed, and what it should show then is the clinic's own twenty.

        The `version` in the response is the one that was searched, resolved from the system's
        default when the caller named none. Stamp that on the coding — not a version the
        client assumed.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: system
          in: query
          required: true
          schema: { type: string, example: ICD10 }
          description: The terminology to search. Case-insensitive.
        - name: version
          in: query
          required: false
          schema: { type: string, example: '2019' }
          description: |
            Which version. Omit for the system's default — the response says which was used.
            A version this deployment has not loaded is refused rather than silently replaced
            by the default: a coding stamped with a version nobody searched is a lie that is
            only discovered years later.
        - name: q
          in: query
          required: false
          schema: { type: string, example: dia }
          description: What was typed. Empty returns the favourites.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 25, default: 25 }
          description: |
            How many results. Capped at 25 — a picker showing more is one nobody reads to the
            bottom of, and the answer to a query with three hundred matches is a better query.
      responses:
        '200':
          description: Matching concepts, best first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/terminology/favourites:
    get:
      operationId: listTerminologyFavourites
      tags: [Terminology]
      summary: The clinic's own list
      description: |
        The diagnoses this clinic actually makes, in the order somebody ranked them.

        This is how criterion 1 — the twenty most common DTHC diagnoses each findable within
        three keystrokes — is met: by knowing which twenty, not by a cleverer search. It is
        also what a picker shows before a single key is pressed, which is the majority of the
        times it is opened.

        Its own endpoint as well as the empty-query behaviour of `search`, because a screen
        that opens on a list should not have to send a search to get one.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: system
          in: query
          required: true
          schema: { type: string, example: ICD10 }
        - name: version
          in: query
          required: false
          schema: { type: string, example: '2019' }
          description: Omit for the system's default — the response says which was used.
      responses:
        '200':
          description: The ranked list, in rank order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConceptList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/terminology/concept:
    get:
      operationId: getConcept
      tags: [Terminology]
      summary: One concept, and where it maps
      description: |
        Reads a single coding back, so a screen can render a diagnosis recorded years ago
        under a version nobody uses any more.

        Query parameters rather than path segments on purpose: an ICD-10 code contains a full
        stop, a version may contain whatever the publisher chose, and neither belongs in a
        path a proxy might normalise on the way.

        `mappings` is empty until D-24 answers. The field exists now so that the day it does,
        nothing on either side of this endpoint changes.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: system
          in: query
          required: true
          schema: { type: string, example: ICD10 }
        - name: version
          in: query
          required: false
          schema: { type: string, example: '2019' }
        - name: code
          in: query
          required: true
          schema: { type: string, example: E11.9 }
      responses:
        '200':
          description: The concept and its mappings.
          content:
            application/json:
              schema:
                type: object
                required: [concept, mappings]
                properties:
                  concept:
                    $ref: '#/components/schemas/Concept'
                  mappings:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConceptMapping'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations:
    post:
      operationId: recordObservation
      tags: [Observations]
      summary: Record a measured value
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
      description: |
        One endpoint for every station. The permission needed is **the one the code declares**
        — `observation.write.anthro` for a height, `observation.write.vitals` for a blood
        pressure — checked against the **active role**, not the union of every role the caller
        holds. An operator wearing the anthropometry hat cannot record a blood pressure even if
        they also hold the clinical-assistant role, because the event would then be attributed
        to a role not allowed to have taken it [R-02].

        **A unit-bearing value cannot be recorded without its unit.** `value` and `unit` are
        what was *entered* — 154 and lb — and the server stores both those and the canonical
        conversion. Reading the value back in the unit it was entered in is therefore a read,
        not a round trip.

        A value outside the code's plausibility band is refused as a validation error. That is
        a typing check, not a clinical one: critical values arrive at CP50.

        Setting `replaces` corrects or supersedes an earlier observation. `CORRECTED` means it
        was wrong; `SUPERSEDED` means it was right and has been re-measured. Two different
        facts, and a report that conflated them would count re-measurements as an error rate.
        Nothing is ever deleted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationRequest'
      responses:
        '201':
          description: Recorded, with the canonical value the server derived.
          content:
            application/json:
              schema:
                type: object
                required: [observation]
                properties:
                  observation:
                    $ref: '#/components/schemas/Observation'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/observations/{id}:
    get:
      operationId: getObservation
      tags: [Observations]
      summary: One recorded value
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `observation.read.values`. An observation belonging to another facility answers
        `404`, the same as one that does not exist: a refusal must not reveal whether a
        resource exists.
      responses:
        '200':
          description: The observation.
          content:
            application/json:
              schema:
                type: object
                required: [observation]
                properties:
                  observation:
                    $ref: '#/components/schemas/Observation'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/alerts:
    get:
      operationId: listPatientAlerts
      tags: [Alerts]
      summary: One patient's critical values, acknowledged ones included
      description: |
        What a physician reads before deciding whether today's reading is the first of its
        kind. A saturation of 90% in somebody who has had three this year is a different
        conversation from a first one.

        Acknowledged alerts stay: an alert that disappeared once somebody answered it would
        make the record say the episode never happened.
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: This patient's alerts, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/CriticalAlert'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/growth:
    get:
      operationId: patientGrowth
      tags: [Observations]
      summary: This child's growth percentiles and trajectory
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Height-, weight- and BMI-for-age percentiles and z-scores from the **exact age in
        days**, every one naming the standard and version that produced it (D-21).

        `applicable` is false when there is no reference for this patient — an adult, a
        patient whose recorded sex the published tables do not cover, or a child with nothing
        measured yet — and `note` says which. That is a plain fact a screen should state, not
        an error: a paediatric percentile for a 41-year-old would be a number that looks like
        every other number on the screen and means nothing.

        A point where `standard_changed` is true is where the reference switched at 5.0 years.
        D-21 requires that to be visible rather than silent, and percentiles either side of it
        are never compared numerically.

        `weight_status` is [R-06]'s childhood obesity flag, read off the current BMI-for-age.
        `percent_of_95th` is CDC's own severity convention — above the 99th percentile the
        percentile scale stops telling two very different children apart, and this does not.
      responses:
        '200':
          description: The growth picture, or an explicit note that there is none.
          content:
            application/json:
              schema:
                type: object
                required: [growth]
                properties:
                  growth:
                    $ref: '#/components/schemas/Growth'
                  weight_status:
                    $ref: '#/components/schemas/WeightStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/observations:
    get:
      operationId: listPatientObservations
      tags: [Observations]
      summary: This patient's current values
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [ANTHRO, VITAL, EXAM, LAB, DERIVED, SCREENING, PRO]
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      description: |
        Needs `observation.read.values`. The **current** value of everything: corrected and
        superseded rows are history, and history is read per code.
      responses:
        '200':
          description: The current values.
          content:
            application/json:
              schema:
                type: object
                required: [observations]
                properties:
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/observations/{code}/history:
    get:
      operationId: listObservationHistory
      tags: [Observations]
      summary: Every value ever recorded for one code
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      description: |
        Needs `observation.read.values`. Includes the replaced rows — this is what a trend line
        reads, and what somebody asking "what did it say before" reads.
      responses:
        '200':
          description: The history, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [observations]
                properties:
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
