      description: |
        Needs `patient.consent.record`. The active version of every consent's text, in one
        language, as it must be shown to the patient before it is taken.

        **The wording is a legal dependency (D-02).** Until it is approved and loaded, this
        returns an empty list and taking a consent answers `503` — which is the honest state
        of a deployment that is not finished, rather than a consent recorded against no words.
      responses:
        '200':
          description: The active templates.
          content:
            application/json:
              schema:
                type: object
                required: [language, templates]
