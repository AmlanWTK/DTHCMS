        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `visit.attend`.

        **A patient cannot be at one station twice at once.** Held by a partial unique index,
        because two tablets pressing "start" in the same second is a race no handler wins; the
        second gets `409`.
      requestBody:
