  /v1/patients/{id}/timeline:
    get:
      operationId: getPatientTimeline
      tags: [Patients]
      summary: Everything known about a patient, in order
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string }
          description: A date (`2026-01-31`, read in the clinic's calendar) or a full timestamp.
        - name: to
          in: query
          required: false
          schema: { type: string }
          description: |
            The end of the range. A date-only value means the whole of that day — somebody
            asking for 1 to 31 January means January, and an exclusive bound at midnight
            would silently drop the last day.
        - name: types
          in: query
          required: false
          schema: { type: string }
          description: |
            A comma-separated list of categories. An unknown one is refused rather than
            ignored: silently returning everything is how a "medication only" screen shows a
            diagnosis to somebody who filtered it out.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      description: |
        Needs `patient.read.demographics`. One chronological read of everything known about a
        patient, in a shape every kind shares: `occurred_at`, `category`, `kind`, a bilingual
        label, a value and its unit, attribution, and flags.

        **Every row carries attribution** — who recorded it, in which role, at which station
        — denormalised rather than joined, so hover-to-see-who works everywhere (§8).

        **Rows the caller may not see are filtered in the database**, not in the response. A
        post-filter is how a total comes back larger than the rows returned, and how paging
        skips what it hid.

        `occurred_at` is when it happened; `recorded_at` is when it reached the system. A
        vital taken at 09:10 and entered at 11:40 belongs at 09:10, and the difference is
        worth seeing.
      responses:
        '200':
          description: The timeline, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientTimeline'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/photo:
    get:
      operationId: getPatientPhotoURL
      tags: [Patients]
      summary: A short-lived URL for the patient's photograph
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: ttl_seconds
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 900 }
          description: |
            Shorter than the ceiling if the caller wants; never longer. A wall display asks
            for more than a form does, and neither chooses the maximum.
      description: |
        Needs `patient.read.demographics`.

        **No object is ever public, in any environment.** The URL is signed, expires within
        fifteen minutes, and is minted per request rather than stored — a URL in a database
        row is one that has expired by the time anybody reads it and cannot be told from one
        that never worked. The signature covers the method and the path, so it cannot be
        edited into a URL for another photograph or replayed to write.
      responses:
        '200':
          description: The signed URL.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: attachPatientPhoto
      tags: [Patients]
      summary: The photograph has been uploaded
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `patient.write.demographics`. Call after the upload URL has been used.

        The server **reads the object back** before believing anything about it: a client
        that says "two megabytes of JPEG" and uploaded nothing, or uploaded something else,
        is a client whose word cannot be the record — the row would point at an object nobody
        can render. Size and digest come from the object, not from this body.

        A replacement is a new object and a new event. Nothing is overwritten, so a chart
        printed last month showing a different face can still be explained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientPhotoAttach'
      responses:
        '201':
          description: Attached, with a URL to display it.
          content:
            application/json:
              schema:
                type: object
                required: [photo]
                properties:
                  photo:
                    $ref: '#/components/schemas/PatientPhoto'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/photo/upload-url:
    post:
      operationId: createPatientPhotoUpload
      tags: [Patients]
      summary: Where to upload the photograph
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActiveRole'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `patient.write.demographics`.

        Returns a pre-signed `PUT`. The bytes go **straight to storage** and never through
        this API — not for bandwidth, but because a photograph that never enters the API
        process cannot end up in a request log, a crash dump, a proxy's buffer or a temporary
        file, which is where PHI images turn up in incident reports.

        `object_key` is the **server's**. Send it back unchanged when attaching; a key a
        client could choose is a key that can be pointed at somebody else's photograph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content_type]
              properties:
                content_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
      responses:
        '200':
          description: The upload ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoUploadTicket'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

  /v1/patients/{id}/merge:
    post:
      operationId: mergePatient
      tags: [Patients]
      summary: Two records are one person
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/StepUpToken'
        - name: id
          in: path
          required: true
          description: The record that stays.
          schema: { type: string, format: uuid }
      description: |
        Needs `patient.merge` **and** a `patient_merge` step-up. Two clinical histories become
        one, and the change is irreversible in effect however well the decision is recorded,
        so a session left open on a desk must not be able to do it.

        A merge is a **redirect, never a delete**. The losing record keeps its row, its status
        becomes `merged`, and it points at the survivor; every event ever written against it
        still names it with its original attribution, and a query follows the chain. Nothing
        is lost and nothing is rewritten.

        `justification` is required and must be something a reviewer can act on — "duplicate"
        is not a justification. The candidate list that was on screen is stored with the
        decision, so "why did we merge these two" is answerable after the matcher's weights
        have been retuned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientMergeRequest'
      responses:
        '200':
          description: Merged. The survivor is returned.
          content:
            application/json:
              schema:
                type: object
                required: [survivor, event_id]
                properties:
                  survivor:
                    $ref: '#/components/schemas/Patient'
                  event_id:
                    type: string
                    format: uuid
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'

