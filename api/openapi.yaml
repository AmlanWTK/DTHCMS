        All four are required. A database invariant refuses a closed visit missing any of
        them, because a closed visit that cannot answer "which patient came when, with what
        problem" is a visit that was not worth recording.

        A closed visit **cannot then be edited in place**: a trigger refuses it. Reopening is
        the path, and reopening is recorded.
      requestBody:
        required: true
