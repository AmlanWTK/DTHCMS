  /v1/audit/export:
    get:
      operationId: exportAuditTrail
      tags: [Audit]
      summary: The filtered trail as a signed PDF
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: actor
          in: query
          required: false
          schema: { type: string }
        - name: person
          in: query
          required: false
          schema: { type: string }
        - name: patient
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      description: |
        Needs `audit.read`. At most 500 entries, oldest first, English sentences. The
        signature travels in the `X-Audit-Signature` header (base64 Ed25519 over the SHA-256
        of the body), with `X-Audit-Key-Id` and `X-Audit-Digest`; save the three beside the
        file. Verify offline with `go run ./tools/auditverify`. The export is recorded
        (`audit.exported`) before it is produced.
      responses:
        '200':
          description: The PDF.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
            X-Audit-Signature:
              description: Base64 Ed25519 signature over the SHA-256 of the body.
              schema: { type: string }
            X-Audit-Key-Id:
              description: Which signing key; matches `/v1/audit/signing-key`.
              schema: { type: string }
            X-Audit-Digest:
              description: Base64 SHA-256 of the body.
              schema: { type: string }
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
