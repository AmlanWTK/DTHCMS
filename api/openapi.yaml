          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: encounterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `visit.attend`.

        `bounced` is its own outcome rather than a completed touch with a note, because §14.2
        counts rework and a bounce recorded as "completed" makes rework invisible — which is
        the one number a quality gate exists to produce.

        An encounter ends once. A patient returning to a station is a new encounter, which is
        what makes rework countable.
      requestBody:
        required: true
