          schema: { type: string, format: uuid }
      description: |
        Needs `patient.read.demographics`.

        **Every consent type is returned, including the ones never asked about**, with status
        `absent`. A list of only what exists cannot show a desk what it has not done, and
        "we never asked" is the answer that matters at the point of care. `absent` and
        `revoked` are deliberately different: never asked, and asked and withdrawn, are
        different failures and want different words on a screen.
      responses:
        '200':
          description: Every consent type and where it stands.
          content:
            application/json:
              schema:
                type: object
                required: [consents]
                properties:
                  consents:
                    type: array
                    items:
                      $ref: '#/components/schemas/PatientConsent'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
    post:
      operationId: grantPatientConsent
      tags: [Consent]
      summary: Record a consent
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `patient.consent.record`.

        **The template version is the server's, not the client's.** A client that could name
        the version it consented against could record a consent to words the patient never
        saw; the server looks up the wording in force, and the version, the language and the
        digest of the exact text go into the event.

        A signature or thumbprint needs its image: ask for an upload URL first, upload the
        PNG straight to storage, then send the key here. The bytes never pass through the API.

        A thumbprint or a verbal attestation also needs a **witness** — those are the two
        methods where the only other party is the operator recording it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentGrantRequest'
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [consent]
                properties:
                  consent:
                    $ref: '#/components/schemas/PatientConsent'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/Internal'
