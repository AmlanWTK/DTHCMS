      tags: [Queue]
      summary: Take a patient out of a queue
      parameters:
        - $ref: '#/components/parameters/ActiveRole'
        - $ref: '#/components/parameters/RequestedWith'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: entryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      description: |
        Needs `visit.attend`.

        A **reroute** says where the patient went and why. "Sent elsewhere" with no elsewhere
        is a patient nobody can find, and a reroute with no reason is a decision nobody can
        review — both are refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueLeaveRequest'
      responses:
