    BreakGlassRequest:
      type: object
      additionalProperties: false
      required: [scope_kind, scope_ref, justification]
      properties:
        scope_kind:
          type: string
          enum: [patient, other]
        scope_ref:
          type: string
          description: The patient id, or what else is being reached.
        justification:
          type: string
          minLength: 20
        hours:
          type: integer
          minimum: 1
          maximum: 24
          description: How long; default four hours.

    PatientRegistration:
      type: object
      additionalProperties: false
      required:
        [
          event_id,
          name_en,
          sex,
          birth_date,
          dob_precision,
          dob_source,
          phone_primary,
          consent_reference,
        ]
      description: |
        A registration as the desk fills it in. The required set is the **clinical minimum**,
        confirmed with the clinical lead: an English name, a sex, a date of birth with its
        precision and source, one mobile, and the consent record. Everything else is prompted
        and skippable, so a record can be completed while the patient walks to the next
        station rather than a queue being held for an income band nobody present knows.
      properties:
        event_id:
          type: string
          format: uuid
          description: |
            Client-generated, UUIDv7, and the idempotency key. Sending the same one twice
            registers one patient; the second call returns `200` and `duplicate: true`.
        name_en:
          type: string
          maxLength: 120
        name_bn:
          type: string
          maxLength: 120
        sex:
          type: string
          enum: [female, male, other]
          description: |
            Three values, because the clinical questions that use it — reference ranges,
            pregnancy, percentile curves — have three answers and not two.
        birth_date:
          type: string
          format: date
          description: |
            YYYY-MM-DD, on the clinic's calendar (Asia/Dhaka). Mandatory: pediatric
            percentile calculation depends on exact age. Not in the future, and nothing
            implying an age over 130.
        dob_precision:
          type: string
          enum: [day, month, year]
          description: |
            How much of the date is real. A patient who knows only their birth year is
            recorded as 1 January with `year` — honest, sortable, and filterable — rather
            than given an invented day that a percentile would treat as exact.
        dob_source:
          type: string
          enum:
            [
              birth_certificate,
              national_id,
              passport,
              immunisation_card,
              patient_stated,
              guardian_stated,
              estimated,
            ]
          description: |
            What established the date. A document source with less than `day` precision is
            refused: a birth certificate has a day on it, and the combination is almost
            always a transcription error.
        phone_primary:
          type: string
          description: |
            A Bangladeshi mobile. `01712345678`, `+8801712345678`, `8801712345678` and
            `1712345678` are one number; all are stored as `+8801712345678`.
        phone_secondary:
          type: string
          description: A landline or an overseas number, or empty.
        division: { type: string }
        district: { type: string }
        upazila: { type: string }
        address_line: { type: string }
        postcode: { type: string }
        emergency_name: { type: string }
        emergency_relation: { type: string }
        emergency_phone: { type: string }
        education_level:
          type: string
          enum:
            [none, primary, secondary, higher_secondary, graduate, postgraduate, madrasa, unknown]
        occupation_category:
          type: string
          enum:
            [
              agriculture,
              day_labour,
              factory_worker,
              service_private,
              service_government,
              business,
              homemaker,
              student,
              retired,
              unemployed,
              other,
              unknown,
            ]
        income_band:
          type: string
          enum: [under_10k, 10k_25k, 25k_50k, 50k_100k, over_100k, unknown]
          description: Monthly household income in BDT.
        household_size:
          type: integer
          minimum: 1
          maximum: 40
        residence_type:
          type: string
          enum: [urban, semi_urban, rural, unknown]
        medicine_payer:
          type: string
          enum: [self, family, employer, ngo, government, unknown]
          description: |
            Who pays for the patient's medicines. Absent means not captured; `unknown` means
            asked and not known — a household that cannot say is a different cohort from one
            that was never asked, and both are legitimate answers.
        identifiers:
          type: object
          description: |
            Identity numbers as typed or read by OCR, keyed by kind. Hashed under a
            deployment pepper and sealed with the key ring before they reach a column; never
            returned, never logged, and never written into an event.
          additionalProperties:
            type: string
          propertyNames:
            enum: [national_id, birth_certificate, passport, driving_licence, other]
        consent_reference:
          type: string
          description: |
            The consent record this registration was taken under. Required: a patient record
            with no consent behind it is one nothing may lawfully be done with.

    PatientSearchResult:
      type: object
      additionalProperties: false
      required:
        [
          patient_id,
          clinical_id,
          name_en,
          name_bn,
          sex,
          birth_date,
          dob_precision,
          age,
          phone_masked,
          district,
          upazila,
          status,
          registered_at,
          rank,
        ]
      properties:
        patient_id: { type: string, format: uuid }
        clinical_id: { type: string }
        name_en: { type: string }
        name_bn: { type: string }
        sex: { type: string, enum: [female, male, other] }
        birth_date: { type: string, format: date }
        dob_precision:
          type: string
          enum: [day, month, year]
          description: |
            Shown beside the age, always. An age derived from a year-precision date can be a
            year out either way, and a list that hides that invites a wrong identification.
        age: { type: integer }
        phone_masked:
          type: string
          description: The last four digits. A result list is the screen most often read over an operator's shoulder.
        district: { type: string }
        upazila: { type: string }
        status: { type: string, enum: [active, inactive, deceased, merged] }
        merged_into_id: { type: string, format: uuid }
        registered_at: { type: string, format: date-time }
        rank:
          type: number
          minimum: 0
          maximum: 1
          description: |
            How good the match is. 1 for a clinical id or a telephone number; lower for a
            name. A screen can say "exact" against the first and stay quiet against the rest.

